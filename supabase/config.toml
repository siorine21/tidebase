# Supabase プロジェクト設定（Edge Functions）
# tide は公的データのみを返すため認証不要（D-009 / D-021）

[functions.tide]
verify_jwt = false

# invite は「まだアカウントがない人」が叩くため認証を要求できない。
# 認可はトークン（UUID v4）の所持で行う（supabase/functions/invite/index.ts）
[functions.invite]
verify_jwt = false

# resolve-map-link は外へ取りに行くので、ログイン済みの人だけに絞る（D-072）。
# ただし verify_jwt = true でも publishable（anon）キーだけで通ってしまうため、
# 関数の中でも利用者のトークンかどうかを確かめている。
[functions.resolve-map-link]
verify_jwt = true
