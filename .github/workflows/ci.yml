name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読むだけで足りる。外部の Action も秘密も使っていないので、
# リポジトリ既定の権限（書き込みを含みうる）で走らせる理由が無い（D-124）
permissions:
  contents: read

jobs:
  db-tests:
    name: DB migrations & triggers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: db/tests/run_local.sh

  edge-tests:
    name: Edge Function (tide parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g typescript
      - run: make test-edge

  frontend-tests:
    name: Frontend (潮位グラフの平滑化)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test-frontend
