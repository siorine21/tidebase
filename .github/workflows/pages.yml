# フロント（frontend/）を GitHub Pages へデプロイする（D-022）
# 前提: リポジトリが public で、Settings → Pages の Source が「GitHub Actions」
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # 配る中身に版を打つ（D-088）。
      # GitHub Pages は HTML も CSS も JS も max-age=600 で配るので、
      # 版を付けないと端末に古いものが残り、「配ったのに変わらない」が起きる。
      # - assets/version.json … 画面から no-store で取り直して新旧を比べる
      # - ?v=<sha> …………………… 中身が変わったら URL も変わるので必ず取り直される
      - name: 資産に版を打つ
        run: |
          set -eu
          V="${GITHUB_SHA::8}"
          cd frontend
          printf '{ "v": "%s" }\n' "$V" > assets/version.json
          find . -maxdepth 1 -name '*.html' -print0 | xargs -0 sed -i \
            -e "s#assets/theme\.css\"#assets/theme.css?v=$V\"#g" \
            -e "s#assets/config\.js\"#assets/config.js?v=$V\"#g" \
            -e "s#\./assets/app\.js\"#./assets/app.js?v=$V\"#g"
          sed -i \
            -e "s#\"\./icons\.js\"#\"./icons.js?v=$V\"#g" \
            -e "s#__APP_VERSION__#$V#" assets/app.js
          # Service Worker も版で分ける（D-096）。殻のキャッシュ名がこれで変わり、
          # 中身が 1 文字変わればブラウザが更新に気づく。sw.js の URL には版を付けない
          sed -i -e "s#__APP_VERSION__#$V#" sw.js
          grep -q "$V" assets/app.js
          grep -q "$V" sw.js
          ! grep -q "__APP_VERSION__" sw.js assets/app.js
          grep -q "theme.css?v=$V" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
