<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATCH LOG | TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-006 釣果日誌一覧 -->
<header class="app-header">
  <h1>CATCH LOG</h1>
  <span class="page-sub" id="count">—</span>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>

  <div class="card">
    <div class="row-2">
      <div class="field" style="margin:0">
        <label for="filter-spot">スポット</label>
        <select id="filter-spot"><option value="">すべて</option></select>
      </div>
      <div class="field" style="margin:0">
        <label for="filter-kind">種別</label>
        <!-- 到達段階ごとに絞る（D-092）。「反応あり」は釣果＋バラシ＋ミスバイト -->
        <select id="filter-kind">
          <option value="">すべて</option>
          <option value="landed">釣果のみ</option>
          <option value="reaction">反応あり（釣果・バラシ・アタリ）</option>
          <option value="lost">バラシのみ</option>
          <option value="bite">ミスバイトのみ</option>
          <option value="sighting">目視のみ</option>
          <option value="none">何も無しのみ</option>
        </select>
      </div>
    </div>
    <div class="field" id="owner-field" style="margin:10px 0 0" hidden>
      <label for="filter-owner">投稿者</label>
      <select id="filter-owner">
        <option value="mine">自分の釣果</option>
        <option value="all">グループ全員</option>
        <option value="others">メンバーの釣果</option>
      </select>
    </div>
    <div id="recipe-filter" hidden style="margin-top:10px">
      <span class="tag tag-mustard" id="recipe-filter-label"></span>
      <button type="button" class="chip" id="clear-recipe" style="margin-left:6px" data-icon="close">解除</button>
    </div>
  </div>

  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<a class="fab" href="record-new.html" title="釣果を記録" data-icon="plus"></a>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    requireSession, renderNav, escapeHtml, lureCategoryText, ownerBadge, listRecords, listSpots,
    formatJstDate, relativeDays, icon, recordFishName, signedPhotoUrls,
    recordOutcome,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("records");

  if (new URLSearchParams(location.search).get("saved")) {
    const box = document.getElementById("message");
    box.textContent = "釣果を記録しました。";
    box.className = "message success";
    box.hidden = false;
    history.replaceState(null, "", "records.html");
  }

  const [records, spots] = await Promise.all([
    listRecords({ limit: 200 }).catch(() => []),
    listSpots().catch(() => []),
  ]);

  document.getElementById("filter-spot").insertAdjacentHTML("beforeend",
    spots.map((s) => `<option value="${s.id}">${escapeHtml(s.name ?? "無名スポット")}</option>`).join(""));

  // スポット詳細（SCR-005）の「すべて見る」からの絞り込み
  const spotParam = new URLSearchParams(location.search).get("spot");
  if (spotParam) document.getElementById("filter-spot").value = spotParam;

  // レシピ詳細（SCR-009）の「すべて見る」からの絞り込み
  let recipeId = new URLSearchParams(location.search).get("recipe");
  if (recipeId) {
    const name = records.find((r) => r.recipe_id === recipeId)?.recipe_name;
    document.getElementById("recipe-filter").hidden = false;
    document.getElementById("recipe-filter-label").textContent = `${name ?? "指定レシピ"}`;
  }
  document.getElementById("clear-recipe").addEventListener("click", () => {
    recipeId = null;
    document.getElementById("recipe-filter").hidden = true;
    history.replaceState(null, "", "records.html");
    render();
  });

  // グループの釣果が 1 件も無いうちは、投稿者の絞り込みを出さない
  if (records.some((r) => !r.is_mine)) {
    document.getElementById("owner-field").hidden = false;
    document.getElementById("filter-owner").value = "all";
  }

  document.getElementById("filter-spot").addEventListener("change", render);
  document.getElementById("filter-kind").addEventListener("change", render);
  document.getElementById("filter-owner").addEventListener("change", render);
  render();

  function render() {
    const spotId = document.getElementById("filter-spot").value;
    const kind = document.getElementById("filter-kind").value;
    const owner = document.getElementById("filter-owner").value;
    const filtered = records.filter((r) => {
      if (spotId && r.spot_id !== spotId) return false;
      if (recipeId && r.recipe_id !== recipeId) return false;
      if (kind === "reaction" && !recordOutcome(r).reaction) return false;
      if (kind && kind !== "reaction" && recordOutcome(r).value !== kind) return false;
      if (owner === "mine" && !r.is_mine) return false;
      if (owner === "others" && r.is_mine) return false;
      return true;
    });

    // 「釣れた数」と「魚がいた回数」は別に出す。後者こそ次の判断材料になる（D-092）
    const landed = filtered.filter((r) => recordOutcome(r).value === "landed")
      .reduce((sum, r) => sum + (r.catch_count ?? 0), 0);
    const reactions = filtered.filter((r) => recordOutcome(r).reaction && recordOutcome(r).value !== "landed")
      .reduce((sum, r) => sum + (r.catch_count ?? 0), 0);
    document.getElementById("count").textContent =
      `${filtered.length} 件 / ${landed} 匹${reactions ? ` / 反応 ${reactions}` : ""}`;

    const box = document.getElementById("list");
    if (!filtered.length) {
      box.innerHTML = `<div class="empty">該当する記録がありません。</div>`;
      return;
    }

    // 年月ごとに区切って表示
    let currentMonth = "";
    box.innerHTML = filtered.map((r) => {
      const month = r.fished_at.slice(0, 7);
      const header = month !== currentMonth
        ? `<div class="section-label"><span>${month.replace("-", ".")}</span></div>`
        : "";
      currentMonth = month;

      const outcome = recordOutcome(r);
      const title = outcome.value === "none"
        ? `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`
        : `${outcome.value === "landed" ? "" : `<span class="tag ${outcome.tagClass}">${outcome.short}</span> `}`
          + `${escapeHtml(recordFishName(r))}${r.length_cm ? ` ${r.length_cm}cm` : ""}`
          + (r.catch_count > 1 ? ` ×${r.catch_count}` : "");
      const sub = [
        r.spot_name, r.lure_label ?? lureCategoryText(r), r.water_layer,
        r.tide_type, r.quantity_note,
      ].filter(Boolean).map(escapeHtml).join(" / ");
      // 誰の釣果かはひと目で分かるようにする（自分のものには何も付けない）
      const owner = ownerBadge(r);

      return `${header}
        <a class="list-item${r.is_mine ? "" : " shared"}" href="record.html?id=${r.id}">
          <div class="thumb">${r.photo_thumb_path
            ? `<img class="thumb-photo" data-path="${escapeHtml(r.photo_thumb_path)}" alt="">`
            : icon(outcome.iconName, { size: 20 })}</div>
          <div class="list-body">
            <div class="list-title">${owner}${title}</div>
            <div class="list-sub">${escapeHtml(formatJstDate(r.fished_at))}${
            r.fished_time ? " " + r.fished_time.slice(0, 5) : ""}${sub ? " · " + sub : ""}</div>
          </div>
          <div class="list-aside">${relativeDays(r.fished_at)}</div>
        </a>`;
    }).join("");
    fillThumbs();
  }

  /** 非公開バケットなので、一覧に出すサムネイルも署名付き URL が要る。 */
  async function fillThumbs() {
    const images = [...document.querySelectorAll(".thumb-photo")];
    if (!images.length) return;
    const urls = await signedPhotoUrls(images.map((el) => el.dataset.path)).catch(() => new Map());
    for (const el of images) {
      const url = urls.get(el.dataset.path);
      if (url) el.src = url;
      else el.closest(".thumb").innerHTML = icon("fish", { size: 20 });
    }
  }
</script>
</body>
</html>
