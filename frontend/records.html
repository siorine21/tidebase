<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATCH LOG | TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-006 釣果日誌一覧 -->
<header class="app-header">
  <h1>CATCH LOG</h1>
  <span class="head-actions">
    <span class="page-sub" id="count">—</span>
    <!-- 統計（SCR-018・D-102 / D-152）。ナビの 6 枠は埋まっているので、一覧の隣から開く。
         **ページ名をそのまま出す。** グラフのアイコンだけでは、押した先が
         何の画面なのかが分からない -->
    <a class="btn btn-quiet link-btn head-page" href="trends.html" id="trends-link"
       ><span data-icon="chart"></span>統計</a>
  </span>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>

  <div class="card">
    <div class="row-2">
      <div class="field" style="margin:0">
        <label for="filter-spot">スポット</label>
        <select id="filter-spot"><option value="">すべて</option></select>
      </div>
      <div class="field" style="margin:0">
        <label for="filter-kind">種別</label>
        <!-- 到達段階ごとに絞る（D-092）。「反応あり」は釣果＋バラシ＋ミスバイト -->
        <select id="filter-kind">
          <option value="">すべて</option>
          <option value="landed">釣果のみ</option>
          <option value="reaction">反応あり（釣果・バラシ・アタリ）</option>
          <option value="lost">バラシのみ</option>
          <option value="bite">ミスバイトのみ</option>
          <option value="sighting">目視のみ</option>
          <option value="none">何も無しのみ</option>
        </select>
      </div>
    </div>
    <!-- メモの言葉で絞る（D-148）。**部分一致。**
         「濁り」で笹濁りもドチャ濁りも出る（段階をまとめて見たいとき）。
         段階を名指しすればその段階だけ出る -->
    <div class="field" style="margin:10px 0 0">
      <label for="filter-word">メモの言葉</label>
      <input type="search" id="filter-word" placeholder="雨後・笹濁り・増水 など">
      <div class="chips" id="word-chips" style="margin-top:8px"></div>
    </div>
    <div class="field" id="owner-field" style="margin:10px 0 0" hidden>
      <label for="filter-owner">投稿者</label>
      <select id="filter-owner">
        <option value="mine">自分の釣果</option>
        <option value="all">グループ全員</option>
        <option value="others">メンバーの釣果</option>
      </select>
    </div>
    <div id="recipe-filter" hidden style="margin-top:10px">
      <span class="tag tag-mustard" id="recipe-filter-label"></span>
      <button type="button" class="chip" id="clear-recipe" style="margin-left:6px" data-icon="close">解除</button>
    </div>
  </div>

  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<a class="fab" href="record-new.html" title="釣行を記録"
   aria-label="釣行を記録" data-icon="plus"></a>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    requireSession, renderNav, escapeHtml, lureCategoryText, ownerBadge, listAllRecords, listSpots,
    catchLogGroups, catchSummary,
    formatJstDate, relativeDays, icon, recordFishName, signedPhotoUrls,
    recordOutcome,
    outcomeLead,
    memoMatches, memoFilterWords,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("records");

  if (new URLSearchParams(location.search).get("saved")) {
    const box = document.getElementById("message");
    box.textContent = "釣果を記録しました。";
    box.className = "message success";
    box.hidden = false;
    history.replaceState(null, "", "records.html");
  }

  /* **全件を読む**（D-181）。前は新しい 200 件だけで、超えると古い年が黙って欠けた。
     年・月で畳むので、畳んだ見出しの数が合わなくなる */
  const [records, spots] = await Promise.all([
    listAllRecords().catch(() => []),
    listSpots().catch(() => []),
  ]);

  document.getElementById("filter-spot").insertAdjacentHTML("beforeend",
    spots.map((s) => `<option value="${s.id}">${escapeHtml(s.name ?? "無名スポット")}</option>`).join(""));

  // スポット詳細（SCR-005）の「すべて見る」からの絞り込み
  const spotParam = new URLSearchParams(location.search).get("spot");
  if (spotParam) document.getElementById("filter-spot").value = spotParam;

  // レシピ詳細（SCR-009）の「すべて見る」からの絞り込み
  let recipeId = new URLSearchParams(location.search).get("recipe");
  if (recipeId) {
    const name = records.find((r) => r.recipe_id === recipeId)?.recipe_name;
    document.getElementById("recipe-filter").hidden = false;
    document.getElementById("recipe-filter-label").textContent = `${name ?? "指定レシピ"}`;
  }
  document.getElementById("clear-recipe").addEventListener("click", () => {
    recipeId = null;
    document.getElementById("recipe-filter").hidden = true;
    history.replaceState(null, "", "records.html");
    render();
  });

  // グループの釣果が 1 件も無いうちは、投稿者の絞り込みを出さない
  if (records.some((r) => !r.is_mine)) {
    document.getElementById("owner-field").hidden = false;
    document.getElementById("filter-owner").value = "all";
  }

  document.getElementById("filter-spot").addEventListener("change", render);
  document.getElementById("filter-kind").addEventListener("change", render);
  document.getElementById("filter-owner").addEventListener("change", render);

  /* メモの言葉（D-148）。**候補は押すだけで入る。**
     打ち間違いで 0 件になるのがいちばん困る（絞り込みが効いていないのか、
     本当に無いのかが分からない） */
  document.getElementById("word-chips").innerHTML = memoFilterWords()
    .map((w) => `<button type="button" class="chip" data-word="${escapeHtml(w)}">`
      + `${escapeHtml(w)}</button>`).join("");
  document.getElementById("word-chips").addEventListener("click", (e) => {
    const button = e.target.closest("[data-word]");
    if (!button) return;
    const input = document.getElementById("filter-word");
    // もう一度押したら外す（同じ操作で戻せる）
    input.value = input.value.trim() === button.dataset.word ? "" : button.dataset.word;
    syncWordChips();
    render();
  });
  document.getElementById("filter-word").addEventListener("input", () => {
    syncWordChips();
    render();
  });
  function syncWordChips() {
    const value = document.getElementById("filter-word").value.trim();
    for (const c of document.querySelectorAll("#word-chips .chip"))
      c.classList.toggle("selected", c.dataset.word === value);
  }

  /* ---------- 年・月で畳む（D-181） ----------
     **開き方は catchLogGroups が決める**（記録のある直近 2 か月は開く・今年のほかの月は
     月で畳む・去年より前は「年 → 月」で畳む・絞り込み中は全部開く）。
     ここは描くだけ。畳んだ節の中身は**開いたときに描く**（年の数だけ全部を描かない。
     写真の署名付き URL も、見えるぶんだけ取りに行く）。 */
  const listBox = document.getElementById("list");
  let nodeByKey = new Map();          // 節の key → 節（開いたときに中身を描くのに使う）

  /* 自分で開け閉めした節は覚えておく（このタブのあいだだけ）。
     記録を開いて戻ってきたら、さっき開いた月が畳まれている、を避ける。
     **絞り込み中は覚えない**（当たった節を全部開く、のほうが優先）。
     覚えられない環境（プライベートブラウズなど）では、毎回いつもの開き方になるだけ */
  const OPEN_KEY = "tidebase.catchlog.open";
  const readOpen = () => {
    try { return JSON.parse(sessionStorage.getItem(OPEN_KEY) ?? "{}") ?? {}; } catch { return {}; }
  };
  const rememberOpen = (key, open) => {
    try {
      const saved = readOpen();
      saved[key] = open;
      sessionStorage.setItem(OPEN_KEY, JSON.stringify(saved));
    } catch { /* 覚えられなくても表示は変わらない */ }
  };

  /** 絞り込みが効いているか。投稿者は「グループ全員」がいつもの値（欄が出ていないときは自分だけ） */
  function filtersActive() {
    const ownerShown = !document.getElementById("owner-field").hidden;
    return Boolean(document.getElementById("filter-spot").value
      || document.getElementById("filter-kind").value
      || document.getElementById("filter-word").value.trim()
      || recipeId
      || (ownerShown && document.getElementById("filter-owner").value !== "all"));
  }

  render();

  function render() {
    const spotId = document.getElementById("filter-spot").value;
    const kind = document.getElementById("filter-kind").value;
    const owner = document.getElementById("filter-owner").value;
    const word = document.getElementById("filter-word").value;
    const filtered = records.filter((r) => {
      if (!memoMatches(r.memo, word)) return false;
      if (spotId && r.spot_id !== spotId) return false;
      if (recipeId && r.recipe_id !== recipeId) return false;
      if (kind === "reaction" && !recordOutcome(r).reaction) return false;
      if (kind && kind !== "reaction" && recordOutcome(r).value !== kind) return false;
      if (owner === "mine" && !r.is_mine) return false;
      if (owner === "others" && r.is_mine) return false;
      return true;
    });

    // 「釣れた数」と「魚がいた回数」は別に出す。後者こそ次の判断材料になる（D-092）
    const total = catchSummary(filtered);
    document.getElementById("count").textContent =
      `${total.count} 件 / ${total.landed} 匹${total.reactions ? ` / 反応 ${total.reactions}` : ""}`;

    if (!filtered.length) {
      listBox.innerHTML = `<div class="empty">該当する記録がありません。</div>`;
      return;
    }

    const active = filtersActive();
    const saved = active ? {} : readOpen();
    nodeByKey = new Map();
    listBox.innerHTML = catchLogGroups(filtered, { filtered: active })
      .map((node) => groupHtml(node, saved)).join("");
    fillThumbs(listBox);
  }

  /** 節 1 つ。開いているものだけ中身を描く */
  function groupHtml(node, saved) {
    nodeByKey.set(node.key, node);
    const open = saved[node.key] ?? node.open;
    return `
      <details class="log-group log-${node.kind}" data-key="${escapeHtml(node.key)}"${open ? " open" : ""}>
        <summary>${summaryHtml(node)}</summary>
        <div class="log-body">${open ? bodyHtml(node, saved) : ""}</div>
      </details>`;
  }

  function bodyHtml(node, saved) {
    return node.kind === "year"
      ? node.children.map((child) => groupHtml(child, saved)).join("")
      : node.records.map(itemHtml).join("");
  }

  /* 畳んだままでも「その月・その年はどうだったか」が読めるように、見出しに要約を出す。
     数え方は上の合計と同じ（catchSummary）。足し算が食い違わない */
  function summaryHtml(node) {
    const s = catchSummary(node.records);
    const parts = [`${s.count}件`, `${s.landed}匹`];
    if (s.reactions) parts.push(`反応${s.reactions}`);
    return `<span class="log-caret">${icon("chevron-right", { size: 13 })}</span>`
      + `<span class="log-label">${escapeHtml(node.label)}</span>`
      + `<span class="log-stats">${parts.join("・")}</span>`
      + (s.best
        ? `<span class="log-best">最大 ${escapeHtml(s.best.name)} ${s.best.length}cm</span>` : "");
  }

  function itemHtml(r) {
    const outcome = recordOutcome(r);
    const title = outcome.value === "none"
      ? `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`
      : outcomeLead(r)
        + `${escapeHtml(recordFishName(r))}${r.length_cm ? ` ${r.length_cm}cm` : ""}`
        + (r.catch_count > 1 ? ` ×${r.catch_count}` : "");
    const sub = [
      r.spot_name, r.lure_label ?? lureCategoryText(r), r.water_layer,
      r.tide_type, r.quantity_note,
    ].filter(Boolean).map(escapeHtml).join(" / ");
    // 誰の釣果かはひと目で分かるようにする（自分のものには何も付けない）
    const owner = ownerBadge(r);

    return `
      <a class="list-item${r.is_mine ? "" : " shared"}" href="record.html?id=${r.id}">
        <div class="thumb">${r.photo_thumb_path
          ? `<img class="thumb-photo" data-path="${escapeHtml(r.photo_thumb_path)}" alt="">`
          : icon(outcome.iconName, { size: 20 })}</div>
        <div class="list-body">
          <div class="list-title">${owner}${title}</div>
          <div class="list-sub">${escapeHtml(formatJstDate(r.fished_at, { weekday: true }))}${
          r.fished_time ? " " + r.fished_time.slice(0, 5) : ""}${sub ? " · " + sub : ""}</div>
        </div>
        <div class="list-aside">${relativeDays(r.fished_at)}</div>
      </a>`;
  }

  /* 開いたら中身を描く。toggle は泡立たないので、捕捉の段で受ける */
  listBox.addEventListener("toggle", (e) => {
    const details = e.target;
    if (!details.matches?.(".log-group") || !details.open) return;
    const body = details.querySelector(":scope > .log-body");
    if (body.childElementCount) return;
    body.innerHTML = bodyHtml(nodeByKey.get(details.dataset.key), filtersActive() ? {} : readOpen());
    fillThumbs(body);
  }, true);

  /* 自分で開け閉めしたものだけ覚える。summary を押したあと、開いたかどうかが決まってから読む */
  listBox.addEventListener("click", (e) => {
    const summary = e.target.closest(".log-group > summary");
    if (!summary) return;
    const details = summary.parentElement;
    setTimeout(() => {
      if (!filtersActive()) rememberOpen(details.dataset.key, details.open);
    }, 0);
  });

  /** 非公開バケットなので、一覧に出すサムネイルも署名付き URL が要る。
      **描いたぶんだけ**取りに行く（畳んだ節の写真まで先に取らない） */
  async function fillThumbs(scope) {
    const images = [...scope.querySelectorAll(".thumb-photo:not([src])")];
    if (!images.length) return;
    const urls = await signedPhotoUrls(images.map((el) => el.dataset.path)).catch(() => new Map());
    for (const el of images) {
      const url = urls.get(el.dataset.path);
      if (url) el.src = url;
      else el.closest(".thumb").innerHTML = icon("fish", { size: 20 });
    }
  }
</script>
</body>
</html>
