<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATCH DETAIL | TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-007 釣果詳細 -->
<header class="page-head">
  <button type="button" class="back" id="back" aria-label="戻る">←</button>
  <div class="page-title" id="title">CATCH DETAIL</div>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <div id="detail"><div class="empty">読み込み中…</div></div>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml, toJapaneseError, formatJstDate, icon,
    createMap, spotMarker, googleMapsUrl, googleDirectionsUrl, isCoordinateInJapan,
    listTidePoints, fetchTideForPoint, tideAt, tideTimelineSvg, sunStripHtml,
    sunTimes, tideFlowAt, TIDE_FLOW_LABELS, nearestMazume, mazumeLabel,
    listRecordPhotos, deleteRecordPhotos, signedPhotoUrls, lureCategoryText, ownerBadge,
    navigate,
    recordOutcome,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("records");
  document.getElementById("back").addEventListener("click", () => history.back());

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (!id) {
    document.getElementById("detail").innerHTML = `<div class="empty">記録が指定されていません。</div>`;
    throw new Error("no id");
  }
  if (params.get("photoerror")) {
    let reason = "";
    try {
      reason = sessionStorage.getItem("tidebase.photoError") ?? "";
      sessionStorage.removeItem("tidebase.photoError");
    } catch { /* 使えない環境では理由なしで出す */ }
    const box = document.getElementById("message");
    // 何が起きたかを本人に見せる。原因が分からないと直しようがない（D-061）
    box.textContent = "釣果は保存できましたが、写真の保存に失敗しました。"
      + (reason ? `${reason} ` : "") + "編集からもう一度お試しください。";
    box.className = "message error";
    box.hidden = false;
    history.replaceState(null, "", `record.html?id=${encodeURIComponent(id)}`);
  }
  if (params.get("saved")) {
    const box = document.getElementById("message");
    box.textContent = "変更を保存しました。";
    box.className = "message success";
    box.hidden = false;
    history.replaceState(null, "", `record.html?id=${encodeURIComponent(id)}`);
  }

  // 読み取りは record_feed から（自分の分 + グループの公開分。他人の非公開は行ごと出ない）
  const { data: record, error } = await client
    .from("record_feed")
    .select("*")
    .eq("id", id)
    .maybeSingle();

  const box = document.getElementById("detail");
  if (error) {
    box.innerHTML = `<div class="empty">${escapeHtml(toJapaneseError(error))}</div>`;
  } else if (!record) {
    box.innerHTML = `<div class="empty">記録が見つかりません。</div>`;
  } else {
    render(record);
  }

  /** 写真。非公開バケットなので、表示のたびに署名付き URL を作る。 */
  async function renderPhotos(r) {
    const card = document.getElementById("photo-card");
    const list = await listRecordPhotos(r.id).catch(() => []);
    if (!list.length) { card.remove(); return; }

    const urls = await signedPhotoUrls(list.flatMap((p) => [p.path, p.thumb_path]))
      .catch(() => new Map());
    card.innerHTML = `<div class="photo-view">
      ${list.map((p) => `
        <a href="${urls.get(p.path) ?? "#"}" target="_blank" rel="noopener">
          <img src="${urls.get(p.path) ?? ""}" alt="釣果の写真"
               width="${p.width ?? ""}" height="${p.height ?? ""}" loading="lazy">
        </a>`).join("")}
    </div>`;
  }

  /**
   * 釣れた時刻の潮位を出す。
   * 潮汐は推算値なので、時刻さえ残っていれば後からいくらでも引き直せる。
   * そのため保存はせず、表示のたびに気象庁の推算から計算する。
   */
  async function renderTide(r) {
    const body = document.getElementById("tide-body");
    const value = r.spot_tide_area_code ? `AR:${r.spot_tide_area_code}`
      : r.spot_tide_station_code ? `ST:${r.spot_tide_station_code}` : null;
    if (!value) {
      body.textContent = "このスポットには潮汐地点が設定されていません。";
      return;
    }

    let point, tide;
    try {
      // 記録は全国どこのスポットにも付きうるので、県で絞らずに探す
      const points = await listTidePoints({ pref: null });
      point = points.find((p) => p.value === value);
      if (!point) throw new Error("潮汐地点が見つかりません");
      tide = await fetchTideForPoint(point, r.fished_at);
    } catch {
      body.textContent = "潮位を取得できませんでした。時間をおいて開き直してください。";
      return;
    }

    const hhmm = r.fished_time.slice(0, 5);
    const at = tideAt(tide, hhmm);
    const flow = tideFlowAt(tide, hhmm);

    // 日の出・日没は計算で出す（D-056）。予報 API は過去 3 か月しか遡れないので、
    // 去年の釣行にはマヅメが出せない。座標はスポット優先、無ければ潮汐地点
    const spotUsable = isCoordinateInJapan(r.spot_latitude, r.spot_longitude);
    const lat = spotUsable ? r.spot_latitude : point.lat;
    const lng = spotUsable ? r.spot_longitude : point.lng;
    const sun = sunTimes(lat, lng, r.fished_at);
    const mazume = mazumeLabel(nearestMazume(sun, hhmm));

    const chart = tideTimelineSvg({
      days: [r.fished_at], tides: [tide], today: null,
      suns: sun ? new Map([[r.fished_at, sun]]) : new Map(),
      marker: { date: r.fished_at, hhmm, label: hhmm },
      dayUnits: 360, height: 168,
    });

    document.getElementById("tide-card").innerHTML = `
      <h2>${icon("tide", { size: 14 })} 釣れた時刻の潮位</h2>
      <div class="rows" style="margin-bottom:12px">
        <div class="row"><span class="label">潮位</span>
          <span class="val">${at ? `${at.level} cm` : "—"}</span></div>
        <div class="row"><span class="label">潮の動き</span>
          <span class="val">${at ? escapeHtml(at.trend) : "—"}${
            flow ? ` <span class="sub-val">${escapeHtml(TIDE_FLOW_LABELS[flow.key])}</span>` : ""}</span></div>
        <div class="row"><span class="label">マヅメ</span>
          <span class="val"${mazume?.inWindow ? ` style="color:var(--green)"` : ""}>${
            mazume ? escapeHtml(mazume.text) : "—"}</span></div>
        <div class="row"><span class="label">潮汐地点</span>
          <span class="val">${escapeHtml(point.name)}</span></div>
      </div>
      ${chart ? `<div class="tide-scroller">${chart.svg}${sunStripHtml(chart.sunMarks)}</div>` : ""}
      <div class="list-sub" style="margin-top:8px">
        気象庁の推算値${point.area ? "（基準観測点からの推算）" : ""}・日の出日没は計算値
      </div>`;
  }

  function render(r) {
    // アイコンは SVG 文字列なので innerHTML（textContent だとタグがそのまま出る）
    const outcome = recordOutcome(r);
    document.getElementById("title").innerHTML = outcome.value === "landed"
      ? "CATCH DETAIL"
      : `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`;
    const WATER = { saltwater: "海水", brackish: "汽水", freshwater: "淡水" };
    const rows = [
      // 他人の釣果は投稿者を最初に出す（誰の記録かを見間違えないように）
      ["投稿者", r.is_mine ? "自分" : r.owner_name],
      ["釣行日", formatJstDate(r.fished_at, { weekday: true })
        + (r.fished_time ? ` ${r.fished_time.slice(0, 5)}` : "")],
      ["スポット", r.spot_name ? `${r.spot_name}（${WATER[r.spot_water_type] ?? "—"}）` : null],
      ["潮回り", r.tide_type],
      ["月齢", r.tide_snapshot?.moon_age],
      ["魚種", r.species_name],
      ["呼称", r.fish_name_local],
      ["サイズ", r.length_cm ? `${r.length_cm} cm` : null],
      ["重量", r.weight_g ? (r.weight_g >= 1000 ? `${(r.weight_g / 1000).toFixed(1)} kg` : `${r.weight_g} g`) : null],
      ["結果", outcome.label],
      [outcome.countLabel ?? "匹数", outcome.value === "none" ? "—" : r.catch_count],
      ["数量メモ", r.quantity_note],
      // レシピを選んだときはその名前、自由入力ならその文字列（D-075）
      ["ルアー", r.lure_label],
      ["ルアー種別", lureCategoryText(r)],
      ["ヒットレンジ", r.water_layer],
      ["ロッド", r.rod], ["リール", r.reel], ["ライン", r.line], ["リーダー", r.leader],
      // 公開範囲は自分の記録にだけ意味がある設定なので、他人の記録には出さない
      r.is_mine ? ["公開範囲", r.visibility === "private" ? "自分のみ" : "グループ"] : null,
    ].filter((row) => row && row[1] != null && row[1] !== "");

    // 共有された釣果でも釣り場が分かるように、地図と経路案内を出す（011）
    const spot = { latitude: r.spot_latitude, longitude: r.spot_longitude, name: r.spot_name };
    const hasSpotMap = isCoordinateInJapan(spot.latitude, spot.longitude);

    box.innerHTML = `
      ${r.is_mine ? "" : `<div class="message shared-note">
        ${ownerBadge(r)} さんの釣果です（閲覧のみ）
      </div>`}
      <div class="card">
        <div class="rows">
          ${rows.map(([k, v]) => `
            <div class="row"><span class="label">${k}</span>
            <span class="val">${escapeHtml(v)}</span></div>`).join("")}
        </div>
      </div>
      ${r.photo_count ? `<div class="card" id="photo-card">
        <div class="empty">写真を読み込み中…</div>
      </div>` : ""}
      ${r.fished_time ? `<div class="card" id="tide-card">
        <h2>${icon("tide", { size: 14 })} 釣れた時刻の潮位</h2>
        <div class="empty" id="tide-body">読み込み中…</div>
      </div>` : ""}
      ${hasSpotMap ? `<div class="card">
        <h2>${icon("map-pin", { size: 14 })} ${escapeHtml(r.spot_name ?? "スポット")}</h2>
        <div class="map-box" id="record-map" style="margin-bottom:0"></div>
        <div class="actions">
          <a class="btn btn-quiet link-btn" href="${googleMapsUrl(spot)}"
             target="_blank" rel="noopener">${icon("map", { size: 15 })} Google マップ</a>
          <a class="btn link-btn" href="${googleDirectionsUrl(spot)}"
             target="_blank" rel="noopener">${icon("navigation", { size: 15 })} 経路案内</a>
        </div>
      </div>` : ""}
      ${r.memo ? `<div class="card"><h2>メモ</h2>
        <div style="white-space:pre-wrap;font-size:14px">${escapeHtml(r.memo)}</div></div>` : ""}
      ${r.is_mine ? `<div class="actions">
        <a class="btn btn-quiet link-btn"
           href="record-new.html?id=${encodeURIComponent(r.id)}">${icon("edit", { size: 15 })} 編集</a>
        <button type="button" class="btn btn-quiet" id="delete">削除する</button>
      </div>` : ""}`;

    if (r.photo_count) renderPhotos(r);
    if (r.fished_time) renderTide(r);

    if (hasSpotMap) {
      const { map } = createMap("record-map",
        { center: [spot.latitude, spot.longitude], zoom: 14, lock: true });
      L.marker([spot.latitude, spot.longitude], { icon: spotMarker(spot) }).addTo(map);
      // カードの中で描画されるため、レイアウト確定後にサイズを測り直す
      setTimeout(() => map.invalidateSize(), 50);
    }

    // 編集・削除は自分の記録だけ。ボタンを隠すのは案内であって、
    // 実際に他人の行を書き換えられないのは RLS（fishing_records は自分の行のみ）。
    if (!r.is_mine) return;

    document.getElementById("delete").addEventListener("click", async () => {
      if (!confirm("この釣果記録を削除しますか？\nこの操作は取り消せません。")) return;
      // 釣果を消すと台帳は CASCADE で消えるが、Storage の実体は残る。
      // 先に実体を消してから記録を消す（順番が逆だと、消すべきパスが分からなくなる）
      try {
        await deleteRecordPhotos(await listRecordPhotos(r.id));
      } catch (photoError) {
        const msg = document.getElementById("message");
        msg.textContent = "写真を削除できませんでした。通信環境を確認して、もう一度お試しください。";
        msg.className = "message error";
        msg.hidden = false;
        return;
      }
      const { error: deleteError } = await client.from("fishing_records").delete().eq("id", r.id);
      if (deleteError) {
        const msg = document.getElementById("message");
        msg.textContent = toJapaneseError(deleteError);
        msg.className = "message error";
        msg.hidden = false;
        return;
      }
      navigate("records.html", { replace: true });
    });
  }
</script>
</body>
</html>
