<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-001 ホーム（ダッシュボード） -->
<header class="app-header">
  <h1>TIDEBASE</h1>
  <span class="head-actions">
    <!-- お知らせ（D-074）。ナビの 6 枠は埋まっているので、ここから開く。
         未読があるときだけ点を出す -->
    <a class="btn btn-quiet link-btn icon-only" href="news.html" id="news-link"
       aria-label="お知らせ"><span data-icon="bell"></span><i class="dot" hidden></i></a>
    <a class="btn btn-quiet link-btn" href="settings.html" id="settings-link"
       aria-label="設定"><span data-icon="settings"></span>設定</a>
  </span>
</header>

<!-- どこを見ているか（D-105 / D-108）。**選ぶのはスポット 1 つ。**
     そのスポットが天気の座標と潮汐の観測所の両方を決める。
     中身は attachSpotPicker が入れる。潮汐詳細の先頭にも同じものを置く -->
<div id="base-spot-bar" hidden></div>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <!-- 潮汐地点が場所ごとに決まるようになったことの知らせ（D-105）。1 度だけ -->
  <div id="point-notice" class="message point-notice" hidden role="status"></div>
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">TODAY</div>
        <div class="hero-date" id="today">—</div>
      </div>
      <button type="button" class="score-circle" id="score-help"
              aria-label="釣行スコアの説明" disabled>
        <div class="score-num" id="score">—</div>
        <div class="score-label">/5</div>
      </button>
    </div>
    <!-- いまの潮（D-129）。**すでに取ってある潮汐と、計算で出る日の出日没**を
         文にし直すだけで、通信は増えない。潮位グラフにも同じことは描いてあるが、
         グラフは「読み取る」のに手間が要る。開いていちばん先に知りたい
         「いま上げているのか、次の満潮はいつか、暗くなるまでどれだけか」を
         数字で出す。1 分ごとに書き直す（「いま」なので） -->
    <div class="hero-now" id="hero-now" hidden></div>
    <!-- ライブカメラ（D-143 / 043）。**スポットには依らない。**
         「釣りに行くとき、まずは海の様子をチェックする」（本人）ので、
         行き先を決める前に見るもの。河川のスポットを選んでいても出す。
         **押されるまで読み込まない。** 潮を見に来ただけの人に
         生配信を流し始めるのは、通信も電池も持っていかれる -->
    <div class="live-cam" id="live-cam" hidden></div>
    <div class="tags" id="hero-tags"></div>
    <!-- 時間別天気は TODAY の中に入れる（D-114）。
         スコアも時間帯ごとの点も、この 1 時間ごとの予報から出している。
         別の節に置くと、点の根拠を見るのに節をまたぐことになる。 -->
    <div class="hero-hourly">
      <div class="hero-hourly-head">
        <span>HOURLY WEATHER</span><span class="note">← スクロール →</span>
      </div>
      <!-- いつ雨か、を先に 1 行で（D-104）。数字を並べる前に結論を出す -->
      <div class="hourly-lead" id="hourly-lead" hidden></div>
      <div class="hourly" id="hourly"><div class="empty">読み込み中…</div></div>
      <!-- どこの何を見ているのかを画面に出す（D-076）。
           出典が分からないと、外れたときに「何が外れたのか」を判断できない -->
      <div class="list-sub" id="weather-source"></div>
    </div>
  </section>

  <!-- 潮汐のある場所だけ。淡水スポットではこの節ごと隠す（D-105） -->
  <div id="tide-block">
    <!-- 名前は潮汐画面と同じ「TIDE CHART」（D-119）。**同じ部品**を
         日数だけ変えて出しているのに、名前が 2 つあった（TIDE GRAPH / TIDE CHART）。
         カードのクラスも tide-chart-card なので、そちらに寄せる -->
    <div class="section-label">
      <span>TIDE CHART</span>
      <a class="note" id="tide-detail-link" href="tide.html">詳細 →</a>
    </div>
    <div class="card tide-chart-card">
      <!-- 潮位の目盛りは横スクロールしても残ってほしいので、スクローラの外に重ねる -->
      <div class="tide-plot">
        <div class="tide-scroller" id="tide-scroller" tabindex="0"
             aria-label="潮位グラフ。左右にスクロールすると前後の時間を表示します">
          <div class="tide-track tide-track-3" id="tide-track"></div>
        </div>
        <div class="level-axis" id="level-axis" aria-hidden="true"></div>
      </div>
      <div class="tide-legend" id="tide-legend"></div>
      <!-- どの観測所の値かは、グラフと同じカードの中に置く（D-105）。
           前は下の「潮汐地点」の欄に出ていて、グラフから離れていた -->
      <div class="page-sub" id="tide-station" style="margin-top:8px"></div>
      <div class="page-sub" id="tide-point-note"></div>
    </div>
    <div class="scroll-hint">
      <span data-icon="back"></span>横にスクロールで前後の時間へ（日をまたいで連続）<span data-icon="chevron-right"></span>
    </div>
  </div>
  <!-- 淡水スポットのとき。空のグラフを出さない -->
  <div class="card no-tide" id="no-tide" hidden></div>

  <div class="section-label"><span>RECENT CATCH</span><a class="note" href="records.html">すべて見る →</a></div>
  <div id="recent"><div class="empty">読み込み中…</div></div>
</main>

<a class="fab" href="record-new.html" title="釣果を記録" data-icon="plus"></a>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml,
    fetchTide, fetchWeather, todayInJst, formatJstDate, relativeDays,
    fishingScoreAhead, hourScorer,
    showFishingScoreHelp, tideType, TIDE_TYPE_COLORS,
    renderHourlyStrip,
    listSpots, listRecords, icon,
    recordFishName, ownerBadge, nowInJst, hoursFromHhmm, addJstDays,
    listTidePoints, fetchTideForPoint, savedTidePoint, saveTidePoint, formatLag,
    pickBaseSpot, spotTidePoint, savedBaseSpot, saveBaseSpot, attachSpotPicker,
    rememberedView, rememberView, sameView,
    spotFacesOpenSea, describeWaves, waveSummary, fetchWaves,
    liveCameraEmbedUrl, listLiveCameras,
    warmTideCache,
    hasUnreadNews, WEATHER_SOURCE,
    isCoordinateInJapan, tideTimelineSvg, sunStripHtml, levelAxisHtml, tideLevelAt, sunTimes,
    tideFlowAt, TIDE_FLOW_LABELS, tidePhaseAt, nextTideEvent, nextSunEvent, formatCountdown,
    recordOutcome,
    outcomeLead,
  } from "./assets/app.js";

  // 静岡県特化のため既定は舞阪（浜名湖口・遠州灘西部の基準）
  const DEFAULT_POINT = "ST:MI";

  // グラフの状態（宣言はセッション処理より前に置く。const/let は巻き上がらない）
  let chartDays = [];
  let tideCache = new Map();          // 日付 → 潮汐
  const sunCache = new Map();         // 日付 → 日の出・日没
  let todayHours = null;              // 今日の時間別予報（波の行が読む・D-142）
  const camWaves = new Map();         // ライブカメラの code → その浜の予報（D-144）
  let liveCams = [];                  // 出しているカメラ（毎分の書き直しが引く）
  const CHART_H = 152;                // グラフの高さ（潮位目盛りの箱もこれに合わせる）

  // いま何でスコアを判定したか。スコア円を押されたときに説明へ渡す
  let scoreContext = null;
  // 1 時間ごとの点を出す関数（D-116）。時間別天気の★に使う
  let scoreOf = null;
  document.getElementById("score-help").addEventListener("click", () => {
    if (scoreContext) showFishingScoreHelp(scoreContext);
  });

  const session = await requireSession();
  if (session) {
    renderNav("home");

    // 未読のお知らせがあるときだけ点を出す（D-074）。
    // 読み込めなくてもホームは動かしたいので、失敗は握りつぶす
    hasUnreadNews().then((unread) => {
      document.querySelector("#news-link .dot").hidden = !unread;
    }).catch(() => {});
    const today = todayInJst();
    document.getElementById("today").textContent = formatJstDate(today, { weekday: true });

    /* **互いに関係の無いものは同時に投げる**（D-140）。
       スポット・潮位表地点・最近の釣果はどれも他の結果を必要としないのに、
       1 本ずつ待っていた。実測でホームの中身が出るまで 3.6 秒かかっており、
       その大半がこの待ち時間だった。

       最近の釣果だけは待たない。ヒーローより下にあるので、
       届いた順に描けばよい（待つと、上の表示まで道連れになる）。 */
    const recentSoon = listRecords({ limit: 2 }).catch(() => []);
    /* ライブカメラはスポットに依らないので、決まるのを待たずに投げる（D-143）。
       届いた時点で描く。海の様子を見てから行き先を決める、という順番なので、
       むしろ上の表示より先に出てよい */
    listLiveCameras().then(renderLiveCams).catch(() => {});

    /* **前回と同じところなら、決まるのを待たずに投げておく**（D-140）。
       下の 2 本は「どの地点を見るか」を決めるためだけにあり、
       ふだんは前回と同じところを見る。当たれば 3 段が 2 段になる。
       外れても fetchTide / fetchWeather が 1 本にまとめるので損はしない。 */
    const savedSpotId = savedBaseSpot();
    const guess = rememberedView(savedSpotId);
    const guessed = !guess ? null : {
      tide: loadTide(guess.point, today),
      /* 波の要否も覚えたものを使う。既定（波あり）で投げると、
         河川のスポットでも先行投げのぶんだけ marine を叩いてしまう */
      weather: guess.weatherAt
        ? fetchWeather(guess.weatherAt.lat, guess.weatherAt.lng, today,
                       { waves: guess.waves === true }).catch(() => null)
        : Promise.resolve(null),
    };

    /* 基準スポット（D-105）。**選ぶのはここだけ。**
       このスポットが天気の座標と潮汐の観測所の両方を決める */
    const [spots, points] = await Promise.all([
      listSpots().catch(() => []),
      listTidePoints().catch(() => []),
    ]);
    const baseSpot = pickBaseSpot(spots, savedSpotId);
    /* 波は外洋に面した場所でしか意味を持たない（D-142）。
       河川や管理釣り場では取りに行かない（要求が 1 回につき 3 本減る） */
    const wantWaves = spotFacesOpenSea(baseSpot);
    /* どこを見ているかの帯（D-108）。**潮汐詳細と同じ部品を使う。**
       スポットを変えたら**画面ごと読み直す**（D-105）。
       潮汐も天気も日の出も、スコアも、全部この 1 つで決まる。
       ここだけ差分で描き替えると、どれか 1 つを直し忘れて
       「地名は変わったのに天気は前のまま」が起きる。前がそれだった。
       **描いた直後に付ける。** 天気の通信を待ってから付けると、
       読み込み中に選んだ操作が黙って捨てられる */
    attachSpotPicker(document.getElementById("base-spot-bar"), {
      spots, selected: baseSpot,
      onPick: (spot) => { saveBaseSpot(spot.id); location.reload(); },
    });

    /* 潮汐地点はスポットから決まる。淡水スポットは観測所を持たないので null。
       スポットが 1 件も無いときだけ、静岡県の既定（舞阪）で出す */
    let point = spotTidePoint(baseSpot, points)
      ?? (baseSpot ? null : (points.find((p) => p.value === DEFAULT_POINT) ?? points[0] ?? null));
    noticePointChange(baseSpot, point);
    if (point) {
      document.getElementById("tide-detail-link").href = baseSpot
        ? `tide.html?spot=${encodeURIComponent(baseSpot.id)}`
        : `tide.html?point=${encodeURIComponent(point.value)}`;
      /* 電波があるうちに 1 週間ぶんの潮汐を取っておく（D-096）。
         圏外で要るのは「その日たまたま開いた分」ではなく「これから行く日」。
         待たない。表示の邪魔をしない */
      warmTideCache(point).catch(() => {});
    }
    renderTideAvailability(baseSpot, point);

    // 天気はスポットの座標で取る。座標が未設定・国外なら潮汐地点の座標で代用する。
    // （(0,0) のまま Open-Meteo に投げると赤道の大西洋上の日の出日没が返ってくる）
    const spotUsable = baseSpot
      && isCoordinateInJapan(baseSpot.latitude, baseSpot.longitude);
    const weatherAt = spotUsable
      ? { lat: baseSpot.latitude, lng: baseSpot.longitude }
      : (point?.lat != null ? { lat: point.lat, lng: point.lng } : null);
    if (baseSpot && !spotUsable) warnSpotCoordinates(baseSpot);

    // グラフは昨日〜明日の 3 日ぶんを 1 本につないで表示する（夜釣りは日をまたぐ）。
    // まず今日ぶんだけ描いて、前後の日は後から足す（ホームの表示を待たせない）
    chartDays = [addJstDays(today, -1), today, addJstDays(today, 1)];

    /* 先に投げたものが当たっていればそれを使う。外れていたら取り直す
       （中身は同じ関数なので、当たっていた分は 1 本にまとまる） */
    const hit = guessed && sameView(guess.point, point) && sameView(guess.weatherAt, weatherAt)
      && guess.waves === wantWaves;
    const [tide, forecast] = hit
      ? await Promise.all([guessed.tide, guessed.weather])
      : await Promise.all([
        loadTide(point, today),
        weatherAt
          ? fetchWeather(weatherAt.lat, weatherAt.lng, today, { waves: wantWaves })
            .catch(() => null)
          : null,
      ]);
    // 次に開いたときのために覚え直す（スポットや座標を変えたらここで入れ替わる）
    /* **鍵は「保存されていたスポット ID」のほう**。決まったあとの baseSpot.id で
       覚えると、まだ何も選んでいない人（savedBaseSpot() が null）のとき
       次に開いても照合できず、先に投げる意味が無くなる。実際そうなっていた。 */
    rememberView(savedSpotId, point, weatherAt, wantWaves);
    const weather = forecast?.hours ?? null;
    todayHours = weather;
    tideCache.set(today, tide);
    // 日の出・日没は計算で出す（D-056）。天気の通信を待たずに夜の帯と印が描ける
    if (weatherAt) {
      for (const date of chartDays) sunCache.set(date, sunTimes(weatherAt.lat, weatherAt.lng, date));
    }

    // renderHero が中で renderHourly まで呼ぶ（★を出すのに点の材料が要るため・D-116）
    renderHero(baseSpot, tide, weather, point, sunCache.get(today) ?? null);
    renderChart();
    renderNow();
    // 「いま」なので、開きっぱなしでも合っているようにする。通信はしない
    setInterval(() => { renderNow(); refreshCamWaves(); }, 60000);
    // どこの天気なのかを出す。基準スポットが無ければ潮汐地点の座標で取っている
    document.getElementById("weather-source").textContent = weatherAt
      ? `${spotUsable ? (baseSpot.name ?? "無名スポット") : (point?.label ?? "既定の地点")}`
        + `（北緯 ${Number(weatherAt.lat).toFixed(3)} / 東経 ${Number(weatherAt.lng).toFixed(3)}）の予報`
        + ` · 出典: ${WEATHER_SOURCE}`
      : `出典: ${WEATHER_SOURCE}`;
    scrollToNow("auto");

    // 前後の日をあとから読み足す。明日ぶんが届いたらスコアを描き直す（D-115）
    loadNeighbours(point, weatherAt,
      () => renderHero(baseSpot, tideCache.get(today) ?? null, weather, point,
                       sunCache.get(today) ?? null), wantWaves);

    recentSoon.then(renderRecent);
  }

  async function loadTide(point, date) {
    if (!point) return null;
    try { return await fetchTideForPoint(point, date); } catch { return null; }
  }

  /** 座標が入っていないスポットは天気がまるで別の場所になるので、直し方を案内する。 */
  function warnSpotCoordinates(spot) {
    const box = document.getElementById("message");
    box.innerHTML = `「${escapeHtml(spot.name ?? "無名スポット")}」に位置が設定されていません。`
      + `天気と日の出・日没は潮汐の観測所のものを表示しています。`
      + `<a href="spot.html?id=${spot.id}">スポット詳細</a>の「編集」から地図をタップして位置を設定してください。`;
    box.className = "message error";
    box.hidden = false;
  }

  /* 潮汐地点は場所ごとに決まるようになった（D-105）。
     前に地点を選んでいた人には 1 度だけ知らせる。**黙って変えない。**
     データは書き換えない（推測でスポットの観測所を上書きすると、
     あとで直したのか元からかが分からなくなる） */
  function noticePointChange(spot, point) {
    const old = savedTidePoint();
    if (!old || !spot || !point || old === point.value) { saveTidePoint(null); return; }
    const box = document.getElementById("point-notice");
    box.innerHTML = `潮汐地点は場所ごとに決まるようになりました。`
      + `「${escapeHtml(spot.name ?? "無名スポット")}」はいま「${escapeHtml(point.name)}」です。`
      + `変えるには<a href="spot.html?id=${spot.id}">スポットの詳細</a>から。`;
    box.hidden = false;
    saveTidePoint(null);          // 1 度出したら消す
  }

  /* 淡水スポットには潮汐が無い。空のグラフを出さずに、そう書く（D-105） */
  function renderTideAvailability(spot, point) {
    const hasTide = Boolean(point);
    document.getElementById("tide-block").hidden = !hasTide;
    const box = document.getElementById("no-tide");
    box.hidden = hasTide;
    if (hasTide) renderPointNote(point);   // 推算であることの断りはグラフのカードの中に出す
    if (!hasTide) {
      box.innerHTML = `${icon("warning", { size: 14 })} `
        + `「${escapeHtml(spot?.name ?? "この場所")}」は潮汐の対象外です（淡水）。`
        + `天気と釣行スコアは出ます。`;
    }
  }

  function renderPointNote(point) {
    const box = document.getElementById("tide-point-note");
    if (!point?.area) {
      box.textContent = "気象庁の潮位表推算値をそのまま表示しています。";
      return;
    }
    // 推算値であること・根拠を必ず明示する（公的な潮位表ではない）
    box.textContent = `${point.baseName}の推算値を ${formatLag(point.lagMinutes)} ずらした推定値`
      + `${point.levelRatio === 1 ? "（潮位の振幅は補正していません）" : `・潮高比 ${point.levelRatio}`}。`
      + `${point.note ? ` ${point.note}。` : ""}${point.source ? ` 出典: ${point.source}` : ""}`;
  }

  /* ヒーローの見出し（D-116）。
     **小さい 1 行の羅列（`福田港 / 大潮 / 晴れ / 北 1m`）はやめた。**
     4 つとも別の場所に、より大きく出ている:
       スポット名 … 画面いちばん上の帯
       潮回り     … すぐ下のタグ（色付き）
       天気・風   … 時間別天気のいまの時間のカード
     小さくて読みづらいものを重ねて置くより、**大きいほうを 1 つ残す。** */
  function renderHero(spot, tide, weather, point, sun) {
    const tags = document.getElementById("hero-tags");
    const now = weather?.find((w) => w.hour === nowInJst().hour) ?? weather?.[0] ?? null;

    /* スコアは時間帯ごとに判定する（D-051・D-052・D-103）。
       上の天気表示は「いま」なので別物。

       **窓は「これから 24 時間」**（D-115）。前は「今日」で切っていたので、
       10 時に見ると 07 時の点を大きく出していた。もう行けない時間の点だった。
       時間別天気・潮位グラフと同じ窓にそろえて、この画面の中を 1 つの窓にする。

       潮汐と日の出は**日をまたぐので日付で引く**。明日ぶんは
       loadNeighbours があとから入れるので、届いたら描き直す。
       淡水スポットは潮汐が無いので tideMatters: false で天気だけで採点する
       （D-105。spots.html が前からこの形・D-077） */
    const nowJst = nowInJst();
    scoreOf = weather?.length
      ? hourScorer({ contextOf: scoreContextOf(tide, sun), tideMatters: Boolean(tide), point })
      : null;
    scoreContext = weather?.length
      ? fishingScoreAhead({
          hours: weather, nowIso: `${nowJst.date}T${nowJst.hhmm}`,
          tideMatters: Boolean(tide),
          contextOf: scoreContextOf(tide, sun), point,
        })
      : null;
    if (scoreContext) {
      document.getElementById("score").textContent = scoreContext.score;
      document.getElementById("score-help").disabled = false;
      /* **タグを絞る**（D-116）。前は 5 つ並んでいて、2 つが別の場所と
         同じことを言っていた。
           - 釣行スコア 高 … 12 日中 11 日が「高」で、ほとんど変わらない
           - 日中 09:00 … 時間別天気の★が 1 時間ごとに同じことを言う

         **潮回りは残す。** 上の 1 行にも出していたが小さくて読みづらく、
         タグのほうが一目で分かる（本人の指摘）。上の 1 行のほうを畳んだ。
         色は週間カレンダーと同じ TIDE_TYPE_COLORS。大潮か長潮かが**色で分かる**。
         潮汐が無い場所（淡水）では潮回りも波高も月齢も値そのものが無いので出さない */
      tags.innerHTML = [
        tide ? tideTypeTag(tide.tide_type) : "",
        tide && now?.wave_height_m != null ? `<span class="tag tag-blue">波高 ${now.wave_height_m}m</span>` : "",
        tide ? `<span class="tag tag-gray">月齢 ${tide.moon_age}</span>` : "",
        // 見出しの 1 行を畳んだので、どこの予報かはここで言う（D-116）
        spot ? "" : `<span class="tag tag-gray">${escapeHtml(point?.label ?? "既定の地点")}の予報`
          + `（スポットを登録すると、その場所になります）</span>`,
      ].join("");
    } else if (!spot) {
      tags.innerHTML = `<span class="tag tag-gray">スポットを登録すると天気と釣行スコアが表示されます</span>`;
    }
    renderHourly(weather);
  }

  /* 潮回りのタグ（D-116）。**色は週間カレンダーと同じ**（TIDE_TYPE_COLORS）。
     大潮・中潮・小潮・長潮・若潮のどれでも同じ形で出す。 */
  function tideTypeTag(type) {
    const color = TIDE_TYPE_COLORS[type];
    if (!type) return "";
    return `<span class="tag tag-tide"${color ? ` style="color:${color};border-color:${color}"` : ""}`
      + `>${escapeHtml(type)}</span>`;
  }

  /* 点を出すのに要る、日付ごとの潮汐・潮回り・日の出（D-115 / D-116）。
     **日をまたぐので日付で引く。** 明日ぶんは loadNeighbours があとから入れる */
  function scoreContextOf(tide, sun) {
    const today = todayInJst();
    return (date) => {
      const dayTide = tideCache.get(date) ?? (date === today ? tide : null);
      return {
        sun: sunCache.get(date) ?? (date === today ? sun : null),
        tide: dayTide,
        tideType: dayTide?.tide_type ?? (tide ? tideType(date) : null),
      };
    };
  }

  /* ---------- 潮汐グラフ（日をまたいで連続・D-036） ---------- */
  /* 「いまの潮」（D-129）。**新しい通信はしない。**
     材料は tideCache（すでに描いている潮汐）と sunCache（計算で出る日の出日没）だけ。

     翌日ぶんを渡すのが要点。22 時に開いたとき、今日の満干はもう残っていない。
     そこで「—」を出すと、**夜釣りでいちばん要る一行が消える**。 */
  /* ライブカメラ（D-143 / 043 / D-144）。**押されるまで iframe を作らない。**
     ホームを開いただけで生配信が始まると、通信も電池も持っていかれる。
     埋め込みを禁じている配信なら、押したあとに YouTube 自身がその旨を出す。
     こちらでは判定できないので、そのまま見せる。

     **畳めるようにする**（本人の要望）。畳んだら iframe ごと捨てる。
     隠すだけ（hidden や display:none）にすると、見えないところで
     配信が流れ続けて通信を食う。**畳む＝止まる**でないと畳む意味が無い。

     **開いた状態は覚えない。** 覚えて次に開いたときに開いていると、
     ホームを表示しただけで生配信が始まる。それは上の決めごとと真っ向から
     ぶつかるので、いつも畳んだ状態から始める。

     カメラのそばに**そのカメラが映している浜の波**を出す（D-144）。
     「これが何 m の波か」を映像と数字で見比べられるようにするため（本人）。
     これは**選んでいるスポットの波ではない**ので、必ず地点名を添える。

     ※ camWaves の宣言は**画面の上のほう**（他の状態と同じところ）に置いてある。
        ここに const で置くと、ブートから呼ばれる renderLiveCams のほうが先に走り、
        「Cannot access 'camWaves' before initialization」で落ちる。実際に落とした。 */

  /* **覚えるのは予報そのもの。まとめた文字ではない。**
     ホームは開きっぱなしを前提にしていて（renderNow を毎分やり直している）、
     時刻が進めば「いまの波」も変わる。文字にして覚えると、
     何時間開いていても開いた時刻の波を出し続ける。
     いま何時かを見るのは、**出す直前の 1 か所だけ**にする。 */
  function camWaveNow(c) {
    const hours = camWaves.get(c.code);
    if (hours === undefined) return undefined;      // まだ届いていない
    if (!hours) return null;                        // 取れなかった
    return waveSummary(describeWaves(hours, nowInJst().hour));
  }

  function camWaveHead(c) {
    const w = camWaveNow(c);
    if (w === undefined) return `<span class="live-cam-wave loading">波 …</span>`;
    if (!w) return "";               // 取れなかった。黙って何も出さない
    return `<span class="live-cam-wave wv-${w.bandKey}">`
      + `${w.height}<small>m</small> ${escapeHtml(w.band)}</span>`;
  }

  function camWaveBody(c) {
    const w = camWaveNow(c);
    if (!w) return "";
    const bits = [
      w.period ? `周期 ${w.period}秒` : null,
      w.dir ? `${escapeHtml(w.dir)}から` : null,
      w.range ? `今日 ${w.range}` : null,
    ].filter(Boolean).join(" · ");
    return `<div class="live-cam-wave-box">`
      + `<div class="cw-head">`
      + `<span class="cw-place">${escapeHtml(c.name)}沖の波</span>`
      + `<span class="cw-now wv-${w.bandKey}">${w.height}<small>m</small></span>`
      + `<span class="cw-band wv-${w.bandKey}">${escapeHtml(w.band)}</span>`
      + `</div>`
      + (bits ? `<div class="cw-sub">${bits}</div>` : "")
      + `<div class="cw-note">${escapeHtml(w.note)}</div>`
      + (w.swell ? `<div class="cw-note">${escapeHtml(w.swell)}</div>` : "")
      + `</div>`;
  }

  function renderLiveCams(cameras) {
    const box = document.getElementById("live-cam");
    const usable = (cameras ?? [])
      .map((c) => ({ ...c, url: liveCameraEmbedUrl(c) }))
      .filter((c) => c.url);
    liveCams = usable;
    if (!usable.length) { box.hidden = true; box.innerHTML = ""; return; }

    box.hidden = false;
    box.innerHTML = usable.map((c, i) => `<div class="live-cam-item" data-i="${i}">`
      + `<button type="button" class="live-cam-open" aria-expanded="false">`
      + `${icon("camera", { size: 15 })}`
      + `<span class="nm">${escapeHtml(c.name)}のライブ映像</span>`
      + `<span class="head-wave"></span>`
      + `<span class="caret">${icon("chevron-down", { size: 14 })}</span>`
      + `</button>`
      + `<div class="live-cam-body" hidden></div></div>`).join("");

    box.querySelectorAll(".live-cam-item").forEach((item) => {
      const c = usable[Number(item.dataset.i)];
      const bar = item.querySelector(".live-cam-open");
      const body = item.querySelector(".live-cam-body");
      bar.addEventListener("click", () => {
        const open = bar.getAttribute("aria-expanded") === "true";
        if (open) {
          /* **中身ごと捨てる。** iframe が残っていると畳んでも配信が続く */
          body.innerHTML = "";
          body.hidden = true;
          bar.setAttribute("aria-expanded", "false");
          return;
        }
        body.hidden = false;
        body.innerHTML = `<div class="live-cam-frame">`
          + `<iframe src="${c.url}" title="${escapeHtml(c.name)}のライブ映像"`
          + ` loading="lazy" allowfullscreen`
          + ` referrerpolicy="strict-origin-when-cross-origin"`
          + ` sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`
          + `</div>`
          + camWaveBody(c)
          + `<div class="live-cam-note">${escapeHtml(c.name)}`
          + `${c.note ? ` — ${escapeHtml(c.note)}` : ""}。`
          + `波は沖の推算値なので、映像に見えているものとは差が出ます。`
          + `見比べると、何 m がどう見えるかの見当が付きます。</div>`;
        bar.setAttribute("aria-expanded", "true");
      });
      /* 波はカメラの座標で別に取る（D-144）。**待たない。**
         届いたら見出しを書き替え、開いていれば中も描き直す */
      loadCamWave(c).then(refreshCamWaves);
      item.querySelector(".head-wave").innerHTML = camWaveHead(c);
    });
  }

  /** カメラの座標の波を取って覚える。取れなければ null を覚える（何も出さない）。 */
  async function loadCamWave(c) {
    if (camWaves.has(c.code)) return;
    if (c.lat == null || c.lng == null) { camWaves.set(c.code, null); return; }
    try {
      camWaves.set(c.code, await fetchWaves(c.lat, c.lng, todayInJst()));
    } catch {
      /* **取れなかったことを覚える。** ここを空のままにすると「…」が出しっぱなしになる。
         0m とは書かない（凪いでいるのと、取れていないのは別物・D-142） */
      camWaves.set(c.code, null);
    }
  }

  /** カメラのそばの波を、いまの時刻で書き直す。**通信はしない。** */
  function refreshCamWaves() {
    document.querySelectorAll("#live-cam .live-cam-item").forEach((item) => {
      const c = liveCams[Number(item.dataset.i)];
      if (!c) return;
      const head = item.querySelector(".head-wave");
      if (head) head.innerHTML = camWaveHead(c);
      const old = item.querySelector(".live-cam-wave-box");
      if (old) old.outerHTML = camWaveBody(c);
    });
  }

  function renderNow() {
    const box = document.getElementById("hero-now");
    const now = nowInJst();
    const tomorrow = addJstDays(now.date, 1);
    const tide = tideCache.get(now.date) ?? null;
    if (!tide) { box.hidden = true; box.innerHTML = ""; return; }

    const level = tideLevelAt(tide.hourly_levels_cm, Math.min(now.hours, 23));
    const flow = tideFlowAt(tide, now.hhmm);
    const next = nextTideEvent(tide, tideCache.get(tomorrow) ?? null, now.hhmm);
    const sun = nextSunEvent(sunCache.get(now.date) ?? null,
                             sunCache.get(tomorrow) ?? null, now.hhmm);

    /* **釣りの言葉で言う**（D-138）。「上げ潮 · よく流れている」より
       「上げ4分」のほうが短くて、しかも情報が多い。
       N 分は潮位の位置なので、向き（上げ／下げ）と、転換からどれだけ動いたかが
       1 語で分かる。0〜5 分なら速くなっていく途中、5〜10 分なら緩んでいく。

       材料が足りないとき（前後の日の潮汐がまだ来ていないなど）は
       今までの言い方に落とす。**出ないより粗くても出るほうがいい** */
    const phase = tidePhaseAt(tide, now.hhmm, {
      previous: tideCache.get(addJstDays(now.date, -1)) ?? null,
      next: tideCache.get(tomorrow) ?? null,
    });
    const flowText = phase ? phase.label
      : !flow ? ""
      : flow.direction === "潮止まり" ? TIDE_FLOW_LABELS.slack
      : `${flow.direction} · ${TIDE_FLOW_LABELS[flow.key]}`;
    const dir = flow?.direction === "上げ潮" ? "up" : flow?.direction === "下げ潮" ? "down" : "flat";

    /* 日をまたぐものは**時刻の前に「翌」を付ける**。残り時間の隣に書き足すと
       「あと 2時間12分 翌日」となって、どちらにかかる言葉か読み取れない */
    const row = (label, time, minutes, nextDay) => {
      const left = formatCountdown(minutes);
      return `<div class="hn-row">`
        + `<span class="k">${escapeHtml(label)}</span>`
        + `<span class="v">${nextDay ? `<small>翌</small>` : ""}${escapeHtml(time)}</span>`
        + `<span class="t">${left ? `あと ${escapeHtml(left)}` : ""}</span>`
        + `</div>`;
    };

    /* 波（D-142）。**外洋に面した場所でしか出さない。**
       サーフは「行ってみたら立てない」が起きるので、行く前に分かるものは出す。
       波高だけでは足りない（同じ 1.0m でも周期 5 秒の風波と 10 秒のうねりでは別物）。

       **沖の推算値であって、岸で見える波ではない。** そこは言い切らない。 */
    /* 数字と語は waveSummary が作る（D-144）。ライブ映像に添える波の欄と
       同じものを言うので、**文字にする場所を 2 つに増やさない** */
    const wave = waveSummary(describeWaves(todayHours, now.hour));
    const waveRow = !wave ? "" : `<div class="hn-row hn-wave">`
      + `<span class="k">波</span>`
      + `<span class="v">${wave.height}<small>m</small></span>`
      + `<span class="t">`
      + `<span class="wv wv-${wave.bandKey}">${escapeHtml(wave.band)}</span>`
      + (wave.period ? ` ${wave.period}<small>s</small>` : "")
      + (wave.dir ? ` ${escapeHtml(wave.dir)}` : "")
      + (wave.range ? ` <small>今日 ${wave.range}</small>` : "")
      + `</span></div>`;

    box.hidden = false;
    box.innerHTML =
      `<div class="hn-head">`
      + `<span class="hn-when">${icon("clock", { size: 13 })} いま ${now.hhmm}</span>`
      + (level == null ? "" : `<span class="hn-level">${Math.round(level)}<small>cm</small></span>`)
      + (flowText ? `<span class="hn-flow hn-${dir}">${escapeHtml(flowText)}</span>` : "")
      + `</div>`
      + waveRow
      + (next ? row(`次の${next.label}`, next.time, next.inMinutes, next.nextDay) : "")
      + (sun ? row(sun.label, sun.time, sun.inMinutes, sun.nextDay) : "");
  }

  function renderChart() {
    const track = document.getElementById("tide-track");
    const axis = document.getElementById("level-axis");
    // 器の幅は日数から決める。CSS 側に日数を書かない（D-128）
    track.style.setProperty("--chart-days", chartDays.length);
    const tides = chartDays.map((date) => tideCache.get(date) ?? null);
    const result = tideTimelineSvg({
      days: chartDays, tides, suns: sunCache, today: todayInJst(),
      /* 日付は SVG の外の帯に出るので、上の余白は元どおり。
         下は時刻だけになったぶん薄くしてある（D-120 / D-121） */
      dayUnits: 320, height: CHART_H, padTop: 28, padBottom: 20,
    });
    if (!result) {
      track.innerHTML = `<div class="empty">潮汐データを取得できませんでした</div>`;
      document.getElementById("tide-legend").innerHTML = "";
      axis.innerHTML = "";
      return;
    }
    // 日の出・日没はグラフの下の帯で示すので、凡例からは外す（D-053）
    // 日付の帯はグラフと同じ器に入れる（横スクロールに追従する・D-121）
    track.innerHTML = result.ruler + result.svg + sunStripHtml(result.sunMarks);
    // 目盛りは SVG と同じ高さの箱に置く（縦は引き伸ばしていないので座標がそのまま px）
    axis.style.height = `${CHART_H}px`;
    axis.innerHTML = levelAxisHtml(result.levelTicks);

    /* いまの潮位はヒーローの「いまの潮」に大きく出したので、凡例からは落とす（D-129）。
       **同じ数字を 2 か所に置かない。** ここは縦の目盛りの範囲だけを言う */
    const now = nowInJst();
    document.getElementById("tide-legend").innerHTML =
      `<span class="lg lg-now">${icon("clock", { size: 13 })} 現在 ${now.hhmm}</span>`
      + `<span class="lg">潮位 ${result.min}〜${result.max}cm</span>`;

    // 地点名は「推算」かどうかも含めてグラフの下に出す
    const tide = tideCache.get(now.date) ?? tides.find(Boolean);
    document.getElementById("tide-station").textContent =
      `${tide?.point?.name ?? tide?.station ?? ""}${tide?.corrected ? " 推算" : ""}`;
  }

  /** 現在時刻が画面中央に来るようにスクロールする。 */
  function scrollToNow(behavior = "smooth") {
    const scroller = document.getElementById("tide-scroller");
    const now = nowInJst();
    const index = chartDays.indexOf(now.date);
    if (index < 0) return;
    const width = scroller.clientWidth;
    scroller.scrollTo({
      left: Math.max(0, (index + now.hours / 24) * width - width / 2), behavior,
    });
  }

  /** 前後の日を読み足してグラフを伸ばす。 */
  async function loadNeighbours(point, weatherAt, hero, waves = false) {
    const others = chartDays.filter((date) => !tideCache.has(date));
    await Promise.all(others.map(async (date) => {
      const [tide, forecast] = await Promise.all([
        loadTide(point, date),
        weatherAt
          ? fetchWeather(weatherAt.lat, weatherAt.lng, date, { waves }).catch(() => null)
          : null,
      ]);
      tideCache.set(date, tide);
      renderChart();
      renderNow();          // 翌日ぶんが届くと、夜の「次の満潮」が出せるようになる
      /* **スコアを出し直す**（D-115）。窓が「これから 24 時間」になったので、
         夕方以降に見ると帯の半分は明日にかかる。明日の潮汐が届くまでは
         潮の動きぶんの加減が入らず、点が低いまま止まってしまう */
      if (date === addJstDays(todayInJst(), 1) && hero) hero();
    }));
  }

  /* 1 時間ごとの予報（D-104）。描画は app.js の共通版に任せる（D-105）。
     前は潮汐詳細にも同じものが別に書いてあり、片方だけ直して取り残した */
  function renderHourly(weather) {
    renderHourlyStrip(document.getElementById("hourly"), {
      hours: weather, date: todayInJst(),
      leadBox: document.getElementById("hourly-lead"),
      emptyText: "スポットを登録すると天気が表示されます",
      // 1 時間ごとの釣行スコア（D-116）。時間帯 4 つの並びをここに畳んだ
      scoreOf,
    });
  }

  function renderRecent(records) {
    const box = document.getElementById("recent");
    if (!records.length) {
      box.innerHTML = `<div class="empty">まだ釣果がありません。右下の ＋ から記録できます。</div>`;
      return;
    }
    box.innerHTML = records.map((r) => {
      const outcome = recordOutcome(r);
      const title = outcome.value === "none"
        ? `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`
        : outcomeLead(r)
          + `${escapeHtml(recordFishName(r))}${r.length_cm ? ` ${r.length_cm}cm` : ""}`
          + (r.catch_count > 1 ? ` ×${r.catch_count}` : "");
      const when = formatJstDate(r.fished_at, { weekday: true })
        + (r.fished_time ? ` ${r.fished_time.slice(0, 5)}` : "");
      const sub = [when, r.spot_name, r.lure_label]
        .filter(Boolean).map(escapeHtml).join(" / ");
      const owner = ownerBadge(r);
      return `
        <a class="list-item${r.is_mine ? "" : " shared"}" href="record.html?id=${r.id}">
          <div class="thumb">${icon(outcome.iconName, { size: 20 })}</div>
          <div class="list-body">
            <div class="list-title">${owner}${title}</div>
            <div class="list-sub">${sub}</div>
          </div>
          <div class="list-aside">${relativeDays(r.fished_at)}</div>
        </a>`;
    }).join("");
  }

  // ログアウトは設定画面（SCR-014）へ移した
</script>
</body>
</html>
