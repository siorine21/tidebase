<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-001 ホーム（ダッシュボード） -->
<header class="app-header">
  <h1>TIDEBASE</h1>
  <span class="head-actions">
    <!-- お知らせ（D-074）。ナビの 6 枠は埋まっているので、ここから開く。
         未読があるときだけ点を出す -->
    <a class="btn btn-quiet link-btn icon-only" href="news.html" id="news-link"
       aria-label="お知らせ"><span data-icon="bell"></span><i class="dot" hidden></i></a>
    <a class="btn btn-quiet link-btn" href="settings.html" id="settings-link"
       aria-label="設定"><span data-icon="settings"></span>設定</a>
  </span>
</header>

<!-- どこを見ているか（D-105 / D-108）。**選ぶのはスポット 1 つ。**
     そのスポットが天気の座標と潮汐の観測所の両方を決める。
     中身は attachSpotPicker が入れる。潮汐詳細の先頭にも同じものを置く -->
<div id="base-spot-bar" hidden></div>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <!-- 潮汐地点が場所ごとに決まるようになったことの知らせ（D-105）。1 度だけ -->
  <div id="point-notice" class="message point-notice" hidden role="status"></div>
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">TODAY</div>
        <div class="hero-date" id="today">—</div>
      </div>
      <button type="button" class="score-circle" id="score-help"
              aria-label="釣行スコアの説明" disabled>
        <div class="score-num" id="score">—</div>
        <div class="score-label">/5</div>
      </button>
    </div>
    <div class="hero-meta" id="hero-meta">読み込み中…</div>
    <div class="tags" id="hero-tags"></div>
    <!-- 時間帯ごとの点（D-103）。★ひとつだけだと「いつの点か」が伝わらない。
         実際に竿を出すのは夜が多いので、夜の点がその場で読めるようにする -->
    <div class="band-strip" id="band-strip" hidden></div>

    <!-- 時間別天気は TODAY の中に入れる（D-114）。
         スコアも時間帯ごとの点も、この 1 時間ごとの予報から出している。
         別の節に置くと、点の根拠を見るのに節をまたぐことになる。 -->
    <div class="hero-hourly">
      <div class="hero-hourly-head">
        <span>HOURLY WEATHER</span><span class="note">← スクロール →</span>
      </div>
      <!-- いつ雨か、を先に 1 行で（D-104）。数字を並べる前に結論を出す -->
      <div class="hourly-lead" id="hourly-lead" hidden></div>
      <div class="hourly" id="hourly"><div class="empty">読み込み中…</div></div>
      <!-- どこの何を見ているのかを画面に出す（D-076）。
           出典が分からないと、外れたときに「何が外れたのか」を判断できない -->
      <div class="list-sub" id="weather-source"></div>
    </div>
  </section>

  <!-- 潮汐のある場所だけ。淡水スポットではこの節ごと隠す（D-105） -->
  <div id="tide-block">
    <div class="section-label">
      <span>TIDE GRAPH — 本日</span>
      <a class="note" id="tide-detail-link" href="tide.html">詳細 →</a>
    </div>
    <div class="card tide-chart-card">
      <!-- 潮位の目盛りは横スクロールしても残ってほしいので、スクローラの外に重ねる -->
      <div class="tide-plot">
        <div class="tide-scroller" id="tide-scroller" tabindex="0"
             aria-label="潮位グラフ。左右にスクロールすると前後の時間を表示します">
          <div class="tide-track tide-track-3" id="tide-track"></div>
        </div>
        <div class="level-axis" id="level-axis" aria-hidden="true"></div>
      </div>
      <div class="tide-legend" id="tide-legend"></div>
      <!-- どの観測所の値かは、グラフと同じカードの中に置く（D-105）。
           前は下の「潮汐地点」の欄に出ていて、グラフから離れていた -->
      <div class="page-sub" id="tide-station" style="margin-top:8px"></div>
      <div class="page-sub" id="tide-point-note"></div>
    </div>
    <div class="scroll-hint">
      <span data-icon="back"></span>横にスクロールで前後の時間へ（日をまたいで連続）<span data-icon="chevron-right"></span>
    </div>
  </div>
  <!-- 淡水スポットのとき。空のグラフを出さない -->
  <div class="card no-tide" id="no-tide" hidden></div>

  <div class="section-label"><span>RECENT CATCH</span><a class="note" href="records.html">すべて見る →</a></div>
  <div id="recent"><div class="empty">読み込み中…</div></div>

  <div class="section-label"><span>TIDE CORRELATION</span><span class="note">過去釣行データより</span></div>
  <div class="card" id="correlation"><div class="empty">読み込み中…</div></div>
</main>

<a class="fab" href="record-new.html" title="釣果を記録" data-icon="plus"></a>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml,
    fetchTide, fetchWeather, todayInJst, formatJstDate, relativeDays,
    describeWeather, windDirection, fishingScoreOfDay, showFishingScoreHelp, savedScoreBand,
    renderHourlyStrip,
    listSpots, listRecords, tideCorrelation, icon,
    recordFishName, ownerBadge, nowInJst, hoursFromHhmm, addJstDays,
    listTidePoints, fetchTideForPoint, savedTidePoint, saveTidePoint, formatLag,
    pickBaseSpot, spotTidePoint, savedBaseSpot, saveBaseSpot, attachSpotPicker,
    warmTideCache,
    hasUnreadNews, WEATHER_SOURCE,
    isCoordinateInJapan, tideTimelineSvg, sunStripHtml, levelAxisHtml, tideLevelAt, sunTimes,
    recordOutcome,
    outcomeLead,
  } from "./assets/app.js";

  // 静岡県特化のため既定は舞阪（浜名湖口・遠州灘西部の基準）
  const DEFAULT_POINT = "ST:MI";

  // グラフの状態（宣言はセッション処理より前に置く。const/let は巻き上がらない）
  let chartDays = [];
  let tideCache = new Map();          // 日付 → 潮汐
  const sunCache = new Map();         // 日付 → 日の出・日没
  const CHART_H = 152;                // グラフの高さ（潮位目盛りの箱もこれに合わせる）

  // いま何でスコアを判定したか。スコア円を押されたときに説明へ渡す
  let scoreContext = null;
  document.getElementById("score-help").addEventListener("click", () => {
    if (scoreContext) showFishingScoreHelp(scoreContext);
  });

  const session = await requireSession();
  if (session) {
    renderNav("home");

    // 未読のお知らせがあるときだけ点を出す（D-074）。
    // 読み込めなくてもホームは動かしたいので、失敗は握りつぶす
    hasUnreadNews().then((unread) => {
      document.querySelector("#news-link .dot").hidden = !unread;
    }).catch(() => {});
    const today = todayInJst();
    document.getElementById("today").textContent = formatJstDate(today, { weekday: true });

    /* 基準スポット（D-105）。**選ぶのはここだけ。**
       このスポットが天気の座標と潮汐の観測所の両方を決める */
    const spots = await listSpots().catch(() => []);
    const baseSpot = pickBaseSpot(spots, savedBaseSpot());
    const points = await listTidePoints().catch(() => []);
    /* どこを見ているかの帯（D-108）。**潮汐詳細と同じ部品を使う。**
       スポットを変えたら**画面ごと読み直す**（D-105）。
       潮汐も天気も日の出も、スコアも、全部この 1 つで決まる。
       ここだけ差分で描き替えると、どれか 1 つを直し忘れて
       「地名は変わったのに天気は前のまま」が起きる。前がそれだった。
       **描いた直後に付ける。** 天気の通信を待ってから付けると、
       読み込み中に選んだ操作が黙って捨てられる */
    attachSpotPicker(document.getElementById("base-spot-bar"), {
      spots, selected: baseSpot,
      onPick: (spot) => { saveBaseSpot(spot.id); location.reload(); },
    });

    /* 潮汐地点はスポットから決まる。淡水スポットは観測所を持たないので null。
       スポットが 1 件も無いときだけ、静岡県の既定（舞阪）で出す */
    let point = spotTidePoint(baseSpot, points)
      ?? (baseSpot ? null : (points.find((p) => p.value === DEFAULT_POINT) ?? points[0] ?? null));
    noticePointChange(baseSpot, point);
    if (point) {
      document.getElementById("tide-detail-link").href = baseSpot
        ? `tide.html?spot=${encodeURIComponent(baseSpot.id)}`
        : `tide.html?point=${encodeURIComponent(point.value)}`;
      /* 電波があるうちに 1 週間ぶんの潮汐を取っておく（D-096）。
         圏外で要るのは「その日たまたま開いた分」ではなく「これから行く日」。
         待たない。表示の邪魔をしない */
      warmTideCache(point).catch(() => {});
    }
    renderTideAvailability(baseSpot, point);

    // 天気はスポットの座標で取る。座標が未設定・国外なら潮汐地点の座標で代用する。
    // （(0,0) のまま Open-Meteo に投げると赤道の大西洋上の日の出日没が返ってくる）
    const spotUsable = baseSpot
      && isCoordinateInJapan(baseSpot.latitude, baseSpot.longitude);
    const weatherAt = spotUsable
      ? { lat: baseSpot.latitude, lng: baseSpot.longitude }
      : (point?.lat != null ? { lat: point.lat, lng: point.lng } : null);
    if (baseSpot && !spotUsable) warnSpotCoordinates(baseSpot);

    // グラフは昨日〜明日の 3 日ぶんを 1 本につないで表示する（夜釣りは日をまたぐ）。
    // まず今日ぶんだけ描いて、前後の日は後から足す（ホームの表示を待たせない）
    chartDays = [addJstDays(today, -1), today, addJstDays(today, 1)];

    const [tide, forecast] = await Promise.all([
      loadTide(point, today),
      weatherAt ? fetchWeather(weatherAt.lat, weatherAt.lng, today).catch(() => null) : null,
    ]);
    const weather = forecast?.hours ?? null;
    tideCache.set(today, tide);
    // 日の出・日没は計算で出す（D-056）。天気の通信を待たずに夜の帯と印が描ける
    if (weatherAt) {
      for (const date of chartDays) sunCache.set(date, sunTimes(weatherAt.lat, weatherAt.lng, date));
    }

    renderHero(baseSpot, tide, weather, point, sunCache.get(today) ?? null);
    renderChart();
    renderHourly(weather, sunCache.get(today) ?? null);
    // どこの天気なのかを出す。基準スポットが無ければ潮汐地点の座標で取っている
    document.getElementById("weather-source").textContent = weatherAt
      ? `${spotUsable ? (baseSpot.name ?? "無名スポット") : (point?.label ?? "既定の地点")}`
        + `（北緯 ${Number(weatherAt.lat).toFixed(3)} / 東経 ${Number(weatherAt.lng).toFixed(3)}）の予報`
        + ` · 出典: ${WEATHER_SOURCE}`
      : `出典: ${WEATHER_SOURCE}`;
    scrollToNow("auto");

    // 前後の日をあとから読み足す
    loadNeighbours(point, weatherAt);

    const [recent, correlation] = await Promise.all([
      listRecords({ limit: 2 }).catch(() => []),
      tideCorrelation().catch(() => []),
    ]);
    renderRecent(recent);
    renderCorrelation(correlation);
  }

  async function loadTide(point, date) {
    if (!point) return null;
    try { return await fetchTideForPoint(point, date); } catch { return null; }
  }

  /** 座標が入っていないスポットは天気がまるで別の場所になるので、直し方を案内する。 */
  function warnSpotCoordinates(spot) {
    const box = document.getElementById("message");
    box.innerHTML = `「${escapeHtml(spot.name ?? "無名スポット")}」に位置が設定されていません。`
      + `天気と日の出・日没は潮汐の観測所のものを表示しています。`
      + `<a href="spot.html?id=${spot.id}">スポット詳細</a>の「編集」から地図をタップして位置を設定してください。`;
    box.className = "message error";
    box.hidden = false;
  }

  /* 潮汐地点は場所ごとに決まるようになった（D-105）。
     前に地点を選んでいた人には 1 度だけ知らせる。**黙って変えない。**
     データは書き換えない（推測でスポットの観測所を上書きすると、
     あとで直したのか元からかが分からなくなる） */
  function noticePointChange(spot, point) {
    const old = savedTidePoint();
    if (!old || !spot || !point || old === point.value) { saveTidePoint(null); return; }
    const box = document.getElementById("point-notice");
    box.innerHTML = `潮汐地点は場所ごとに決まるようになりました。`
      + `「${escapeHtml(spot.name ?? "無名スポット")}」はいま「${escapeHtml(point.name)}」です。`
      + `変えるには<a href="spot.html?id=${spot.id}">スポットの詳細</a>から。`;
    box.hidden = false;
    saveTidePoint(null);          // 1 度出したら消す
  }

  /* 淡水スポットには潮汐が無い。空のグラフを出さずに、そう書く（D-105） */
  function renderTideAvailability(spot, point) {
    const hasTide = Boolean(point);
    document.getElementById("tide-block").hidden = !hasTide;
    const box = document.getElementById("no-tide");
    box.hidden = hasTide;
    if (hasTide) renderPointNote(point);   // 推算であることの断りはグラフのカードの中に出す
    if (!hasTide) {
      box.innerHTML = `${icon("warning", { size: 14 })} `
        + `「${escapeHtml(spot?.name ?? "この場所")}」は潮汐の対象外です（淡水）。`
        + `天気と釣行スコアは出ます。`;
    }
  }

  function renderPointNote(point) {
    const box = document.getElementById("tide-point-note");
    if (!point?.area) {
      box.textContent = "気象庁の潮位表推算値をそのまま表示しています。";
      return;
    }
    // 推算値であること・根拠を必ず明示する（公的な潮位表ではない）
    box.textContent = `${point.baseName}の推算値を ${formatLag(point.lagMinutes)} ずらした推定値`
      + `${point.levelRatio === 1 ? "（潮位の振幅は補正していません）" : `・潮高比 ${point.levelRatio}`}。`
      + `${point.note ? ` ${point.note}。` : ""}${point.source ? ` 出典: ${point.source}` : ""}`;
  }

  function renderHero(spot, tide, weather, point, sun) {
    const meta = document.getElementById("hero-meta");
    const tags = document.getElementById("hero-tags");
    const now = weather?.find((w) => w.hour === nowInJst().hour) ?? weather?.[0] ?? null;

    const parts = [];
    // スポット未登録でも、潮汐地点の名前と天気を出して使える状態にする
    parts.push(`${icon("map-pin", { size: 13 })} `
      + escapeHtml(spot ? (spot.name ?? "無名スポット") : (point?.label ?? "スポット未登録")));
    if (tide) parts.push(tide.tide_type);
    if (now) {
      const { label, icon: weatherIcon } = describeWeather(now.weather_code);
      parts.push(`${weatherIcon} ${label}`);
      parts.push(`${windDirection(now.wind_dir_deg)} ${Math.round(now.wind_speed_ms)}m`);
    }
    meta.innerHTML = parts.join(" / ");

    /* スコアは時間帯ごとに判定する（D-051・D-052・D-103）。
       上の天気表示は「いま」なので別物。
       date を渡すのは、予報を 2 日ぶん取ってあるため（D-103）。
       淡水スポットは潮汐が無いので tideMatters: false で天気だけで採点する
       （D-105。spots.html が前からこの形・D-077） */
    scoreContext = weather?.length
      ? fishingScoreOfDay({ tideType: tide?.tide_type ?? null, hours: weather, sun,
                            tide: tide ?? null, tideMatters: Boolean(tide),
                            date: today, band: savedScoreBand() })
      : null;
    if (scoreContext) {
      const { score, best } = scoreContext;
      document.getElementById("score").textContent = score;
      document.getElementById("score-help").disabled = false;
      // 潮汐が無い場所では潮回り・月齢・波高を出さない（値そのものが無い）
      tags.innerHTML = [
        tide ? `<span class="tag tag-mustard">${tide.tide_type}</span>` : "",
        `<span class="tag ${score >= 4 ? "tag-green" : "tag-gray"}">釣行スコア ${score >= 4 ? "高" : score >= 3 ? "中" : "低"}</span>`,
        `<span class="tag tag-blue">${escapeHtml(best.label)} ${escapeHtml(best.at)}</span>`,
        tide && now?.wave_height_m != null ? `<span class="tag tag-blue">波高 ${now.wave_height_m}m</span>` : "",
        tide ? `<span class="tag tag-gray">月齢 ${tide.moon_age}</span>` : "",
      ].join("");
      renderBandStrip(scoreContext);
    } else if (!spot) {
      tags.innerHTML = `<span class="tag tag-gray">スポットを登録すると天気と釣行スコアが表示されます</span>`;
    }
  }

  /* 時間帯ごとの点を横に並べる（D-103）。
     ★は 1 つしか出せないので、「いつの点か」はここで見てもらう。
     押すと、その時間帯を選んだ状態で説明を開く。 */
  function renderBandStrip(day) {
    const box = document.getElementById("band-strip");
    if (!day || day.fallback || day.bands.length < 2) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = day.bands.map((b) => `
      <button type="button" class="band-cell${b === day.best ? " on" : ""}"
              data-band="${b.key}">
        <span class="band-name">${escapeHtml(b.label)}</span>
        <span class="band-score">${b.score}</span>
        <span class="band-at">${escapeHtml(b.at)}</span>
      </button>`).join("");
  }

  document.getElementById("band-strip").addEventListener("click", (e) => {
    const cell = e.target.closest(".band-cell");
    if (!cell || !scoreContext) return;
    // 押した時間帯を「この日のスコア」として説明を開く。設定は変えない
    const picked = scoreContext.bands.find((b) => b.key === cell.dataset.band);
    if (!picked) return;
    showFishingScoreHelp({ ...scoreContext, score: picked.score, best: picked, preferred: true });
  });

  /* ---------- 潮汐グラフ（日をまたいで連続・D-036） ---------- */
  function renderChart() {
    const track = document.getElementById("tide-track");
    const axis = document.getElementById("level-axis");
    const tides = chartDays.map((date) => tideCache.get(date) ?? null);
    const result = tideTimelineSvg({
      days: chartDays, tides, suns: sunCache, today: todayInJst(),
      dayUnits: 320, height: CHART_H, padTop: 28, padBottom: 28,
    });
    if (!result) {
      track.innerHTML = `<div class="empty">潮汐データを取得できませんでした</div>`;
      document.getElementById("tide-legend").innerHTML = "";
      axis.innerHTML = "";
      return;
    }
    // 日の出・日没はグラフの下の帯で示すので、凡例からは外す（D-053）
    track.innerHTML = result.svg + sunStripHtml(result.sunMarks);
    // 目盛りは SVG と同じ高さの箱に置く（縦は引き伸ばしていないので座標がそのまま px）
    axis.style.height = `${CHART_H}px`;
    axis.innerHTML = levelAxisHtml(result.levelTicks);

    const now = nowInJst();
    const level = tideLevelAt(tideCache.get(now.date)?.hourly_levels_cm, Math.min(now.hours, 23));
    document.getElementById("tide-legend").innerHTML =
      `<span class="lg lg-now">${icon("clock", { size: 13 })} 現在 ${now.hhmm}${
          level != null ? ` · 潮位 ${Math.round(level)}cm` : ""}</span>`
      + `<span class="lg">潮位 ${result.min}〜${result.max}cm</span>`;

    // 地点名は「推算」かどうかも含めてグラフの下に出す
    const tide = tideCache.get(now.date) ?? tides.find(Boolean);
    document.getElementById("tide-station").textContent =
      `${tide?.point?.name ?? tide?.station ?? ""}${tide?.corrected ? " 推算" : ""}`;
  }

  /** 現在時刻が画面中央に来るようにスクロールする。 */
  function scrollToNow(behavior = "smooth") {
    const scroller = document.getElementById("tide-scroller");
    const now = nowInJst();
    const index = chartDays.indexOf(now.date);
    if (index < 0) return;
    const width = scroller.clientWidth;
    scroller.scrollTo({
      left: Math.max(0, (index + now.hours / 24) * width - width / 2), behavior,
    });
  }

  /** 前後の日を読み足してグラフを伸ばす。 */
  async function loadNeighbours(point, weatherAt) {
    const others = chartDays.filter((date) => !tideCache.has(date));
    await Promise.all(others.map(async (date) => {
      const [tide, forecast] = await Promise.all([
        loadTide(point, date),
        weatherAt ? fetchWeather(weatherAt.lat, weatherAt.lng, date).catch(() => null) : null,
      ]);
      tideCache.set(date, tide);
      renderChart();
    }));
  }

  /* 1 時間ごとの予報（D-104）。描画は app.js の共通版に任せる（D-105）。
     前は潮汐詳細にも同じものが別に書いてあり、片方だけ直して取り残した */
  function renderHourly(weather, sun) {
    renderHourlyStrip(document.getElementById("hourly"), {
      hours: weather, sun, date: todayInJst(),
      leadBox: document.getElementById("hourly-lead"),
      emptyText: "スポットを登録すると天気が表示されます",
    });
  }

  function renderRecent(records) {
    const box = document.getElementById("recent");
    if (!records.length) {
      box.innerHTML = `<div class="empty">まだ釣果がありません。右下の ＋ から記録できます。</div>`;
      return;
    }
    box.innerHTML = records.map((r) => {
      const outcome = recordOutcome(r);
      const title = outcome.value === "none"
        ? `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`
        : outcomeLead(r)
          + `${escapeHtml(recordFishName(r))}${r.length_cm ? ` ${r.length_cm}cm` : ""}`
          + (r.catch_count > 1 ? ` ×${r.catch_count}` : "");
      const when = formatJstDate(r.fished_at, { weekday: true })
        + (r.fished_time ? ` ${r.fished_time.slice(0, 5)}` : "");
      const sub = [when, r.spot_name, r.lure_label]
        .filter(Boolean).map(escapeHtml).join(" / ");
      const owner = ownerBadge(r);
      return `
        <a class="list-item${r.is_mine ? "" : " shared"}" href="record.html?id=${r.id}">
          <div class="thumb">${icon(outcome.iconName, { size: 20 })}</div>
          <div class="list-body">
            <div class="list-title">${owner}${title}</div>
            <div class="list-sub">${sub}</div>
          </div>
          <div class="list-aside">${relativeDays(r.fished_at)}</div>
        </a>`;
    }).join("");
  }

  function renderCorrelation(rows) {
    const box = document.getElementById("correlation");
    if (!rows.length) {
      box.innerHTML = `<div class="empty">海水・汽水スポットでの釣果が貯まると表示されます</div>`;
      return;
    }
    const maxScore = Math.max(...rows.map((r) => Number(r.score) || 0), 1);
    box.innerHTML = rows.map((r) => `
      <div class="corr-row">
        <div class="corr-head">
          <span class="name">${escapeHtml(r.tide_type ?? "—")}</span>
          <span class="stat">釣行 ${r.outing_count}回 / 釣果 ${r.catch_count}匹 / Score ${r.score}</span>
        </div>
        <div class="corr-bar"><div class="corr-fill" style="width:${(Number(r.score) / maxScore) * 100}%"></div></div>
      </div>`).join("");
  }

  // ログアウトは設定画面（SCR-014）へ移した
</script>
</body>
</html>
