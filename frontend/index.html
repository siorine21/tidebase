<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-001 ホーム（ダッシュボード） -->
<header class="app-header">
  <h1>TIDEBASE</h1>
  <button type="button" class="btn btn-quiet" id="signout">ログアウト</button>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <section class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">TODAY</div>
        <div class="hero-date" id="today">—</div>
      </div>
      <div class="score-circle">
        <div class="score-num" id="score">—</div>
        <div class="score-label">/5</div>
      </div>
    </div>
    <div class="hero-meta" id="hero-meta">読み込み中…</div>
    <div class="tags" id="hero-tags"></div>
  </section>

  <div class="section-label">
    <span>TIDE GRAPH — 本日</span>
    <a class="note" id="tide-detail-link" href="tide.html">詳細 →</a>
  </div>
  <div class="card" id="tide-card">
    <div class="empty" id="tide-empty">読み込み中…</div>
  </div>
  <div class="page-sub" id="tide-station" style="margin:-8px 0 12px"></div>
  <div class="field tide-point">
    <label for="tide-point">潮汐地点</label>
    <select id="tide-point"></select>
    <div class="page-sub" id="tide-point-note"></div>
  </div>

  <div class="section-label"><span>HOURLY WEATHER</span><span class="note">← スクロール →</span></div>
  <div class="card">
    <div class="hourly" id="hourly"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="section-label"><span>RECENT CATCH</span><a class="note" href="records.html">すべて見る →</a></div>
  <div id="recent"><div class="empty">読み込み中…</div></div>

  <div class="section-label"><span>TIDE CORRELATION</span><span class="note">過去釣行データより</span></div>
  <div class="card" id="correlation"><div class="empty">読み込み中…</div></div>
</main>

<a class="fab" href="record-new.html" title="釣果を記録" data-icon="plus"></a>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml,
    fetchTide, fetchWeather, todayInJst, formatJstDate, formatShortDate, relativeDays,
    describeWeather, windDirection, fishingScore, listSpots, listRecords, tideCorrelation, icon,
    recordFishName, nowInJst, hoursFromHhmm,
    listTidePoints, fetchTideForPoint, tidePointOfSpot, savedTidePoint, saveTidePoint, formatLag,
    isCoordinateInJapan,
  } from "./assets/app.js";

  // 静岡県特化のため既定は舞阪（浜名湖口・遠州灘西部の基準）
  const DEFAULT_POINT = "ST:MI";

  const session = await requireSession();
  if (session) {
    renderNav("home");
    const today = todayInJst();
    document.getElementById("today").textContent = formatJstDate(today, { weekday: true });

    // 基準スポット: 最近登録した海水・汽水スポット（潮汐・天気の取得地点）
    const spots = await listSpots().catch(() => []);
    const baseSpot = spots.find((s) => s.water_type !== "freshwater") ?? spots[0] ?? null;

    // 潮汐地点: 明示的な選択 → 基準スポットの地点 → 静岡県の既定（舞阪）
    const points = await listTidePoints().catch(() => []);
    const pick = (value) => points.find((p) => p.value === value) ?? null;
    let point = pick(savedTidePoint()) ?? pick(tidePointOfSpot(baseSpot)) ?? pick(DEFAULT_POINT)
      ?? points[0] ?? null;
    renderPointPicker(points, point);
    if (point) {
      document.getElementById("tide-detail-link").href =
        `tide.html?point=${encodeURIComponent(point.value)}`;
    }

    // 天気はスポットの座標で取る。座標が未設定・国外なら潮汐地点の座標で代用する。
    // （(0,0) のまま Open-Meteo に投げると赤道の大西洋上の日の出日没が返ってくる）
    const spotUsable = baseSpot
      && isCoordinateInJapan(baseSpot.latitude, baseSpot.longitude);
    const weatherAt = spotUsable
      ? { lat: baseSpot.latitude, lng: baseSpot.longitude }
      : (point?.lat != null ? { lat: point.lat, lng: point.lng } : null);
    if (baseSpot && !spotUsable) warnSpotCoordinates(baseSpot);

    const [tide, forecast] = await Promise.all([
      loadTide(point, today),
      weatherAt ? fetchWeather(weatherAt.lat, weatherAt.lng, today).catch(() => null) : null,
    ]);
    const weather = forecast?.hours ?? null;
    const sun = forecast?.sun ?? null;

    renderHero(baseSpot, tide, weather, point);
    renderTideGraph(tide, sun);
    renderHourly(weather);

    // 地点を変えたら潮汐だけ差し替える（天気はスポット座標のままで変わらない）
    document.getElementById("tide-point").addEventListener("change", async (e) => {
      const chosen = pick(e.currentTarget.value);
      if (!chosen) return;
      saveTidePoint(chosen.value);
      renderPointNote(chosen);
      document.getElementById("tide-detail-link").href = `tide.html?point=${encodeURIComponent(chosen.value)}`;
      document.getElementById("tide-card").innerHTML =
        `<div class="empty" id="tide-empty">読み込み中…</div>`;
      renderTideGraph(await loadTide(chosen, today), sun);
    });

    const [recent, correlation] = await Promise.all([
      listRecords({ limit: 2 }).catch(() => []),
      tideCorrelation().catch(() => []),
    ]);
    renderRecent(recent);
    renderCorrelation(correlation);
  }

  async function loadTide(point, date) {
    if (!point) return null;
    try { return await fetchTideForPoint(point, date); } catch { return null; }
  }

  /** 座標が入っていないスポットは天気がまるで別の場所になるので、直し方を案内する。 */
  function warnSpotCoordinates(spot) {
    const box = document.getElementById("message");
    box.innerHTML = `「${escapeHtml(spot.name ?? "無名スポット")}」に位置が設定されていません。`
      + `天気と日の出・日没は下で選んだ潮汐地点のものを表示しています。`
      + `<a href="spot.html?id=${spot.id}">スポット詳細</a>の「編集」から地図をタップして位置を設定してください。`;
    box.className = "message error";
    box.hidden = false;
  }

  function renderPointPicker(points, selected) {
    const select = document.getElementById("tide-point");
    if (!points.length) {
      document.querySelector(".tide-point").hidden = true;
      return;
    }
    const groups = [...new Set(points.map((p) => p.group))];
    select.innerHTML = groups.map((group) => `
      <optgroup label="${escapeHtml(group)}">
        ${points.filter((p) => p.group === group)
          .map((p) => `<option value="${escapeHtml(p.value)}"${p.value === selected?.value ? " selected" : ""}
                  >${escapeHtml(p.label)}</option>`).join("")}
      </optgroup>`).join("");
    renderPointNote(selected);
  }

  function renderPointNote(point) {
    const box = document.getElementById("tide-point-note");
    if (!point?.area) {
      box.textContent = "気象庁の潮位表推算値をそのまま表示しています。";
      return;
    }
    // 推算値であること・根拠を必ず明示する（公的な潮位表ではない）
    box.textContent = `${point.baseName}の推算値を ${formatLag(point.lagMinutes)} ずらした推定値`
      + `${point.levelRatio === 1 ? "（潮位の振幅は補正していません）" : `・潮高比 ${point.levelRatio}`}。`
      + `${point.note ? ` ${point.note}。` : ""}${point.source ? ` 出典: ${point.source}` : ""}`;
  }

  function renderHero(spot, tide, weather, point) {
    const meta = document.getElementById("hero-meta");
    const tags = document.getElementById("hero-tags");
    const now = weather?.find((w) => w.hour === nowInJst().hour) ?? weather?.[0] ?? null;

    const parts = [];
    // スポット未登録でも、潮汐地点の名前と天気を出して使える状態にする
    parts.push(`${icon("map-pin", { size: 13 })} `
      + escapeHtml(spot ? (spot.name ?? "無名スポット") : (point?.label ?? "スポット未登録")));
    if (tide) parts.push(tide.tide_type);
    if (now) {
      const { label, icon: weatherIcon } = describeWeather(now.weather_code);
      parts.push(`${weatherIcon} ${label}`);
      parts.push(`${windDirection(now.wind_dir_deg)} ${Math.round(now.wind_speed_ms)}m`);
    }
    meta.innerHTML = parts.join(" / ");

    if (tide && now) {
      const score = fishingScore(tide.tide_type, now.weather_code, now.wind_speed_ms);
      document.getElementById("score").textContent = score;
      tags.innerHTML = [
        `<span class="tag tag-mustard">${tide.tide_type}</span>`,
        `<span class="tag ${score >= 4 ? "tag-green" : "tag-gray"}">釣行スコア ${score >= 4 ? "高" : score >= 3 ? "中" : "低"}</span>`,
        now.wave_height_m != null ? `<span class="tag tag-blue">波高 ${now.wave_height_m}m</span>` : "",
        `<span class="tag tag-gray">月齢 ${tide.moon_age}</span>`,
      ].join("");
    } else if (!spot) {
      tags.innerHTML = `<span class="tag tag-gray">スポットを登録すると天気と釣行スコアが表示されます</span>`;
    }
  }

  function renderTideGraph(tide, sun) {
    const card = document.getElementById("tide-card");
    if (!tide) { document.getElementById("tide-empty").textContent = "潮汐データを取得できませんでした"; return; }
    // 地点は地点記号ではなく名前で示す。補正した地点は「推算」と付けて観測点と区別する
    // （基準観測点と時差は下の「潮汐地点」欄に出るので、ここは短くまとめる）
    document.getElementById("tide-station").textContent =
      `${tide.point?.name ?? tide.station}${tide.corrected ? " 推算" : ""}`;

    const levels = tide.hourly_levels_cm;
    const valid = levels.filter((v) => v != null);
    const min = Math.min(...valid), max = Math.max(...valid);
    const W = 320, H = 132, padY = 22, padX = 6;
    const x = (i) => padX + (i / 23) * (W - padX * 2);
    const y = (v) => H - padY - ((v - min) / Math.max(1, max - min)) * (H - padY * 2);

    const points = levels.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean);
    const area = `M${padX},${H - padY} L${points.join(" L")} L${W - padX},${H - padY} Z`;

    const now = nowInJst();
    // 表示中の日付が今日でなければ現在時刻の線は出さない
    const showNow = tide.date === now.date;
    const nowLevel = levelAt(levels, now.hours);

    const riseH = hoursFromHhmm(sun?.rise);
    const setH = hoursFromHhmm(sun?.set);

    // 夜間（日の出前・日没後）を薄く塗って昼夜を一目で分かるようにする
    const night = riseH != null && setH != null
      ? `<rect class="night" x="${padX}" y="8" width="${Math.max(0, x(riseH) - padX)}" height="${H - padY - 8}"/>
         <rect class="night" x="${x(setH)}" y="8" width="${Math.max(0, W - padX - x(setH))}" height="${H - padY - 8}"/>`
      : "";

    const sunLine = (hours, label) => hours == null ? "" : `
      <line class="sun-line" x1="${x(hours)}" y1="8" x2="${x(hours)}" y2="${H - padY}"/>
      <text class="sun-time" x="${x(hours)}" y="${H - padY - 5}" text-anchor="middle">${label}</text>`;

    const peaks = [
      ...tide.high_tides.map((e) => ({ ...e, mark: "満" })),
      ...tide.low_tides.map((e) => ({ ...e, mark: "干" })),
    ].filter((e) => e.time);

    card.innerHTML = `
      <svg class="tide-graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="本日の潮位グラフ（日の出・日没・現在時刻つき）">
        ${night}
        <line class="axis" x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}"/>
        ${sunLine(riseH, sun?.rise ?? "")}
        ${sunLine(setH, sun?.set ?? "")}
        <path class="curve" d="${area}"/>
        ${showNow ? `
          <line class="now" x1="${x(now.hours)}" y1="8" x2="${x(now.hours)}" y2="${H - padY}"/>
          ${nowLevel != null ? `<circle class="now-dot" cx="${x(now.hours)}" cy="${y(nowLevel)}" r="3.5"/>` : ""}` : ""}
        ${[0, 6, 12, 18].map((h) => `<text x="${x(h)}" y="${H - 8}">${h}:00</text>`).join("")}
        <text x="${W - padX}" y="${H - 8}" text-anchor="end">24:00</text>
        ${peaks.map((e) => {
          const hour = Number(e.time.slice(0, 2)) + Number(e.time.slice(3, 5)) / 60;
          const cx = x(hour);
          // 端では基準点を切り替えてラベルが見切れないようにする
          const anchor = cx < 30 ? "start" : cx > W - 30 ? "end" : "middle";
          const px = anchor === "start" ? 4 : anchor === "end" ? W - 4 : cx;
          return `<text class="peak" x="${px}" y="${e.mark === "満" ? 12 : 22}"
                        text-anchor="${anchor}">${e.mark} ${e.time}</text>`;
        }).join("")}
      </svg>
      <div class="tide-legend">
        ${sun ? `<span class="lg lg-sun">${icon("sunrise", { size: 13 })} 日の出 ${sun.rise}</span>
                 <span class="lg lg-sun">${icon("sunset", { size: 13 })} 日没 ${sun.set}</span>` : ""}
        ${showNow ? `<span class="lg lg-now">${icon("clock", { size: 13 })} 現在 ${now.hhmm}${
          nowLevel != null ? ` · 潮位 ${Math.round(nowLevel)}cm` : ""}</span>` : ""}
      </div>`;
  }

  /** 毎時の潮位を線形補間して、任意の時刻の潮位を求める。 */
  function levelAt(levels, hours) {
    const i = Math.floor(hours);
    const a = levels[Math.min(i, 23)], b = levels[Math.min(i + 1, 23)];
    if (a == null) return null;
    if (b == null) return a;
    return a + (b - a) * (hours - i);
  }

  function renderHourly(weather) {
    const box = document.getElementById("hourly");
    if (!weather) { box.innerHTML = `<div class="empty">スポットを登録すると天気が表示されます</div>`; return; }
    // 0 時から 3 時間刻みで 24 時間後まで（確定仕様書 2.2 章）。
    // 6時=朝マズメ / 18時=夕マズメを強調
    const picked = weather.filter((w) => w.hour % 3 === 0).slice(0, 9);
    box.innerHTML = picked.map((w, i) => {
      const { icon: weatherIcon } = describeWeather(w.weather_code);
      const badge = w.hour === 6 ? "朝マズメ" : w.hour === 18 ? "夕マズメ" : "";
      return `
        <div class="hour-card${badge ? " highlight" : ""}">
          <div class="h">${i === 8 ? "+24h" : `${w.hour}時`}</div>
          <div class="badge">${badge || "&nbsp;"}</div>
          <div class="icon-wrap">${weatherIcon}</div>
          <div class="t">${Math.round(w.temp_c)}°</div>
          <div class="w">${windDirection(w.wind_dir_deg)}${Math.round(w.wind_speed_ms)}m</div>
        </div>`;
    }).join("");
  }

  function renderRecent(records) {
    const box = document.getElementById("recent");
    if (!records.length) {
      box.innerHTML = `<div class="empty">まだ釣果がありません。右下の ＋ から記録できます。</div>`;
      return;
    }
    box.innerHTML = records.map((r) => {
      const title = r.is_skunked
        ? `${icon("skunk", { size: 15 })} ボウズ`
        : `${escapeHtml(recordFishName(r))}${r.length_cm ? ` ${r.length_cm}cm` : ""}`
          + (r.catch_count > 1 ? ` ×${r.catch_count}` : "");
      const sub = [formatShortDate(r.fished_at), r.spots?.name, r.lure_recipes?.name]
        .filter(Boolean).map(escapeHtml).join(" / ");
      return `
        <a class="list-item" href="record.html?id=${r.id}">
          <div class="thumb">${icon(r.is_skunked ? "skunk" : "fish", { size: 20 })}</div>
          <div class="list-body">
            <div class="list-title">${title}</div>
            <div class="list-sub">${sub}</div>
          </div>
          <div class="list-aside">${relativeDays(r.fished_at)}</div>
        </a>`;
    }).join("");
  }

  function renderCorrelation(rows) {
    const box = document.getElementById("correlation");
    if (!rows.length) {
      box.innerHTML = `<div class="empty">海水・汽水スポットでの釣果が貯まると表示されます</div>`;
      return;
    }
    const maxScore = Math.max(...rows.map((r) => Number(r.score) || 0), 1);
    box.innerHTML = rows.map((r) => `
      <div class="corr-row">
        <div class="corr-head">
          <span class="name">${escapeHtml(r.tide_type ?? "—")}</span>
          <span class="stat">釣行 ${r.outing_count}回 / 釣果 ${r.catch_count}匹 / Score ${r.score}</span>
        </div>
        <div class="corr-bar"><div class="corr-fill" style="width:${(Number(r.score) / maxScore) * 100}%"></div></div>
      </div>`).join("");
  }

  document.getElementById("signout").addEventListener("click", async () => {
    await client.auth.signOut();
    location.replace("login.html");
  });
</script>
</body>
</html>
