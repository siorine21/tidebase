<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員登録 | TIDEBASE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<!-- SCR-017 会員登録 -->
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand">
      <h1>TIDEBASE</h1>
      <p>CREATE YOUR ACCOUNT</p>
    </div>

    <div id="message" class="message" hidden role="alert"></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <p class="hint">8 文字以上</p>
      </div>
      <div class="field">
        <label for="confirm">パスワード（確認）</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn" id="submit">登録する</button>
    </form>

    <p class="alt-link">
      アカウントをお持ちの方は <a href="login.html">ログイン</a>
    </p>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import { client, redirectIfSignedIn, toJapaneseError } from "./assets/app.js";

  const MIN_PASSWORD_LENGTH = 8;

  await redirectIfSignedIn();

  const form = document.getElementById("signup-form");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");

  function show(text, kind) {
    message.textContent = text;
    message.className = `message ${kind}`;
    message.hidden = false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.hidden = true;

    const email = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
      show("メールアドレスとパスワードを入力してください。", "error");
      return;
    }
    if (password.length < MIN_PASSWORD_LENGTH) {
      show(`パスワードは ${MIN_PASSWORD_LENGTH} 文字以上にしてください。`, "error");
      return;
    }
    if (password !== form.confirm.value) {
      show("パスワードが一致しません。", "error");
      return;
    }

    submit.disabled = true;
    submit.textContent = "登録中…";
    // 登録が成功すると handle_new_user トリガーが
    // profiles とメソッド 10 件を自動作成する（確定仕様書 18.3 章）
    const { data, error } = await client.auth.signUp({ email, password });

    if (error) {
      show(toJapaneseError(error), "error");
      submit.disabled = false;
      submit.textContent = "登録する";
      return;
    }

    if (data.session) {
      location.replace("index.html");
      return;
    }
    form.hidden = true;
    show(
      `${email} に確認メールを送信しました。メール内のリンクを開くと登録が完了します。`,
      "success",
    );
  });
</script>
</body>
</html>
