<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEW CATCH | TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-002 釣果入力（5 ステップウィザード） -->
<header class="page-head">
  <button type="button" class="back" id="back" aria-label="戻る">←</button>
  <div>
    <div class="page-title" id="mode-title">NEW CATCH</div>
    <div class="page-sub" id="step-sub">STEP 1/5</div>
  </div>
</header>

<div class="stepper" id="stepper"></div>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <div id="draft-notice" class="message draft-notice" hidden>
    <span>入力途中の内容を復元しました。</span>
    <button type="button" class="chip" id="draft-discard">破棄して最初から</button>
  </div>

  <!-- STEP 1: 魚種・サイズ・匹数 -->
  <section class="card step-panel" data-step="1">
    <div class="actions" style="margin:0 0 14px">
      <button type="button" class="btn btn-quiet" id="skunk-btn" data-icon="skunk">ボウズで記録</button>
    </div>
    <div class="field">
      <label for="species">魚種（任意）</label>
      <select id="species"><option value="">選択しない</option></select>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="length">サイズ（cm）</label>
        <input type="number" id="length" inputmode="decimal" step="0.1" min="0">
      </div>
      <div class="field">
        <label for="weight">重量（g）</label>
        <input type="number" id="weight" inputmode="numeric" step="1" min="0">
      </div>
    </div>
    <div id="name-suggest"></div>
    <div class="field">
      <label for="count">匹数</label>
      <input type="number" id="count" inputmode="numeric" step="1" min="1" value="1">
    </div>
    <div class="field">
      <label for="quantity-note">数量メモ（任意）</label>
      <input type="text" id="quantity-note" placeholder="例: トラウト ×12 / 多数" maxlength="200">
    </div>
  </section>

  <!-- STEP 2: タックル・ルアー -->
  <section class="card step-panel" data-step="2" hidden>
    <div class="field">
      <label for="recipe">使用ルアー / レシピ</label>
      <select id="recipe"><option value="">選択しない</option></select>
    </div>
    <div class="field">
      <label>ヒットレンジ</label>
      <div class="chips" id="layer-chips">
        <span class="chip" data-value="表層">表層</span>
        <span class="chip" data-value="中層">中層</span>
        <span class="chip" data-value="底層">底層</span>
        <span class="chip" data-value="ボトム直撃">ボトム直撃</span>
      </div>
    </div>
    <div class="row-2">
      <div class="field"><label for="rod">ロッド</label><input type="text" id="rod"></div>
      <div class="field"><label for="reel">リール</label><input type="text" id="reel"></div>
    </div>
    <div class="row-2">
      <div class="field"><label for="line">ライン</label><input type="text" id="line"></div>
      <div class="field"><label for="leader">リーダー</label><input type="text" id="leader"></div>
    </div>
  </section>

  <!-- STEP 3: スポット -->
  <section class="card step-panel" data-step="3" hidden>
    <div class="draft-notice" id="skunk-notice" hidden>
      <span>ボウズとして記録します。</span>
      <button type="button" class="chip" id="unskunk">釣果を入力する</button>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="fished-at">釣行日</label>
        <input type="date" id="fished-at">
      </div>
      <div class="field">
        <label for="fished-time">釣れた時刻（任意）</label>
        <div class="time-row">
          <input type="time" id="fished-time">
          <button type="button" class="chip" id="time-now">今</button>
        </div>
        <div class="hint">入力すると、その時刻の潮位を記録します</div>
      </div>
    </div>
    <div class="field">
      <label>スポット</label>
      <div id="spot-list"><div class="empty">読み込み中…</div></div>
    </div>
    <details id="new-spot">
      <summary style="cursor:pointer;color:var(--mustard);font-size:13px">新しいスポットを登録</summary>
      <div style="margin-top:12px">
        <div class="field"><label for="spot-name">スポット名</label><input type="text" id="spot-name" maxlength="100"></div>
        <div class="field">
          <label>位置（地図をタップしてピンを立てる）</label>
          <div class="map-box" id="spot-map" style="height:220px;margin-bottom:6px"></div>
          <div class="page-sub" id="spot-coords">地図をタップすると、その場所にピンが立ちます。</div>
        </div>
        <div class="field">
          <label>水域区分</label>
          <div class="chips" id="water-chips">
            <span class="chip selected" data-value="saltwater">海水</span>
            <span class="chip" data-value="brackish">汽水</span>
            <span class="chip" data-value="freshwater">淡水</span>
          </div>
        </div>
        <div class="actions" style="margin-top:12px">
          <button type="button" class="btn btn-quiet" id="use-gps" data-icon="locate">現在地にピン</button>
          <button type="button" class="btn" id="save-spot">スポットを登録</button>
        </div>
      </div>
    </details>
  </section>

  <!-- STEP 4: 写真 -->
  <section class="card step-panel" data-step="4" hidden>
    <div class="field">
      <label for="photo-input">写真（任意・最大 4 枚）</label>
      <input type="file" id="photo-input" accept="image/*" multiple>
      <div class="hint">
        端末の中で縮小してから保存します（長辺 1600px）。位置情報は残りません。
      </div>
    </div>
    <div id="photo-list" class="photo-grid"></div>
    <div id="photo-note" class="list-sub"></div>
  </section>

  <!-- STEP 5: メモ・公開範囲 -->
  <section class="card step-panel" data-step="5" hidden>
    <div class="field">
      <label for="memo">メモ</label>
      <textarea id="memo" maxlength="2000" placeholder="潮の状況、アタリの出方など"></textarea>
    </div>
    <div class="field">
      <label>公開範囲</label>
      <div class="chips" id="visibility-chips">
        <span class="chip selected" data-value="group">グループ</span>
        <span class="chip" data-value="private">自分のみ</span>
      </div>
    </div>
    <div class="card" style="background:var(--bg-deep);margin-top:12px">
      <div class="list-sub">登録時に潮回り（潮汐）を自動保存します。</div>
      <div id="summary" style="margin-top:8px;font-size:13px"></div>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="btn btn-quiet" id="prev" hidden>← 戻る</button>
    <button type="button" class="btn" id="next">次へ →</button>
    <button type="button" class="btn" id="submit" hidden>この内容で記録する</button>
  </div>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml, toJapaneseError, requireUserId,
    todayInJst, nowInJst, listSpots, listSpecies, listRecipes, suggestFishName, icon,
    groupSpeciesByCategory, createMap, spotMarker,
    listRecordPhotos, uploadRecordPhoto, deleteRecordPhotos, signedPhotoUrls, PHOTO_MAX_COUNT,
  } from "./assets/app.js";

  const STEPS = ["魚種", "タックル", "スポット", "写真", "メモ"];
  const state = { step: 1, isSkunked: false, spotId: null, layer: null, visibility: "group" };

  // 読み込み中にステップを触られたら、そちらを優先する。
  // 通信が遅いと、開いたステップが復元処理で STEP1 に戻されてしまうため
  let userMovedStep = false;

  // 既存の釣果を編集する場合は ?id= が付く
  const recordId = new URLSearchParams(location.search).get("id");
  const DRAFT_KEY = "tidebase.recordDraft";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("records");

  if (recordId) {
    document.getElementById("mode-title").textContent = "EDIT CATCH";
    document.title = "EDIT CATCH | TIDEBASE";
    document.getElementById("submit").textContent = "変更を保存する";
  }
  document.getElementById("fished-at").value = todayInJst();
  renderStepper();

  const [species, recipes, spots] = await Promise.all([
    listSpecies().catch(() => []),
    listRecipes().catch(() => []),
    listSpots().catch(() => []),
  ]);

  // 水域区分ごとにグループ表示（海水 → 汽水 → 淡水）
  document.getElementById("species").insertAdjacentHTML("beforeend",
    groupSpeciesByCategory(species).map(([category, items]) => `
      <optgroup label="${escapeHtml(category)}">
        ${items.map((s) => `<option value="${s.id}" data-rule="${s.name_rule_group ?? ""}"
                >${escapeHtml(s.name)}</option>`).join("")}
      </optgroup>`).join(""));
  document.getElementById("recipe").insertAdjacentHTML("beforeend",
    recipes.map((r) => `<option value="${r.id}">${r.is_favorite ? "[お気に入り] " : ""}${escapeHtml(r.name)}</option>`).join(""));
  renderSpots(spots);

  /* ---------- ステップ制御 ---------- */
  function renderStepper() {
    document.getElementById("stepper").innerHTML = STEPS.map((label, i) => {
      const n = i + 1;
      const cls = n < state.step ? "done" : n === state.step ? "active" : "";
      const skipped = state.isSkunked && (n === 1 || n === 2);
      return `
        <button type="button" class="step" data-step="${n}"
                ${skipped ? "disabled" : ""} aria-current="${n === state.step}">
          <span class="step-dot ${cls}">${skipped ? "–" : n < state.step ? "&#10003;" : n}</span>
          <span class="step-label ${n === state.step ? "active" : ""}">${label}</span>
        </button>`;
    }).join("");
    document.getElementById("step-sub").textContent = `STEP ${state.step}/5`;
  }

  function show(step) {
    state.step = step;
    document.querySelectorAll(".step-panel").forEach((el) => {
      el.hidden = Number(el.dataset.step) !== step;
    });
    document.getElementById("prev").hidden = step === 1;
    document.getElementById("next").hidden = step === 5;
    document.getElementById("submit").hidden = step !== 5;
    if (step === 5) renderSummary();
    renderStepper();
    window.scrollTo(0, 0);
    saveDraft();
  }

  // ステップの丸は押せる。見た目が押せそうなのに反応しないと迷うため
  document.getElementById("stepper").addEventListener("click", (e) => {
    const button = e.target.closest(".step");
    if (!button || button.disabled) return;
    hideMessage();
    userMovedStep = true;
    show(Number(button.dataset.step));
  });

  // ボウズは STEP1・2 をスキップ（確定仕様書 6.1 章）
  const nextStep = (from) => (state.isSkunked && from === 2 ? 3 : from + 1);
  const prevStep = (from) => (state.isSkunked && from === 3 ? 5 : from - 1);

  document.getElementById("next").addEventListener("click", () => {
    userMovedStep = true;
    if (state.step === 3 && !state.spotId) {
      return message("スポットを選択してください。", "error");
    }
    hideMessage();
    show(Math.min(5, state.isSkunked && state.step === 1 ? 3 : nextStep(state.step)));
  });
  document.getElementById("prev").addEventListener("click", () => {
    userMovedStep = true;
    hideMessage();
    show(Math.max(1, state.isSkunked && state.step === 3 ? 1 : state.step - 1));
  });
  document.getElementById("back").addEventListener("click", () => history.back());

  // 釣った直後に記録することが多いので、現在時刻をワンタップで入れられるようにする。
  // 既定では空にしておく（家に帰ってから入力したときに、間違った時刻が
  // 黙って入るほうが困る。潮位を引くための値なので、正しさを優先する）
  document.getElementById("time-now").addEventListener("click", () => {
    document.getElementById("fished-time").value = nowInJst().hhmm;
    saveDraft();
  });

  function setSkunked(on) {
    state.isSkunked = on;
    const base = recordId ? "EDIT CATCH" : "NEW CATCH";
    document.getElementById("mode-title").textContent = on ? `${base} — SKUNK` : base;
    document.getElementById("skunk-notice").hidden = !on;
  }

  document.getElementById("skunk-btn").addEventListener("click", () => {
    setSkunked(true);
    show(3);
    saveDraft();
  });

  // ボウズだと STEP1・2 が押せなくなるため、解除の導線を STEP3 に置く
  document.getElementById("unskunk").addEventListener("click", () => {
    setSkunked(false);
    show(1);
    saveDraft();
  });

  /* ---------- チップ選択 ---------- */
  function bindChips(containerId, onSelect, { toggle = false } = {}) {
    document.getElementById(containerId).addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const already = chip.classList.contains("selected");
      chip.parentElement.querySelectorAll(".chip").forEach((c) => c.classList.remove("selected"));
      if (!(toggle && already)) chip.classList.add("selected");
      onSelect(toggle && already ? null : chip.dataset.value);
      saveDraft();
    });
  }
  bindChips("layer-chips", (v) => { state.layer = v; }, { toggle: true });
  bindChips("visibility-chips", (v) => { state.visibility = v ?? "group"; });
  bindChips("water-chips", () => {});

  /* ---------- 出世魚の呼称提案（設計補完書 5 章） ---------- */
  const suggestBox = document.getElementById("name-suggest");
  let suggestSeq = 0;      // 古い応答で上書きしないための世代番号
  let lastSuggestKey = ""; // 同じ入力での再取得（blur 由来の change 等）を無視する

  async function updateSuggestion() {
    const option = document.getElementById("species").selectedOptions[0];
    const size = Number(document.getElementById("length").value);
    const key = option?.value && option.dataset.rule && size ? `${option.value}:${size}` : "";

    // 提案対象でなくなったら必ず消す（出世魚以外の魚種に切り替えた場合など）
    if (!key) { lastSuggestKey = ""; suggestBox.innerHTML = ""; return; }
    if (key === lastSuggestKey) return;  // 入力が変わっていないので表示を維持
    lastSuggestKey = key;

    const seq = ++suggestSeq;
    try {
      const result = await suggestFishName(option.value, size);
      if (seq !== suggestSeq || key !== lastSuggestKey) return;  // 古い応答は捨てる
      if (!result?.matched) { suggestBox.innerHTML = ""; return; }
      suggestBox.innerHTML = state.displayName === result.suggested_name
        ? `<div class="suggest">呼称: ${escapeHtml(result.suggested_name)}</div>`
        : `<div class="suggest">${escapeHtml(result.suggested_name)} として記録しますか？
             <button type="button" id="accept-name"
                     data-name="${escapeHtml(result.suggested_name)}">採用</button></div>`;
    } catch { /* 提案は失敗しても入力を妨げない */ }
  }

  // 再描画で要素が差し替わっても動くよう、コンテナ側で受ける
  suggestBox.addEventListener("click", (e) => {
    const button = e.target.closest("#accept-name");
    if (!button) return;
    state.displayName = button.dataset.name;
    suggestBox.innerHTML = `<div class="suggest">呼称: ${escapeHtml(state.displayName)}</div>`;
    saveDraft();
  });

  document.getElementById("length").addEventListener("change", updateSuggestion);
  document.getElementById("species").addEventListener("change", () => {
    state.displayName = null;
    lastSuggestKey = "";   // 魚種が変われば必ず取り直す
    updateSuggestion();
  });

  /* ---------- スポット ---------- */
  function renderSpots(list) {
    const box = document.getElementById("spot-list");
    if (!list.length) {
      box.innerHTML = `<div class="empty">登録済みスポットがありません。下から登録してください。</div>`;
      return;
    }
    const WATER = { saltwater: ["海水", "port"], brackish: ["汽水", "surf"], freshwater: ["淡水", "river"] };
    box.innerHTML = list.map((s) => {
      const [label, iconName] = WATER[s.water_type] ?? ["—", "map-pin"];
      return `
        <div class="list-item spot-option" data-id="${s.id}" role="button" tabindex="0">
          <div class="thumb">${icon(iconName, { size: 19 })}</div>
          <div class="list-body">
            <div class="list-title">${escapeHtml(s.name ?? "無名スポット")}</div>
            <div class="list-sub">${label}${s.low_tide_only ? ` · ${icon("warning", { size: 12 })} 干潮時のみ` : ""}</div>
          </div>
          <div class="list-aside select-mark"></div>
        </div>`;
    }).join("");
  }

  function selectSpot(item) {
    state.spotId = item.dataset.id;
    document.querySelectorAll(".spot-option").forEach((el) => {
      el.style.borderColor = "";
      el.querySelector(".select-mark").textContent = "";
    });
    item.style.borderColor = "var(--mustard)";
    item.querySelector(".select-mark").innerHTML = icon("check", { size: 16 });
  }

  document.getElementById("spot-list").addEventListener("click", (e) => {
    const item = e.target.closest(".spot-option");
    if (!item) return;
    selectSpot(item);
    saveDraft();
  });

  /* ---------- 新規スポットは地図でピンを立てて登録する ---------- */
  const draft = { lat: null, lng: null };
  let spotMap = null;
  let spotPin = null;

  // details を開いたときに初期化する（非表示のままだと Leaflet がサイズを測れない）
  document.getElementById("new-spot").addEventListener("toggle", (e) => {
    if (e.currentTarget.open) initSpotMap();
  });

  function initSpotMap() {
    if (spotMap) { setTimeout(() => spotMap.invalidateSize(), 50); return; }
    const base = spots[0];
    // スポットがなければ静岡県（浜名湖〜遠州灘）を初期表示する
    const created = createMap("spot-map",
      base ? { center: [base.latitude, base.longitude], zoom: 13 } : {});
    spotMap = created.map;
    // 登録済みスポットも表示して、同じ場所を重複登録しにくくする
    for (const s of spots) {
      L.marker([s.latitude, s.longitude], { icon: spotMarker(s, { label: false }) }).addTo(spotMap);
    }
    spotMap.on("click", (e) => placePin(e.latlng.lat, e.latlng.lng));
    setTimeout(() => spotMap.invalidateSize(), 50);
  }

  function placePin(lat, lng) {
    draft.lat = Number(Number(lat).toFixed(6));
    draft.lng = Number(Number(lng).toFixed(6));
    const pinIcon = spotMarker({ spot_type: null, name: null, low_tide_only: false }, { label: false });
    if (spotPin) spotPin.setLatLng([draft.lat, draft.lng]);
    else spotPin = L.marker([draft.lat, draft.lng], { icon: pinIcon }).addTo(spotMap);
    document.getElementById("spot-coords").textContent =
      `緯度 ${draft.lat} / 経度 ${draft.lng}`;
  }

  function clearPin() {
    draft.lat = null; draft.lng = null;
    if (spotPin) { spotPin.remove(); spotPin = null; }
    document.getElementById("spot-coords").textContent =
      "地図をタップすると、その場所にピンが立ちます。";
  }

  document.getElementById("use-gps").addEventListener("click", () => {
    if (!navigator.geolocation) return message("この端末では現在地を取得できません。", "error");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        initSpotMap();
        spotMap.setView([pos.coords.latitude, pos.coords.longitude], 16);
        placePin(pos.coords.latitude, pos.coords.longitude);
        message("現在地にピンを立てました。ずれていれば地図をタップして調整できます。", "success");
      },
      () => message("現在地を取得できませんでした。地図をタップして指定してください。", "error"),
    );
  });

  document.getElementById("save-spot").addEventListener("click", async (e) => {
    const name = document.getElementById("spot-name").value.trim();
    const waterType = document.querySelector("#water-chips .chip.selected")?.dataset.value ?? "saltwater";
    if (!name) return message("スポット名を入力してください。", "error");
    if (draft.lat == null) return message("地図をタップしてピンを立ててください。", "error");

    const button = e.currentTarget;
    button.disabled = true; button.textContent = "登録中…";
    let userId;
    try { userId = await requireUserId(); }
    catch (sessionError) {
      button.disabled = false; button.textContent = "スポットを登録";
      return message(sessionError.message, "error");
    }
    const { data, error } = await client.from("spots")
      .insert({
        user_id: userId, name,
        latitude: draft.lat, longitude: draft.lng, water_type: waterType,
      })
      .select().single();
    button.disabled = false; button.textContent = "スポットを登録";
    if (error) return message(toJapaneseError(error), "error");

    const updated = await listSpots();
    renderSpots(updated);
    state.spotId = data.id;
    document.querySelector(`.spot-option[data-id="${data.id}"]`)?.click();
    document.getElementById("spot-name").value = "";
    clearPin();
    // 登録済みとして地図に残す（次に開いたときも見える）
    L.marker([data.latitude, data.longitude], { icon: spotMarker(data, { label: false }) }).addTo(spotMap);
    document.getElementById("new-spot").open = false;
    message("スポットを登録しました。", "success");
  });

  /* ---------- 写真 ----------
     追加・削除は「保存したときにまとめて反映」する。
     新規登録では釣果 ID がまだ無いので、どのみち保存後にしか上げられない。
     編集でも同じ扱いにして、経路を 1 本にしている。 */
  const photos = {
    existing: [],   // 台帳にある写真（編集時）
    added: [],      // これから上げるファイル
    removed: [],    // 保存時に消す既存の写真
  };

  function photoCount() {
    return photos.existing.length + photos.added.length;
  }

  async function renderPhotos() {
    const box = document.getElementById("photo-list");
    const urls = await signedPhotoUrls(photos.existing.map((p) => p.thumb_path)).catch(() => new Map());

    box.innerHTML = [
      ...photos.existing.map((p) => `
        <div class="photo-item" data-kind="existing" data-id="${p.id}">
          <img src="${urls.get(p.thumb_path) ?? ""}" alt="">
          <button type="button" class="photo-remove" aria-label="削除">×</button>
        </div>`),
      ...photos.added.map((p, i) => `
        <div class="photo-item" data-kind="added" data-index="${i}">
          <img src="${p.url}" alt="">
          <button type="button" class="photo-remove" aria-label="削除">×</button>
        </div>`),
    ].join("");

    const note = document.getElementById("photo-note");
    const left = PHOTO_MAX_COUNT - photoCount();
    note.textContent = photoCount()
      ? `${photoCount()} 枚（あと ${left} 枚追加できます）${
          photos.added.length ? " ／ 記録すると保存されます" : ""}`
      : "";
    document.getElementById("photo-input").disabled = left <= 0;
  }

  document.getElementById("photo-input").addEventListener("change", (e) => {
    const files = [...e.target.files];
    e.target.value = "";                      // 同じ写真を選び直せるように
    const left = PHOTO_MAX_COUNT - photoCount();
    if (files.length > left) {
      message(`写真は ${PHOTO_MAX_COUNT} 枚までです。`, "error");
    }
    for (const file of files.slice(0, Math.max(0, left))) {
      if (!file.type.startsWith("image/")) continue;
      photos.added.push({ file, url: URL.createObjectURL(file) });
    }
    renderPhotos();
  });

  document.getElementById("photo-list").addEventListener("click", (e) => {
    const button = e.target.closest(".photo-remove");
    if (!button) return;
    const item = button.closest(".photo-item");
    if (item.dataset.kind === "added") {
      const [removed] = photos.added.splice(Number(item.dataset.index), 1);
      URL.revokeObjectURL(removed.url);
    } else {
      const index = photos.existing.findIndex((p) => p.id === item.dataset.id);
      if (index >= 0) photos.removed.push(...photos.existing.splice(index, 1));
    }
    renderPhotos();
  });

  /** 保存後に写真の追加・削除を反映する。失敗しても釣果自体は残す。 */
  async function applyPhotos(targetRecordId) {
    if (photos.removed.length) {
      await deleteRecordPhotos(photos.removed);
      photos.removed = [];
    }
    for (const [index, item] of photos.added.entries()) {
      await uploadRecordPhoto(targetRecordId, item.file, photos.existing.length + index);
      URL.revokeObjectURL(item.url);
    }
    photos.added = [];
  }

  /* ---------- 確認と保存 ---------- */
  // 「2026-08-08 05:30」の形。時刻を入れていなければ日付だけ
  function fishedAtLabel() {
    const date = document.getElementById("fished-at").value;
    const time = document.getElementById("fished-time").value;
    return time ? `${date} ${time}` : date;
  }

  function renderSummary() {
    const spot = document.querySelector(`.spot-option[data-id="${state.spotId}"] .list-title`)?.textContent;
    const speciesName = document.getElementById("species").selectedOptions[0]?.textContent;
    const rows = state.isSkunked
      ? [["記録", "ボウズ"], ["釣行日", fishedAtLabel()], ["スポット", spot]]
      : [
          ["魚種", state.displayName ?? (speciesName === "選択しない" ? "—" : speciesName)],
          ["サイズ", document.getElementById("length").value ? `${document.getElementById("length").value} cm` : "—"],
          ["匹数", document.getElementById("count").value],
          ["釣行日", fishedAtLabel()],
          ["スポット", spot],
          ["レンジ", state.layer ?? "—"],
        ];
    document.getElementById("summary").innerHTML = rows
      .map(([k, v]) => `<div class="row"><span class="label">${k}</span><span class="val">${escapeHtml(v ?? "—")}</span></div>`)
      .join("");
  }

  document.getElementById("submit").addEventListener("click", async (e) => {
    const button = e.currentTarget;
    button.disabled = true; button.textContent = "記録中…";
    const num = (id) => {
      const v = Number(document.getElementById(id).value);
      return Number.isFinite(v) && document.getElementById(id).value !== "" ? v : null;
    };
    const text = (id) => document.getElementById(id).value.trim() || null;

    // DB 側でも弾かれるが、どこを直せばよいか分かる形で先に伝える
    if (!state.isSkunked && (num("count") ?? 1) < 1) {
      button.disabled = false;
      button.textContent = recordId ? "変更を保存する" : "この内容で記録する";
      message("匹数は 1 以上で入力してください。ボウズは STEP1 の「ボウズで記録」から登録できます。", "error");
      show(1);
      return;
    }

    let userId;
    try { userId = await requireUserId(); }
    catch (sessionError) {
      button.disabled = false; button.textContent = "この内容で記録する";
      return message(sessionError.message, "error");
    }

    const payload = {
      user_id: userId,
      spot_id: state.spotId,
      fished_at: document.getElementById("fished-at").value,
      fished_time: document.getElementById("fished-time").value || null,
      is_skunked: state.isSkunked,
      memo: text("memo"),
      visibility: state.visibility,
    };
    // ボウズは STEP1・2 を飛ばすため、編集で切り替えたときに古い値が残らないよう明示的に消す
    Object.assign(payload, state.isSkunked ? {
      fish_species_id: null, fish_name_local: null, length_cm: null, weight_g: null,
      quantity_note: null, recipe_id: null, water_layer: null,
      rod: null, reel: null, line: null, leader: null,
    } : {
      fish_species_id: document.getElementById("species").value || null,
      fish_name_local: state.displayName ?? null,
      length_cm: num("length"),
      weight_g: num("weight"),
      catch_count: num("count") ?? 1,
      quantity_note: text("quantity-note"),
      recipe_id: document.getElementById("recipe").value || null,
      water_layer: state.layer,
      rod: text("rod"), reel: text("reel"), line: text("line"), leader: text("leader"),
    });

    const { data: saved, error } = recordId
      ? await client.from("fishing_records").update(payload).eq("id", recordId).select().single()
      : await client.from("fishing_records").insert(payload).select().single();
    if (error) {
      message(toJapaneseError(error), "error");
      button.disabled = false;
      button.textContent = recordId ? "変更を保存する" : "この内容で記録する";
      return;
    }

    // 写真は釣果が保存できてから。ここで失敗しても釣果は残っているので、
    // 記録そのものを巻き戻さず、写真だけ後から付け直してもらう
    if (photos.added.length || photos.removed.length) {
      button.textContent = "写真を保存中…";
      try {
        await applyPhotos(saved.id);
      } catch (photoError) {
        clearDraft();
        location.replace(`record.html?id=${saved.id}&photoerror=1`);
        return;
      }
    }

    clearDraft();
    location.replace(recordId ? `record.html?id=${recordId}&saved=1` : "records.html?saved=1");
  });

  /* ---------- 入力途中の内容を残す ----------
     画面を離れても消えないよう、変更のたびに端末内へ保存する。
     編集中（?id= あり）は元データが正なので下書きは使わない。 */
  function collectDraft() {
    const value = (id) => document.getElementById(id).value;
    return {
      step: state.step, isSkunked: state.isSkunked, spotId: state.spotId,
      layer: state.layer, visibility: state.visibility, displayName: state.displayName ?? null,
      species: value("species"), length: value("length"), weight: value("weight"),
      count: value("count"), quantityNote: value("quantity-note"),
      recipe: value("recipe"), rod: value("rod"), reel: value("reel"),
      line: value("line"), leader: value("leader"),
      fishedAt: value("fished-at"), fishedTime: value("fished-time"), memo: value("memo"),
    };
  }

  // 釣行日は初期値が入るので、それ以外に入力があるときだけ「入力途中」とみなす
  function hasInput(d) {
    return Boolean(d.isSkunked || d.spotId || d.layer || d.displayName || d.memo
      || d.species || d.length || d.weight || d.quantityNote
      || d.recipe || d.rod || d.reel || d.line || d.leader || d.fishedTime);
  }

  function saveDraft() {
    if (recordId) return;
    const data = collectDraft();
    try {
      if (hasInput(data)) localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
      else localStorage.removeItem(DRAFT_KEY);
    } catch { /* 容量超過は無視 */ }
  }

  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch { /* 無視 */ }
  }

  /** 下書き・既存レコードの値を画面に流し込む。 */
  function applyValues(data) {
    const set = (id, v) => { if (v != null) document.getElementById(id).value = v; };
    set("species", data.species); set("length", data.length); set("weight", data.weight);
    set("count", data.count); set("quantity-note", data.quantityNote);
    set("recipe", data.recipe); set("rod", data.rod); set("reel", data.reel);
    set("line", data.line); set("leader", data.leader);
    set("fished-at", data.fishedAt); set("fished-time", data.fishedTime);
    set("memo", data.memo);

    setSkunked(Boolean(data.isSkunked));
    state.spotId = data.spotId ?? null;
    state.layer = data.layer ?? null;
    state.visibility = data.visibility ?? "group";
    state.displayName = data.displayName ?? null;

    markChip("layer-chips", state.layer);
    markChip("visibility-chips", state.visibility);
    if (state.spotId) {
      const item = document.querySelector(`.spot-option[data-id="${state.spotId}"]`);
      if (item) selectSpot(item);
    }
  }

  function markChip(containerId, value) {
    document.querySelectorAll(`#${containerId} .chip`).forEach((chip) => {
      chip.classList.toggle("selected", chip.dataset.value === value);
    });
  }

  /** 既存レコードを下書きと同じ形にそろえる。 */
  function draftFromRecord(r) {
    return {
      step: 1, isSkunked: r.is_skunked, spotId: r.spot_id,
      layer: r.water_layer, visibility: r.visibility, displayName: r.fish_name_local,
      species: r.fish_species_id ?? "", length: r.length_cm ?? "", weight: r.weight_g ?? "",
      // ボウズは catch_count = 0 で保存されるが、解除したときの初期値は 1 が自然
      count: r.is_skunked ? 1 : r.catch_count ?? 1, quantityNote: r.quantity_note ?? "",
      recipe: r.recipe_id ?? "", rod: r.rod ?? "", reel: r.reel ?? "",
      line: r.line ?? "", leader: r.leader ?? "",
      fishedAt: r.fished_at, fishedTime: (r.fished_time ?? "").slice(0, 5), memo: r.memo ?? "",
    };
  }

  async function restore() {
    if (recordId) {
      const { data, error } = await client.from("fishing_records")
        .select("*").eq("id", recordId).maybeSingle();
      if (error) return message(toJapaneseError(error), "error");
      if (!data) return message("記録が見つかりません。", "error");
      applyValues(draftFromRecord(data));
      if (state.displayName) {
        suggestBox.innerHTML = `<div class="suggest">呼称: ${escapeHtml(state.displayName)}</div>`;
      }
      // 開くステップは取得済みのレコードだけで決まる。写真の読み込みを待つと、
      // ボウズの編集で STEP1 が一瞬見えてから STEP3 へ飛ぶ形になる
      if (!userMovedStep) show(openStep(1));
      photos.existing = await listRecordPhotos(recordId).catch(() => []);
      renderPhotos();
      return;
    }
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(DRAFT_KEY) ?? "null"); } catch { /* 壊れた下書きは捨てる */ }
    if (!saved || !hasInput(saved)) return;
    applyValues(saved);
    document.getElementById("draft-notice").hidden = false;
    if (!userMovedStep) show(openStep(Math.min(5, Math.max(1, Number(saved.step) || 1))));
  }

  // ボウズは STEP1・2 が無効なので、そこへは開かない
  const openStep = (step) => (state.isSkunked && step < 3 ? 3 : step);

  // 入力のたびに保存する（チップ・スポット選択は各ハンドラから呼ぶ）
  document.querySelector("main").addEventListener("input", saveDraft);
  document.querySelector("main").addEventListener("change", saveDraft);

  document.getElementById("draft-discard").addEventListener("click", () => {
    clearDraft();
    location.replace("record-new.html");
  });

  await restore();

  function message(text, kind) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
    window.scrollTo(0, 0);
  }
  function hideMessage() { document.getElementById("message").hidden = true; }
</script>
</body>
