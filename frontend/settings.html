<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SETTINGS | TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-014 設定（まずはアカウント周りのみ。他項目は順次追加） -->
<header class="page-head">
  <button type="button" class="back" id="back" aria-label="戻る">←</button>
  <div class="page-title">SETTINGS</div>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>

  <!-- お知らせ（D-074）。ホームのヘッダーからも開けるが、
       「あの機能どこで見たっけ」と探すときにここを見る人もいる -->
  <a class="list-item" href="news.html">
    <div class="list-body">
      <div class="list-title">お知らせ</div>
      <div class="list-sub">追加した機能と直した不具合の一覧</div>
    </div>
    <div class="list-aside">→</div>
  </a>

  <!-- プロフィール -->
  <div class="section-label"><span>PROFILE</span></div>
  <div class="card">
    <div class="field">
      <label for="username">表示名</label>
      <input type="text" id="username" maxlength="20" placeholder="未設定">
    </div>
    <div class="rows" style="margin-bottom:12px">
      <div class="row"><span class="label">メールアドレス</span>
        <span class="val" id="email">—</span></div>
    </div>
    <button type="button" class="btn btn-quiet" id="save-profile">
      <span data-icon="save"></span>表示名を保存
    </button>
  </div>

  <!-- グループ（招待制の共有） -->
  <div class="section-label"><span>GROUP</span></div>
  <div class="card" id="group-card">
    <div class="empty">読み込み中…</div>
  </div>

  <!-- アカウント -->
  <div class="section-label"><span>ACCOUNT</span></div>
  <div class="card">
    <h2><span data-icon="key"></span> パスワード変更</h2>
    <div class="field">
      <label for="current-password">現在のパスワード</label>
      <input type="password" id="current-password" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="new-password">新しいパスワード</label>
      <input type="password" id="new-password" autocomplete="new-password">
      <div class="hint">8 文字以上</div>
    </div>
    <div class="field">
      <label for="confirm-password">新しいパスワード（確認）</label>
      <input type="password" id="confirm-password" autocomplete="new-password">
    </div>
    <button type="button" class="btn" id="change-password">パスワードを変更する</button>
  </div>

  <div class="card">
    <button type="button" class="btn btn-quiet" id="signout">
      <span data-icon="back"></span>ログアウト
    </button>
  </div>

  <div class="page-sub" style="text-align:center;margin-top:18px">TIDEBASE</div>
</main>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, toJapaneseError, requireUserId, currentUserId,
    escapeHtml, icon, renderIcons, formatJstDate,
    myGroup, listGroupMembers, createGroup, listInvites, createInvite,
    revokeInvite, leaveGroup, inviteUrl, isAppAdmin, GROUP_MEMBER_LIMIT,
  } from "./assets/app.js";

  const MIN_PASSWORD_LENGTH = 8;   // Supabase 側の password_min_length と揃える

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("settings");
  document.getElementById("back").addEventListener("click", () => history.back());

  /* ---------- プロフィール ---------- */
  document.getElementById("email").textContent = session.user?.email ?? "—";

  document.getElementById("save-profile").addEventListener("click", async (e) => {
    const button = e.currentTarget;
    const username = document.getElementById("username").value.trim() || null;
    button.disabled = true;
    try {
      const { error } = await client.from("profiles")
        .update({ username }).eq("id", await requireUserId());
      if (error) throw error;
      message("表示名を保存しました。", "success");
    } catch (error) {
      message(toJapaneseError(error), "error");
    } finally {
      button.disabled = false;
    }
  });

  /* ---------- パスワード変更 ---------- */
  document.getElementById("change-password").addEventListener("click", async (e) => {
    const current = document.getElementById("current-password").value;
    const next = document.getElementById("new-password").value;
    const confirm = document.getElementById("confirm-password").value;

    if (!current || !next) return message("現在のパスワードと新しいパスワードを入力してください。", "error");
    if (next.length < MIN_PASSWORD_LENGTH) {
      return message(`新しいパスワードは ${MIN_PASSWORD_LENGTH} 文字以上にしてください。`, "error");
    }
    if (next !== confirm) return message("新しいパスワードが一致しません。", "error");
    if (next === current) return message("現在と同じパスワードです。", "error");

    const button = e.currentTarget;
    button.disabled = true; button.textContent = "変更中…";
    try {
      // Supabase 側は再認証なしでも変更できる設定だが、端末を放置したまま
      // 第三者に変更されると締め出されるため、現在のパスワードを必ず確認する
      const email = session.user?.email;
      if (!email) throw new Error("メールアドレスを確認できませんでした。再度ログインしてください。");
      const { error: signInError } =
        await client.auth.signInWithPassword({ email, password: current });
      if (signInError) {
        message(/Invalid login credentials/i.test(signInError.message)
          ? "現在のパスワードが違います。" : toJapaneseError(signInError), "error");
        return;
      }

      const { error } = await client.auth.updateUser({ password: next });
      if (error) throw error;

      document.querySelectorAll("#current-password, #new-password, #confirm-password")
        .forEach((input) => { input.value = ""; });
      message("パスワードを変更しました。次回のログインから新しいパスワードを使ってください。", "success");
    } catch (error) {
      message(toJapaneseError(error), "error");
    } finally {
      button.disabled = false; button.textContent = "パスワードを変更する";
    }
  });

  /* ---------- ログアウト ---------- */
  document.getElementById("signout").addEventListener("click", async () => {
    await client.auth.signOut();
    location.replace("login.html");
  });

  function message(text, kind) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
    window.scrollTo(0, 0);
  }

  /* ---------- グループ ----------
     招待した人だけが登録できる仕組み（010 / Edge Function invite）。
     リンクを LINE などで送り、受け取った人が signup.html?invite=... を開く。 */
  const groupCard = document.getElementById("group-card");

  // 管理者でない人にはグループを作る導線を出さない（作っても RLS で弾かれる）
  function renderNotAdmin() {
    groupCard.innerHTML = `
      <div class="empty">
        グループに参加していません。<br>
        参加するには管理者から招待リンクを送ってもらってください。
      </div>`;
  }

  function renderNoGroup() {
    groupCard.innerHTML = `
      <div class="list-sub" style="margin-bottom:12px">
        グループを作ると、招待した人だけがアカウントを登録でき、
        公開範囲が「グループ」の釣果をお互いに見られるようになります。
      </div>
      <div class="field">
        <label for="group-name">グループ名</label>
        <input type="text" id="group-name" maxlength="40" value="釣り仲間">
      </div>
      <button type="button" class="btn" id="make-group">グループを作る</button>`;
    document.getElementById("make-group").addEventListener("click", async (e) => {
      const name = document.getElementById("group-name").value.trim();
      if (!name) return message("グループ名を入力してください。", "error");
      const button = e.currentTarget;
      button.disabled = true; button.textContent = "作成中…";
      try {
        await createGroup(name);
        await loadGroup();
        message("グループを作りました。招待リンクを作って共有してください。", "success");
      } catch (error) {
        button.disabled = false; button.textContent = "グループを作る";
        message(toJapaneseError(error), "error");
      }
    });
  }

  function renderGroup(group, members, invites, canInvite) {
    // 人数上限までの残り。未使用の招待も「席を押さえている」ものとして数える
    // （3 人ぶん作ってから「あと 5 人」と出ると、二重に招待してしまう）
    const pendingInvites = invites.filter((inv) => !inv.used_at).length;
    const remaining = Math.max(0, GROUP_MEMBER_LIMIT - members.length - pendingInvites);
    groupCard.innerHTML = `
      <h2><span data-icon="groups"></span> ${escapeHtml(group.name)}</h2>
      <div id="member-list">
        ${members.map((m) => `
          <div class="list-item">
            <div class="thumb">${icon("user", { size: 18 })}</div>
            <div class="list-body">
              <div class="list-title">${escapeHtml(m.name)}${m.is_me ? "（自分）" : ""}</div>
              <div class="list-sub">${m.role === "owner" ? "オーナー" : "メンバー"}</div>
            </div>
          </div>`).join("")}
      </div>
      <div class="list-sub" style="margin:12px 0">
        公開範囲が「グループ」の釣果は、ここにいる人に共有されます
        （スポット名と場所を含みます）。見せたくない釣果は「自分のみ」にしてください。
      </div>

      ${canInvite ? `
        <div class="field" style="margin-top:16px">
          <label for="invite-label">招待する人（メモ・任意）</label>
          <input type="text" id="invite-label" maxlength="20" placeholder="例: たろう">
        </div>
        <div class="field">
          <label for="invite-count">何人ぶん作るか</label>
          <select id="invite-count">
            ${Array.from({ length: Math.max(1, remaining) }, (_, i) => `
              <option value="${i + 1}">${i + 1} 人ぶん</option>`).join("")}
          </select>
          <!-- 使い切り仕様を画面に書いておく。書いていなかったせいで、
               1 本を 3 人に回して 2 人目が弾かれた（D-059） -->
          <div class="hint">
            リンク 1 本で登録できるのは 1 人だけです。何人か招待するときは人数ぶん作って、
            それぞれ別の人に送ってください。あと ${remaining} 人まで参加できます。
          </div>
        </div>
        <button type="button" class="btn" id="make-invite">招待リンクを作る</button>
        <div id="invite-list" style="margin-top:14px">
          ${invites.length ? `
            <div class="list-sub" style="margin-bottom:6px">招待リンク</div>
            ${invites.map((inv) => inv.used_at ? `
              <div class="card invite-used" style="background:var(--bg-deep);margin-bottom:8px">
                <div class="list-title">${escapeHtml(inv.label ?? "（メモなし）")}</div>
                <div class="list-sub">${formatJstDate(inv.used_at.slice(0, 10))} に使用済み</div>
              </div>` : `
              <div class="card" style="background:var(--bg-deep);margin-bottom:8px" data-token="${inv.token}">
                <div class="list-title">${escapeHtml(inv.label ?? "（メモなし）")}</div>
                <div class="list-sub">未使用 · ${formatJstDate(inv.expires_at.slice(0, 10))} まで有効</div>
                <input type="text" class="invite-url" readonly value="${escapeHtml(inviteUrl(inv.token))}"
                       style="width:100%;margin-top:8px;font-size:12px">
                <div class="actions" style="margin-top:8px">
                  <button type="button" class="btn btn-quiet copy-invite">リンクをコピー</button>
                  <button type="button" class="btn btn-quiet revoke-invite">取り消す</button>
                </div>
              </div>`).join("")}` : ""}
        </div>` : `
        <button type="button" class="btn btn-quiet" id="leave-group">グループを抜ける</button>`}`;
    renderIcons(groupCard);
  }

  async function loadGroup() {
    const [group, admin, userId] = await Promise.all([
      myGroup().catch(() => null),
      isAppAdmin(),
      currentUserId(),
    ]);
    if (!group) return admin ? renderNoGroup() : renderNotAdmin();

    // 招待できるのは「管理者 かつ そのグループのオーナー」だけ（012 の RLS と同条件）
    const canInvite = admin && group.owner_id === userId;
    const [members, invites] = await Promise.all([
      listGroupMembers(group.id).catch(() => []),
      canInvite ? listInvites(group.id).catch(() => []) : Promise.resolve([]),
    ]);
    renderGroup(group, members, invites, canInvite);
  }

  // 再描画で要素が差し替わるため、カード側でクリックを受ける
  groupCard.addEventListener("click", async (e) => {
    const make = e.target.closest("#make-invite");
    if (make) {
      const group = await myGroup();
      make.disabled = true; make.textContent = "作成中…";
      try {
        await createInvite(group.id,
          document.getElementById("invite-label").value.trim(),
          Number(document.getElementById("invite-count").value) || 1);
        const count = Number(document.getElementById("invite-count").value) || 1;
        await loadGroup();
        message(count > 1
          ? `招待リンクを ${count} 本作りました。1 本につき 1 人なので、別の人に 1 本ずつ送ってください。`
          : "招待リンクを作りました。LINE などで本人にだけ送ってください。", "success");
      } catch (error) {
        make.disabled = false; make.textContent = "招待リンクを作る";
        message(toJapaneseError(error), "error");
      }
      return;
    }

    const copy = e.target.closest(".copy-invite");
    if (copy) {
      const input = copy.closest("[data-token]").querySelector(".invite-url");
      try {
        await navigator.clipboard.writeText(input.value);
        copy.textContent = "コピーしました";
        setTimeout(() => { copy.textContent = "リンクをコピー"; }, 2000);
      } catch {
        // クリップボードが使えない環境では選択状態にして手動コピーへ誘導する
        input.select();
        message("リンクを選択しました。長押しなどでコピーしてください。", "success");
      }
      return;
    }

    const revoke = e.target.closest(".revoke-invite");
    if (revoke) {
      if (!confirm("この招待リンクを取り消しますか？\n送信済みのリンクは使えなくなります。")) return;
      try {
        await revokeInvite(revoke.closest("[data-token]").dataset.token);
        await loadGroup();
        message("招待リンクを取り消しました。", "success");
      } catch (error) {
        message(toJapaneseError(error), "error");
      }
      return;
    }

    const leave = e.target.closest("#leave-group");
    if (leave) {
      if (!confirm("グループを抜けますか？\nお互いの釣果が見えなくなります。")) return;
      try {
        const group = await myGroup();
        await leaveGroup(group.id);
        await loadGroup();
        message("グループを抜けました。", "success");
      } catch (error) {
        message(toJapaneseError(error), "error");
      }
    }
  });

  /* ---------- 初期化 ---------- */
  const userId = await currentUserId();
  if (userId) {
    const { data } = await client.from("profiles")
      .select("username").eq("id", userId).maybeSingle();
    if (data?.username) document.getElementById("username").value = data.username;
  }
  await loadGroup();
</script>
</body>
</html>
