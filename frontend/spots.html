<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPOT MAP | TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-004 スポットマップ -->
<header class="app-header">
  <h1>SPOT MAP</h1>
  <span class="page-sub" id="count">—</span>
</header>

<!-- 地名でスポットの位置を探す（D-069）。地図の外に置く：
     地図に重ねると、候補を選ぼうとした指が地図のタップになって暴発する -->
<div id="place-search" style="padding:10px 16px 0; max-width:640px; margin:0 auto"></div>

<div class="map-wrap">
  <div id="map"></div>
  <div class="map-tools">
    <button type="button" id="layer-toggle"><span data-icon="satellite"></span>航空写真</button>
    <button type="button" id="night"><span data-icon="night"></span>夜間</button>
    <button type="button" id="locate"><span data-icon="locate"></span>現在地</button>
    <button type="button" id="add-mode"><span data-icon="plus"></span>追加</button>
  </div>
</div>

<main style="padding-top:12px">
  <div id="message" class="message" hidden role="alert"></div>
  <div class="legend" id="legend"></div>
  <div class="section-label"><span>SPOT LIST</span></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<!-- スポット概要（ピンタップ時） -->
<section class="sheet" id="sheet" hidden>
  <button type="button" class="back close" id="sheet-close" aria-label="閉じる" data-icon="close"></button>
  <div id="sheet-body"></div>
</section>

<!-- 新規登録（地図タップ後） -->
<section class="sheet" id="new-sheet" hidden>
  <button type="button" class="back close" id="new-close" aria-label="閉じる" data-icon="close"></button>
  <div class="page-sub" style="margin-bottom:10px">新しいスポット</div>
  <div class="field">
    <label for="new-name">スポット名</label>
    <input type="text" id="new-name" maxlength="100" placeholder="例: ○○港 北堤防">
  </div>
  <div class="field">
    <label>水域区分</label>
    <div class="chips" id="new-water"></div>
  </div>
  <div class="field">
    <label>スポット種別</label>
    <div class="chips" id="new-type"></div>
  </div>
  <div class="field toggle-row">
    <label for="new-lowtide" style="margin:0">干潮時のみアクセス可</label>
    <input type="checkbox" id="new-lowtide" style="width:auto">
  </div>
  <div class="page-sub" id="new-coords"></div>
  <div class="actions">
    <button type="button" class="btn" id="new-save">このスポットを登録</button>
  </div>
</section>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml, toJapaneseError, requireUserId,
    listSpots, createMap, spotMarker, spotType, waterLabel,
    SPOT_TYPES, WATER_TYPES, googleMapsUrl, googleDirectionsUrl, isNightMap, setNightMap, icon,
    isCoordinateInJapan,
    attachPlaceSearch,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("map");

  const state = { addMode: false, draft: null, water: "saltwater", type: null };
  let spots = await listSpots().catch(() => []);

  // 位置が未設定のスポット（旧フォームで 0,0 になったもの）は地図に載せない
  const positioned = () => spots.filter((s) => isCoordinateInJapan(s.latitude, s.longitude));
  const first = positioned()[0];
  const { map, layers } = createMap("map", first
    ? { center: [first.latitude, first.longitude], zoom: 13 }
    : {});   // 位置つきスポットがなければ静岡県（浜名湖〜遠州灘）を初期表示
  let markerLayer = L.layerGroup().addTo(map);
  let draftMarker = null;

  renderChips();
  renderAll();

  /* ---------- 表示 ---------- */
  function renderLegend() {
    // 実際に地図に出ている種別だけを出す。12 種を常に並べると凡例が 3 行になり、
    // 下のリストが画面外へ押し出されるうえ、凡例としても読み取りにくい
    const used = new Set(spots.map((s) => s.spot_type));
    document.getElementById("legend").innerHTML = SPOT_TYPES
      .filter((t) => used.has(t.value))
      .map((t) => `<span><i style="background:${t.color}"></i>${t.label}</span>`).join("")
      + (used.has(null) || used.has(undefined)
        ? `<span><i style="background:#9AA5B1"></i>未設定</span>` : "");
  }

  function renderAll() {
    renderLegend();   // スポットを足すと種別が増えるので、毎回引き直す
    const onMap = positioned();
    const missing = spots.length - onMap.length;
    document.getElementById("count").textContent =
      `${spots.length} スポット${missing ? `（位置未設定 ${missing}）` : ""}`;
    markerLayer.clearLayers();
    // ズームが低いときはラベルを間引く（確定仕様書 15.2 章）
    const showLabels = map.getZoom() >= 12;
    for (const spot of onMap) {
      L.marker([spot.latitude, spot.longitude], { icon: spotMarker(spot, { label: showLabels }) })
        .addTo(markerLayer)
        .on("click", () => openSheet(spot));
    }
    if (onMap.length) {
      const bounds = L.latLngBounds(onMap.map((s) => [s.latitude, s.longitude]));
      if (!map._fitted) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 }); map._fitted = true; }
    }
    renderList();
  }

  map.on("zoomend", () => renderAll());

  function renderList() {
    const box = document.getElementById("list");
    if (!spots.length) {
      box.innerHTML = `<div class="empty">スポットがまだありません。
        上の欄で地名を探すか、「＋ 追加」を押して地図をタップすると登録できます。</div>`;
      return;
    }
    box.innerHTML = spots.map((s) => {
      const type = spotType(s.spot_type);
      return `
        <a class="list-item" href="spot.html?id=${s.id}">
          <div class="thumb" style="background:${type.color}22;color:${type.color}">${icon(type.iconName, { size: 19 })}</div>
          <div class="list-body">
            <div class="list-title">${escapeHtml(s.name ?? "無名スポット")}${s.low_tide_only ? ` ${icon("warning", { size: 13 })}` : ""}</div>
            <div class="list-sub">${type.label} · ${waterLabel(s.water_type)}${
              s.tide_station_code ? ` · 潮汐 ${s.tide_station_code}` : ""}${
              isCoordinateInJapan(s.latitude, s.longitude)
                ? "" : ` · ${icon("warning", { size: 12 })} 位置未設定`}</div>
          </div>
          <div class="list-aside">→</div>
        </a>`;
    }).join("");
  }

  /* ---------- ピンタップ ---------- */
  function openSheet(spot) {
    const type = spotType(spot.spot_type);
    document.getElementById("sheet-body").innerHTML = `
      <div class="list-title" style="font-size:16px">${escapeHtml(spot.name ?? "無名スポット")}</div>
      <div class="list-sub" style="margin-bottom:10px">
        ${type.label} · ${waterLabel(spot.water_type)}${spot.low_tide_only ? ` · ${icon("warning", { size: 12 })} 干潮時のみアクセス可` : ""}
      </div>
      <div class="actions" style="margin-top:0">
        <a class="btn btn-quiet link-btn" href="spot.html?id=${spot.id}">詳細</a>
        <a class="btn btn-quiet link-btn" href="${googleMapsUrl(spot)}" target="_blank" rel="noopener">${icon("map", { size: 15 })} Google マップ</a>
        <a class="btn link-btn" href="${googleDirectionsUrl(spot)}" target="_blank" rel="noopener">${icon("navigation", { size: 15 })} 経路案内</a>
      </div>`;
    document.getElementById("sheet").hidden = false;
    document.getElementById("new-sheet").hidden = true;
  }
  document.getElementById("sheet-close").addEventListener("click", () => {
    document.getElementById("sheet").hidden = true;
  });

  /* ---------- レイヤー・現在地 ---------- */
  document.getElementById("layer-toggle").addEventListener("click", (e) => {
    const toPhoto = !e.currentTarget.classList.contains("on");
    map.removeLayer(toPhoto ? layers.pale : layers.photo);
    (toPhoto ? layers.photo : layers.pale).addTo(map);
    e.currentTarget.classList.toggle("on", toPhoto);
    e.currentTarget.innerHTML = icon(toPhoto ? "map" : "satellite", { size: 14 })
      + (toPhoto ? "標準地図" : "航空写真");
  });

  // 夜間モード（暗い場所でまぶしくないように地図を落とす）。端末内にのみ保存
  const nightButton = document.getElementById("night");
  nightButton.classList.toggle("on", isNightMap());
  nightButton.addEventListener("click", () => {
    const on = !isNightMap();
    setNightMap(on);
    nightButton.classList.toggle("on", on);
  });

  document.getElementById("locate").addEventListener("click", () => {
    if (!navigator.geolocation) return message("この端末では現在地を取得できません。", "error");
    navigator.geolocation.getCurrentPosition(
      (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 15),
      () => message("現在地を取得できませんでした。", "error"),
    );
  });

  /* ---------- 地名で位置を探す（D-069） ----------
     探して地図が飛ぶだけでは、結局そこから指でピンを立て直すことになる。
     見つかった時点でピンを置き、名前も入れて、登録の一歩手前まで進めておく。
     ずれていれば地図をタップして置き直せる（＝追加モードのまま渡す）。 */
  attachPlaceSearch(document.getElementById("place-search"), (hit) => {
    map.setView([hit.lat, hit.lng], 16);
    setAddMode(true);
    placeDraft(hit.lat, hit.lng);
    const nameInput = document.getElementById("new-name");
    // 入力済みの名前を検索語で上書きしない。地名は「舘山寺町」のような住所のこともあり、
    // スポット名として使えるとは限らない
    if (!nameInput.value.trim() && hit.name) nameInput.value = hit.name;
  });

  /* ---------- 新規登録（地図タップ） ---------- */
  function setAddMode(on) {
    state.addMode = on;
    const button = document.getElementById("add-mode");
    button.classList.toggle("on", on);
    button.innerHTML = icon(on ? "close" : "plus", { size: 14 }) + (on ? "やめる" : "追加");
  }

  function placeDraft(lat, lng) {
    state.draft = { lat, lng };
    if (draftMarker) draftMarker.remove();
    draftMarker = L.marker([lat, lng], {
      icon: spotMarker({ spot_type: null, name: "新規", low_tide_only: false }),
    }).addTo(map);
    document.getElementById("new-coords").textContent =
      `緯度 ${lat.toFixed(6)} / 経度 ${lng.toFixed(6)}`;
    document.getElementById("new-sheet").hidden = false;
    document.getElementById("sheet").hidden = true;
    keepPinVisible(lat, lng);
  }

  /* 立てたピンが登録シートの裏に隠れないよう、地図をずらす（D-069）。
     地名で探したときは「その場所で合っているか」を目で確かめたいのに、
     シートが下半分を覆っていると、肝心のピンが見えない。
     地図アプリでシートが上がってくるときと同じ動き。 */
  function keepPinVisible(lat, lng) {
    // シートを出した直後は高さが確定していないので、描画を 1 回待つ
    requestAnimationFrame(() => {
      const mapBox = document.getElementById("map").getBoundingClientRect();
      const sheetTop = document.getElementById("new-sheet").getBoundingClientRect().top;
      // 地図のうち、シートに隠れていない帯
      const bandBottom = Math.min(mapBox.bottom, sheetTop);
      if (bandBottom - mapBox.top < 60) return;   // 帯が狭すぎるときは動かさない
      const shift = (mapBox.top + mapBox.height / 2) - (mapBox.top + bandBottom) / 2;
      if (shift <= 0) return;                     // もともと見えているなら触らない
      const zoom = map.getZoom();
      const point = map.project([lat, lng], zoom);
      point.y += shift;                           // 中心を south にずらす＝ピンは上に出る
      map.setView(map.unproject(point, zoom), zoom, { animate: true });
    });
  }

  document.getElementById("add-mode").addEventListener("click", () => {
    setAddMode(!state.addMode);
    message(state.addMode
      ? "地図をタップするか、上の欄で地名を探すと位置を指定できます。" : "",
      state.addMode ? "success" : null);
    if (!state.addMode) clearDraft();
  });

  map.on("click", (e) => {
    if (!state.addMode) return;
    placeDraft(e.latlng.lat, e.latlng.lng);
  });

  function renderChips() {
    document.getElementById("new-water").innerHTML = WATER_TYPES
      .map((w) => `<span class="chip${w.value === state.water ? " selected" : ""}"
                         data-value="${w.value}">${w.label}</span>`).join("");
    document.getElementById("new-type").innerHTML = SPOT_TYPES
      .map((t) => `<span class="chip${t.value === state.type ? " selected" : ""}"
                         data-value="${t.value}">${icon(t.iconName, { size: 13 })} ${t.label}</span>`).join("");
  }

  document.getElementById("new-water").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state.water = chip.dataset.value; renderChips();
  });
  document.getElementById("new-type").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state.type = chip.classList.contains("selected") ? null : chip.dataset.value;
    renderChips();
  });

  document.getElementById("new-close").addEventListener("click", clearDraft);

  function clearDraft() {
    document.getElementById("new-sheet").hidden = true;
    if (draftMarker) { draftMarker.remove(); draftMarker = null; }
    state.draft = null;
  }

  document.getElementById("new-save").addEventListener("click", async (e) => {
    if (!state.draft) return message("地図をタップして位置を指定してください。", "error");
    const button = e.currentTarget;
    button.disabled = true; button.textContent = "登録中…";
    let userId;
    try { userId = await requireUserId(); }
    catch (sessionError) {
      button.disabled = false; button.textContent = "このスポットを登録";
      return message(sessionError.message, "error");
    }
    const { error } = await client.from("spots").insert({
      user_id: userId,
      name: document.getElementById("new-name").value.trim() || null,
      latitude: Number(state.draft.lat.toFixed(6)),
      longitude: Number(state.draft.lng.toFixed(6)),
      water_type: state.water,
      spot_type: state.type,
      low_tide_only: document.getElementById("new-lowtide").checked,
    });
    button.disabled = false; button.textContent = "このスポットを登録";
    if (error) return message(toJapaneseError(error), "error");

    spots = await listSpots();
    clearDraft();
    document.getElementById("new-name").value = "";
    document.getElementById("new-lowtide").checked = false;
    // ここは以前ボタンの中身を "＋ 追加" の文字に戻していて、登録するたびに
    // アイコンが消えていた（D-027 で線画アイコンにした分が飛ぶ）。setAddMode に寄せる
    setAddMode(false);
    renderAll();
    message("スポットを登録しました。", "success");
  });

  function message(text, kind) {
    const box = document.getElementById("message");
    if (!text) { box.hidden = true; return; }
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
  }
</script>
</body>
</html>
