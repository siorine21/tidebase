<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEWS | TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-019 お知らせ（D-074）
     中身は assets/news.json。DB には置かない。書くのは作り手だけで、
     使う人が投稿するものではないから。ファイルなら、直したときの
     コミットと同じ流れで配れる（Pages のデプロイに相乗りする）。 -->
<header class="app-header">
  <a class="back" href="index.html" aria-label="ホームへ戻る" data-icon="back"></a>
  <h1>NEWS</h1>
  <span class="page-sub" id="count">—</span>
</header>

<main>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    requireSession, renderNav, escapeHtml, renderIcons, icon, markNewsSeen,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav(null);   // ナビの 6 枠には入らない。ホームと設定から開く

  const KIND = {
    new: { label: "新機能", className: "news-new" },
    fix: { label: "修正", className: "news-fix" },
  };

  const box = document.getElementById("list");
  let updates = [];
  try {
    // 配信のたびに差し替わるので、古い内容が残らないようにする
    const response = await fetch(`assets/news.json?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    updates = (await response.json()).updates ?? [];
  } catch {
    box.innerHTML = `<div class="empty">お知らせを読み込めませんでした。</div>`;
  }

  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  /**
   * "2026-08-09 17:30" → "08/09(日) 17:30"（JST・24 時間表記）。
   * 年は同じ年のうちは出さない（横幅を食う）。
   *
   * 曜日は **UTC で作った日付から** 引く（D-083）。
   * `new Date("2026-08-09")` はブラウザによって現地時間として解釈され、
   * 日本より西の端末では前日の曜日が出てしまう。
   * 保存してある値はすでに JST なので、時差の再変換もしない。
   */
  function shortAt(at) {
    const [date, time = ""] = String(at ?? "").split(" ");
    const [y, m, d] = date.split("-").map(Number);
    if (!y || !m || !d) return String(at ?? "");
    const week = WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    const thisYear = new Date().getFullYear() === y;
    const md = `${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
    return `${thisYear ? "" : `${y}/`}${md}(${week}) ${time}`.trim();
  }

  if (updates.length) {
    document.getElementById("count").textContent = `${updates.length} 件`;
    // 畳んだ状態では日時とタイトルだけ。更新が増えても縦に伸びない（D-079）。
    // いちばん新しい 1 件だけ開いておく（開いて確かめる手間を省く）
    box.innerHTML = updates.map((update, i) => {
      const items = update.items ?? [];
      const counts = ["new", "fix"]
        .map((k) => [k, items.filter((it) => it.kind === k).length])
        .filter(([, n]) => n > 0);
      return `
      <details class="news-entry"${i === 0 ? " open" : ""}>
        <summary>
          <span class="news-chevron">${icon("chevron-right", { size: 14 })}</span>
          <span class="news-summary">
            <span class="news-at">${escapeHtml(shortAt(update.at))}</span>
            <span class="news-headline">${escapeHtml(update.title ?? "")}</span>
          </span>
          <span class="news-counts">${counts.map(([k, n]) =>
            `<span class="news-badge ${KIND[k].className}">${KIND[k].label} ${n}</span>`).join("")}</span>
        </summary>
        <div class="news-body">
          ${items.map((item) => {
            const kind = KIND[item.kind] ?? KIND.new;
            return `<div class="news-item">
              <span class="news-badge ${kind.className}">${kind.label}</span>
              <span class="news-text">${escapeHtml(item.text)}</span>
            </div>`;
          }).join("")}
        </div>
      </details>`;
    }).join("");
    renderIcons(box);
    // ここまで読んだ印。ホームの点はこれで消える
    markNewsSeen(updates[0].at);
  } else if (!box.querySelector(".empty")) {
    box.innerHTML = `<div class="empty">お知らせはまだありません。</div>`;
  }
</script>
</body>
</html>
