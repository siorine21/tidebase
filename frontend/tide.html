<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDE &amp; WEATHER | TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-003 潮汐・天気詳細 -->
<!-- 潮汐はボトムナビから直接開く画面なので、ヘッダーは他のナビ先と同じ形にする
     （戻るボタンのある page-head は、詳細画面のためのもの） -->
<header class="app-header">
  <h1>TIDE &amp; WEATHER</h1>
  <span class="page-sub" id="point-name">—</span>
</header>

<!-- 地点切替タブ（お気に入り地点） -->
<div class="point-tabs" id="point-tabs"></div>
<select class="point-picker" id="point-picker" hidden
        aria-label="お気に入りに追加する潮汐地点"></select>

<main>
  <div id="message" class="message" hidden role="alert"></div>

  <!-- 週間カレンダー（日を選んでから、その日のサマリ・グラフを見る） -->
  <div class="section-label"><span>WEEKLY CALENDAR</span><span class="note" id="week-range"></span></div>
  <!-- 真ん中は「いま見ている週」の名前。ボタンにすると、来週を見ているのに
       「今週」と書いてあるように読めてしまうため、ここは表示に徹する。
       今週へ戻す操作は、今週から離れているときだけ下に出す。 -->
  <div class="week-nav">
    <button type="button" id="week-prev" aria-label="前の週">＜</button>
    <span class="week-now" id="week-now">今週</span>
    <button type="button" id="week-next" aria-label="次の週">＞</button>
  </div>
  <div class="week-grid" id="week"></div>
  <div class="week-back">
    <button type="button" class="chip" id="week-today" hidden>今週へ戻る</button>
  </div>

  <!-- 選んだ日のサマリ -->
  <div class="section-label"><span>SUMMARY</span><span class="note" id="summary-date"></span></div>
  <div class="info-grid" id="summary">
    <div class="info-cell"><div class="label">潮回り</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">釣行スコア</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">満潮</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">干潮</div><div class="value">—</div></div>
  </div>

  <!-- 潮汐グラフ（日をまたいで連続。横スクロールで時間を移動する） -->
  <div class="section-label">
    <span>TIDE CHART</span>
    <span class="note" id="tide-note"></span>
  </div>
  <div class="card tide-chart-card">
    <!-- 潮位の目盛りは横スクロールしても残ってほしいので、スクローラの外に重ねる -->
    <div class="tide-plot">
      <div class="tide-scroller" id="tide-scroller" tabindex="0"
           aria-label="潮位グラフ。左右にスクロールすると前後の時間を表示します">
        <div class="tide-track" id="tide-track"></div>
      </div>
      <div class="level-axis" id="level-axis" aria-hidden="true"></div>
    </div>
    <div class="tide-legend" id="tide-legend"></div>
    <div class="page-sub" id="tide-correction" hidden></div>
  </div>
  <div class="scroll-hint">
    <span data-icon="back"></span>横にスクロールで前後の時間へ（1 画面 = 1 日・日をまたいで連続）<span data-icon="chevron-right"></span>
  </div>

  <!-- 時間別天気 -->
  <div class="section-label"><span>HOURLY WEATHER</span><span class="note">← スクロール →</span></div>
  <div class="card">
    <div class="hourly" id="hourly"><div class="empty">読み込み中…</div></div>
  </div>
</main>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    requireSession, renderNav, escapeHtml, icon,
    todayInJst, formatJstDate, nowInJst, hoursFromHhmm, addJstDays, weekOf,
    fetchWeatherRange, describeWeather, windDirection,
    fishingScoreOfDay, showFishingScoreHelp, stars,
    listSpots, listTidePoints, fetchTideForPoint, tidePointOfSpot,
    savedTidePoint, saveTidePoint, formatLag,
    listFavoriteTidePoints, saveFavoriteTidePoints,
    tideType, TIDE_TYPE_COLORS, isCoordinateInJapan, tideTimelineSvg, sunStripHtml, levelAxisHtml, tideLevelAt, sunTimes,
  } from "./assets/app.js";

  const DEFAULT_POINT = "ST:MI";   // 静岡特化の既定（D-030）
  const WEEKDAYS_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("tide");

  const today = todayInJst();
  const points = await listTidePoints().catch(() => []);
  if (!points.length) {
    message("潮汐地点を読み込めませんでした。通信状況を確認してください。", "error");
    throw new Error("no tide points");
  }
  const byValue = new Map(points.map((p) => [p.value, p]));

  const spots = await listSpots().catch(() => []);
  // 共有スポットも混ざるので、まず自分のものから選ぶ（D-065）
  const usable = (s) => isCoordinateInJapan(s.latitude, s.longitude);
  const baseSpot = spots.find((s) => s.is_mine && usable(s)) ?? spots.find(usable) ?? null;

  // 表示する地点: URL 指定 → 端末に保存した選択 → スポットの地点 → 既定（舞阪）
  const requested = new URLSearchParams(location.search).get("point");
  const state = {
    point: byValue.get(requested) ?? byValue.get(savedTidePoint())
      ?? byValue.get(tidePointOfSpot(baseSpot)) ?? byValue.get(DEFAULT_POINT) ?? points[0],
    week: today,          // 表示中の週に含まれる日
    date: today,          // サマリ・天気を出す日（グラフの中央に来ている日）
    favorites: [],
  };

  // 取得済みの潮汐（地点 + 日付 でキャッシュ）。地点を変えたら捨てる
  let tideCache = new Map();

  /* ---------- 地点切替タブ ---------- */
  function renderTabs() {
    // お気に入りが空でも、今見ている地点は必ずタブに出す
    const shown = state.favorites.some((p) => p.value === state.point.value)
      ? state.favorites : [state.point, ...state.favorites];
    document.getElementById("point-tabs").innerHTML = shown
      .map((p) => `<button type="button" class="point-tab${p.value === state.point.value ? " on" : ""}"
                           data-value="${escapeHtml(p.value)}">${escapeHtml(p.name)}</button>`).join("")
      + `<button type="button" class="point-tab add" id="tab-add">${icon("plus", { size: 12 })} 追加</button>`
      + (isFavorite(state.point)
        ? `<button type="button" class="point-tab add" id="tab-remove">${icon("close", { size: 12 })} 外す</button>`
        : "");
    // ヘッダーは横幅が限られるので、地点名だけにする
    // （基準観測点と時差は TIDE CHART の見出しと SUMMARY の下に出ている）
    document.getElementById("point-name").textContent = state.point.name;
  }

  function isFavorite(point) {
    return state.favorites.some((p) => p.value === point.value);
  }

  document.getElementById("point-tabs").addEventListener("click", async (e) => {
    const tab = e.target.closest(".point-tab");
    if (!tab) return;

    if (tab.id === "tab-add") return addFavorite();
    if (tab.id === "tab-remove") return removeFavorite();

    const chosen = byValue.get(tab.dataset.value);
    if (!chosen || chosen.value === state.point.value) return;
    await selectPoint(chosen);
  });

  /** 地点を切り替える。URL も書き換えるので、再読み込みしても同じ地点で開く。 */
  async function selectPoint(point) {
    state.point = point;
    tideCache = new Map();          // 地点が変われば潮位は総入れ替え
    saveTidePoint(point.value);
    history.replaceState(null, "", `tide.html?point=${encodeURIComponent(point.value)}`);
    renderTabs();
    renderChart();
    renderWeek();
    applyDate();        // 地点名・推算表記もここで更新する
    await loadWeekDays();
  }

  // 追加用の select は常設して出し入れするだけにする（動的生成はフォーカスの
  // 取り合いで消えることがあるため）
  const picker = document.getElementById("point-picker");

  function addFavorite() {
    const groups = [...new Set(points.map((p) => p.group))];
    picker.innerHTML = `<option value="">お気に入りに追加する地点を選ぶ…</option>`
      + groups.map((group) => {
        const options = points.filter((p) => p.group === group && !isFavorite(p));
        return options.length ? `
          <optgroup label="${escapeHtml(group)}">
            ${options.map((p) => `<option value="${escapeHtml(p.value)}">${escapeHtml(p.label)}</option>`).join("")}
          </optgroup>` : "";
      }).join("");
    picker.value = "";
    picker.hidden = false;
    picker.focus();
  }

  picker.addEventListener("change", async () => {
    const chosen = byValue.get(picker.value);
    picker.hidden = true;
    if (!chosen) return;
    const next = [...state.favorites.map((p) => p.value), chosen.value];
    try { await saveFavoriteTidePoints(next); }
    catch (error) { return message(error.message, "error"); }
    state.favorites = next.map((v) => byValue.get(v)).filter(Boolean);
    await selectPoint(chosen);
  });

  async function removeFavorite() {
    const next = state.favorites.filter((p) => p.value !== state.point.value).map((p) => p.value);
    try { await saveFavoriteTidePoints(next); }
    catch (error) { return message(error.message, "error"); }
    state.favorites = next.map((v) => byValue.get(v)).filter(Boolean);
    renderTabs();
  }

  /* ---------- 潮汐グラフ（日をまたいで連続） ----------
     夜釣りは日付をまたぐ（22 時に入って翌 3 時まで、など）。1 日ずつ切ると
     ちょうど見たいところで途切れるため、週の 7 日ぶんを 1 本の曲線として描き、
     横スクロールで時間軸を移動する。
     画面 1 枚には 1 日ぶんが見えている（D-063）。 */

  // 画面 1 枚 = 1 日（24 時間）。ホームと揃えてある（D-063）。
  // 変えるときは theme.css の .tide-track の幅も一緒に直すこと
  const SCREENS_PER_DAY = 1;
  // viewBox 幅も同じ倍率にする。ずれると preserveAspectRatio="none" の
  // 横引き伸ばしが変わり、時刻ラベルが横に潰れて読めなくなる
  const DAY_UNITS = 320 * SCREENS_PER_DAY;
  const CHART_DAYS = 7;
  const CHART_H = 176, PAD_TOP = 30, PAD_BOTTOM = 30;
  const scroller = document.getElementById("tide-scroller");
  const track = document.getElementById("tide-track");

  /** 1 日ぶんの実寸（px）。 */
  const dayWidth = () => scroller.clientWidth * SCREENS_PER_DAY;

  /** 日付 → 週の何日目か。 */
  function dayIndex(date) {
    return weekOf(state.week).indexOf(date);
  }

  function renderChart() {
    const days = weekOf(state.week);
    const result = tideTimelineSvg({
      days, tides: days.map((date) => tideOf(date)), suns, today,
      dayUnits: DAY_UNITS, height: CHART_H, padTop: PAD_TOP, padBottom: PAD_BOTTOM,
    });
    const axis = document.getElementById("level-axis");
    if (!result) {
      track.innerHTML = `<div class="empty">読み込み中…</div>`;
      axis.innerHTML = "";
      return;
    }
    track.innerHTML = result.svg + sunStripHtml(result.sunMarks);
    // 目盛りは SVG と同じ高さの箱に置く（縦は引き伸ばしていないので座標がそのまま px）
    axis.style.height = `${CHART_H}px`;
    axis.innerHTML = levelAxisHtml(result.levelTicks);
    renderLegend(result.min, result.max);
  }

  function renderLegend(min, max) {
    const now = nowInJst();
    const showNow = weekOf(state.week).includes(now.date);
    const level = showNow
      ? tideLevelAt(tideOf(now.date)?.hourly_levels_cm, Math.min(now.hours, 23)) : null;
    // 日の出・日没はグラフの下の帯で示すので、凡例からは外す（D-053）
    document.getElementById("tide-legend").innerHTML =
      (showNow ? `<span class="lg lg-now">${icon("clock", { size: 13 })} 現在 ${now.hhmm}${
          level != null ? ` · 潮位 ${Math.round(level)}cm` : ""}</span>` : "")
      + `<span class="lg">潮位 ${min}〜${max}cm</span>`;

    const note = document.getElementById("tide-correction");
    const tide = tideOf(state.date);
    if (tide?.corrected) {
      note.textContent = `${tide.point.baseName}の推算値を ${formatLag(tide.point.lagMinutes)} `
        + `ずらした推定値です。${tide.point.source ? ` 出典: ${tide.point.source}` : ""}`;
      note.hidden = false;
    } else {
      note.hidden = true;
    }
  }

  /** 指定日の 0 時を左端に合わせる。 */
  function scrollToDate(date, behavior = "smooth") {
    const index = dayIndex(date);
    if (index < 0) return;
    scroller.scrollTo({ left: index * dayWidth(), behavior });
  }

  /** 現在時刻が画面の中央に来るようにする。 */
  function scrollToNow(behavior = "smooth") {
    const now = nowInJst();
    const index = dayIndex(now.date);
    if (index < 0) return scrollToDate(state.date, behavior);
    const left = (index + now.hours / 24) * dayWidth() - scroller.clientWidth / 2;
    scroller.scrollTo({ left: Math.max(0, left), behavior });
  }

  /** いま画面中央に見えている日。 */
  function centeredDate() {
    const days = weekOf(state.week);
    const index = Math.floor((scroller.scrollLeft + scroller.clientWidth / 2) / (dayWidth() || 1));
    return days[Math.min(Math.max(index, 0), days.length - 1)];
  }

  /**
   * 週の 7 日ぶんを読み込む。
   * 以前は「見えている範囲だけ」にしていたが、週間カレンダーに釣行スコアを
   * 出すようになって結局 7 日ぶんの潮位が要るようになった（D-055）。
   * 見えている日から先に取りにいくので、グラフの表示は前と同じ速さで出る。
   */
  async function loadWeekDays() {
    const days = weekOf(state.week);
    const width = dayWidth() || 1;
    const from = Math.floor(scroller.scrollLeft / width) - 1;
    const to = Math.floor((scroller.scrollLeft + scroller.clientWidth) / width) + 1;
    const near = (date, i) => (i >= from && i <= to ? 0 : 1);
    const ordered = days
      .map((date, i) => ({ date, rank: near(date, i) }))
      .sort((a, b) => a.rank - b.rank)
      .map((x) => x.date);
    await Promise.all(ordered.map(loadDay));
  }

  async function loadDay(date) {
    const key = `${state.point.value}|${date}`;
    if (tideCache.has(key)) return tideCache.get(key);

    const pending = fetchTideForPoint(state.point, date).catch(() => null);
    tideCache.set(key, pending);
    const tide = await pending;
    tideCache.set(key, tide);

    // 取得中に地点が変わっていたら描かない
    if (key.startsWith(`${state.point.value}|`)) {
      renderChart();
      renderWeek();        // 潮の動きぶんが決まるので、その日の星が出せるようになる
      loadWeather(date).then((hours) => {
        if (!hours) return;
        renderChart();                       // 日の出・日没が届いたので夜間帯を描き直す
        if (date === state.date) { renderSummary(date, tideOf(date), hours); renderHourly(hours); }
      });
    }
    return tide;
  }

  function tideOf(date) {
    const value = tideCache.get(`${state.point.value}|${date}`);
    return value instanceof Promise ? null : value ?? null;
  }

  // スクロールが落ち着いたら、中央に来ている日をサマリに反映する
  let scrollTimer = null;
  scroller.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(async () => {
      const date = centeredDate();
      if (date && date !== state.date) {
        state.date = date;
        renderWeek();
        applyDate();
      }
      await loadWeekDays();
    }, 120);
  });

  /* ---------- 天気（日付ごとに取得してキャッシュ） ---------- */
  const weatherCache = new Map();   // 日付 → 時間別予報

  /** 天気は地点の座標で取る（この画面はスポットではなく地点が主役）。 */
  function pickWeatherCoordinates() {
    return state.point.lat != null ? { lat: state.point.lat, lng: state.point.lng } : null;
  }

  /**
   * 日の出・日没。計算で出せる（D-056）ので通信を待たない。
   * 夜の帯と日の出の印が「天気が届くまで出ない」状態を作らないため。
   */
  const sunCache = new Map();       // 地点|日付 → 日の出・日没
  function sunOf(date) {
    const at = pickWeatherCoordinates();
    if (!at) return null;
    const key = `${state.point.value}|${date}`;
    if (!sunCache.has(key)) sunCache.set(key, sunTimes(at.lat, at.lng, date));
    return sunCache.get(key);
  }
  const suns = { get: sunOf };      // tideTimelineSvg へ渡す（Map と同じ使い方）

  /**
   * 指定日の時間別予報。取得は週まとめ（D-055）なので、
   * ここでは「その週ぶんが届くのを待つ」だけ。
   * 日ごとに取りにいくと 1 週間で 7 往復してしまう。
   */
  async function loadWeather(date) {
    if (weatherCache.has(date)) return weatherCache.get(date);
    await loadWeekWeather(weekOf(state.week));
    return weatherCache.get(date) ?? null;
  }

  /** 選択中の日をサマリ・天気に反映する。 */
  async function applyDate() {
    const date = state.date;
    renderSummary(date, tideOf(date), weatherCache.get(date) ?? null);
    renderHourly(weatherCache.get(date) ?? null);

    if (!weatherCache.has(date)) {
      const hours = await loadWeather(date);
      if (state.date !== date) return;     // 待っている間に別の日へ移った
      renderSummary(date, tideOf(date), hours);
      renderHourly(hours);
      renderChart();                       // 日の出・日没が届いたので夜間帯を描き直す
    }
  }

  /* ---------- サマリ ---------- */
  let scoreContext = null;

  // サマリは描き直されるので、器のほうでクリックを受ける
  document.getElementById("summary").addEventListener("click", (e) => {
    if (!e.target.closest("#score-help") || !scoreContext) return;
    showFishingScoreHelp(scoreContext);
  });

  function renderSummary(date, tide, weather) {
    document.getElementById("summary-date").textContent = formatJstDate(date, { weekday: true });
    document.getElementById("tide-note").textContent =
      `${state.point.name}${state.point.area ? " 推算" : ""}`;
    const type = tide?.tide_type ?? tideType(date);
    // 朝マヅメ・夕マヅメで判定し、良いほうをその日のスコアにする（D-051・D-052）
    scoreContext = weather
      ? fishingScoreOfDay({
          tideType: type, hours: weather, sun: sunOf(date), tide })
      : null;
    const score = scoreContext?.score ?? null;

    const cell = (label, value, color, sub) => `
      <div class="info-cell">
        <div class="label">${label}</div>
        <div class="value"${color ? ` style="color:${color}"` : ""}>${value}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
      </div>`;

    document.getElementById("summary").innerHTML =
      cell("潮回り", escapeHtml(type), TIDE_TYPE_COLORS[type])
      + cell("釣行スコア", score
          ? stars(score)
            + `<button type="button" class="info-hint" id="score-help"
                       aria-label="釣行スコアの説明">${icon("help", { size: 14 })}</button>`
          : "—", score >= 4 ? "var(--green)" : null,
          // 朝と夕のどちらが良いかは、開かなくても見えるほうがいい
          scoreContext && !scoreContext.fallback
            ? scoreContext.windows
                .map((w) => `${w.label.slice(0, 1)} ${w.score}`).join(" / ")
            : null)
      + cell("満潮", formatEvents(tide?.high_tides))
      + cell("干潮", formatEvents(tide?.low_tides));
  }

  function formatEvents(events) {
    const times = (events ?? []).map((e) => e.time).filter(Boolean);
    return times.length ? escapeHtml(times.join(" / ")) : "—";
  }

  /* ---------- 時間別天気 ---------- */
  function renderHourly(weather) {
    const box = document.getElementById("hourly");
    if (!weather) { box.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const picked = weather.filter((w) => w.hour % 3 === 0).slice(0, 9);
    box.innerHTML = picked.map((w, i) => {
      const { icon: weatherIcon } = describeWeather(w.weather_code);
      const badge = w.hour === 6 ? "朝マズメ" : w.hour === 18 ? "夕マズメ" : "";
      return `
        <div class="hour-card${badge ? " highlight" : ""}">
          <div class="h">${i === 8 ? "+24h" : `${w.hour}時`}</div>
          <div class="badge">${badge || "&nbsp;"}</div>
          <div class="icon-wrap">${weatherIcon}</div>
          <div class="t">${Math.round(w.temp_c)}°</div>
          <div class="w">${windDirection(w.wind_dir_deg)}${Math.round(w.wind_speed_ms)}m</div>
        </div>`;
    }).join("");
  }

  /* ---------- 週間カレンダー ---------- */
  function renderWeek() {
    const days = weekOf(state.week);
    // 見出しは日付の範囲、ナビの真ん中は週の呼び名。同じ情報を二重に出さない
    document.getElementById("week-range").textContent =
      `${days[0].slice(5).replace("-", "/")} — ${days[6].slice(5).replace("-", "/")}`;
    const isThisWeek = days[0] === weekOf(today)[0];
    document.getElementById("week-now").textContent = weekLabel(days[0]);
    document.getElementById("week-now").classList.toggle("current", isThisWeek);
    document.getElementById("week-today").hidden = isThisWeek;

    // 潮回りは月齢から出せるので通信不要。天気は予報の届く範囲だけ載る
    document.getElementById("week").innerHTML = days.map(dayCell).join("");
  }

  /**
   * 週の天気を 1 リクエストでまとめて取る（D-055）。
   * 釣行スコアを日別に出すには、日の出・日没とマヅメ時刻の風まで要る。
   * 取れたものは選択日用のキャッシュにも入れるので、日を切り替えても再取得しない。
   */
  // 取りにいった週（週の初日 → 進行中の Promise）。
  // 予報が届かない週は結果が空のままなので、「取れたか」ではなく「取りにいったか」で
  // 止める。そうしないと再描画のたびに叩き続ける。
  const requestedWeeks = new Map();

  function loadWeekWeather(days) {
    const key = days[0];
    if (requestedWeeks.has(key)) return requestedWeeks.get(key);
    const at = pickWeatherCoordinates();
    if (!at) return Promise.resolve();

    const pending = (async () => {
      const range = await fetchWeatherRange(at.lat, at.lng, days[0], days[6]);
      for (const [date, { hours }] of range) weatherCache.set(date, hours);
      if (weekOf(state.week)[0] !== key) return;   // 待っている間に週が変わった
      renderWeek();
      renderChart();                               // 夜の帯・日の出の印も描き直す
      applyDate();
    })();
    requestedWeeks.set(key, pending);
    return pending;
  }

  /** 「今週」から何週ぶん離れているかを言葉にする。 */
  function weekLabel(weekStart) {
    const diff = Math.round(
      (Date.parse(`${weekStart}T00:00:00+09:00`) - Date.parse(`${weekOf(today)[0]}T00:00:00+09:00`))
      / (7 * 86400000));
    if (diff === 0) return "今週";
    if (diff === 1) return "来週";
    if (diff === -1) return "先週";
    return diff > 0 ? `${diff} 週間後` : `${-diff} 週間前`;
  }

  function dayCell(date) {
    const weekday = new Date(`${date}T00:00:00Z`).getUTCDay();
    const type = tideType(date);
    const classes = ["day"];
    if (date === today) classes.push("today");
    if (date === state.date) classes.push("selected");

    const hours = weatherCache.get(date) ?? null;
    const noon = hours?.find((w) => w.hour === 12) ?? hours?.[0] ?? null;
    // 潮汐も揃っていないと潮の動きぶんが出せない。揃うまではスコアを出さない
    // （途中の点を見せると、あとで数字が変わって見える）
    const day = hours && sunOf(date) && tideOf(date)
      ? fishingScoreOfDay({ tideType: type, hours, sun: sunOf(date), tide: tideOf(date) })
      : null;

    // 狭いセルなので星は 1 つだけにして数字を添える（★★★★☆ は 7 列に入らない）
    const score = day
      ? `<span class="sc"${day.score >= 4 ? ` style="color:var(--green)"` : ""}>★${day.score}</span>`
      : `<span class="sc dim">—</span>`;
    return `
      <button type="button" class="${classes.join(" ")}" data-date="${date}">
        <span class="wd wd-${weekday}">${WEEKDAYS_EN[weekday]}</span>
        <span class="dd">${Number(date.slice(8))}</span>
        <span class="tt" style="color:${TIDE_TYPE_COLORS[type]}">${type}</span>
        <span class="wx">${noon == null ? "" : describeWeather(noon.weather_code).icon}</span>
        ${score}
      </button>`;
  }

  document.getElementById("week").addEventListener("click", (e) => {
    const day = e.target.closest(".day");
    if (!day || day.dataset.date === state.date) return;
    // グラフを該当日までスクロールさせる。反映は scroll ハンドラが行う
    scrollToDate(day.dataset.date);
  });

  document.getElementById("week-prev").addEventListener("click", () => changeWeek(-7));
  document.getElementById("week-next").addEventListener("click", () => changeWeek(7));
  document.getElementById("week-today").addEventListener("click", async () => {
    state.week = today; state.date = today;
    renderChart(); renderWeek(); applyDate();
    loadWeekWeather(weekOf(state.week));
    await loadWeekDays();
    scrollToNow();          // 「今週」は現在時刻の位置まで戻す
  });

  async function changeWeek(days) {
    state.week = addJstDays(state.week, days);
    // 週を送ったら、その週の同じ曜日を選ぶ
    state.date = addJstDays(state.date, days);
    renderChart();
    renderWeek();
    applyDate();
    loadWeekWeather(weekOf(state.week));
    scrollToDate(state.date, "auto");
    await loadWeekDays();
  }

  function message(text, kind) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
  }

  /* ---------- 初期化 ----------
     イベント登録をすべて済ませてから通信する。逆順にすると、タブや週送りが
     見えているのに通信が終わるまで押しても反応しない時間ができる。 */
  state.favorites = await listFavoriteTidePoints(points).catch(() => []);
  renderTabs();
  renderWeek();
  applyDate();
  loadWeekWeather(weekOf(state.week));
  scrollToDate(state.date, "auto");
  await loadWeekDays();
  scrollToNow("auto");        // 開いた直後は「いま」が見えている状態にする
</script>
</body>
</html>
