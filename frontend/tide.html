<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIDE &amp; WEATHER | TIDEBASE</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-003 潮汐・天気詳細 -->
<header class="page-head">
  <button type="button" class="back" id="back" aria-label="戻る">←</button>
  <div>
    <div class="page-title">TIDE &amp; WEATHER</div>
    <div class="page-sub" id="point-name">—</div>
  </div>
</header>

<!-- 地点切替タブ（お気に入り地点） -->
<div class="point-tabs" id="point-tabs"></div>
<select class="point-picker" id="point-picker" hidden
        aria-label="お気に入りに追加する潮汐地点"></select>

<main>
  <div id="message" class="message" hidden role="alert"></div>

  <!-- 週間カレンダー（日を選んでから、その日のサマリ・グラフを見る） -->
  <div class="section-label"><span>WEEKLY CALENDAR</span><span class="note" id="week-range"></span></div>
  <div class="week-nav">
    <button type="button" id="week-prev" aria-label="前の週">＜</button>
    <button type="button" class="btn btn-quiet" id="week-today">今週</button>
    <button type="button" id="week-next" aria-label="次の週">＞</button>
  </div>
  <div class="week-grid" id="week"></div>

  <!-- 選んだ日のサマリ -->
  <div class="section-label"><span>SUMMARY</span><span class="note" id="summary-date"></span></div>
  <div class="info-grid" id="summary">
    <div class="info-cell"><div class="label">潮回り</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">釣行スコア</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">満潮</div><div class="value">—</div></div>
    <div class="info-cell"><div class="label">干潮</div><div class="value">—</div></div>
  </div>

  <!-- 大型潮汐グラフ（横スクロールで日送り） -->
  <div class="section-label">
    <span>24H TIDE CHART</span>
    <span class="note" id="tide-note"></span>
  </div>
  <div class="tide-scroller" id="tide-scroller" tabindex="0"
       aria-label="潮位グラフ。左右にスクロールすると別の日を表示します"></div>
  <div class="scroll-hint"><span data-icon="back"></span>横にスクロールで日送り<span data-icon="chevron-right"></span></div>

  <!-- 時間別天気 -->
  <div class="section-label"><span>HOURLY WEATHER</span><span class="note">← スクロール →</span></div>
  <div class="card">
    <div class="hourly" id="hourly"><div class="empty">読み込み中…</div></div>
  </div>
</main>

<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    requireSession, renderNav, escapeHtml, icon,
    todayInJst, formatJstDate, nowInJst, hoursFromHhmm, addJstDays, weekOf,
    fetchWeather, fetchDailyWeather, describeWeather, windDirection, fishingScore,
    listSpots, listTidePoints, fetchTideForPoint, tidePointOfSpot,
    savedTidePoint, saveTidePoint, formatLag,
    listFavoriteTidePoints, saveFavoriteTidePoints,
    tideType, TIDE_TYPE_COLORS, isCoordinateInJapan,
  } from "./assets/app.js";

  const DEFAULT_POINT = "ST:MI";   // 静岡特化の既定（D-030）
  const WEEKDAYS_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("home");
  document.getElementById("back").addEventListener("click", () => history.back());

  const today = todayInJst();
  const points = await listTidePoints().catch(() => []);
  if (!points.length) {
    message("潮汐地点を読み込めませんでした。通信状況を確認してください。", "error");
    throw new Error("no tide points");
  }
  const byValue = new Map(points.map((p) => [p.value, p]));

  const spots = await listSpots().catch(() => []);
  const baseSpot = spots.find((s) => isCoordinateInJapan(s.latitude, s.longitude)) ?? null;

  // 表示する地点: URL 指定 → 端末に保存した選択 → スポットの地点 → 既定（舞阪）
  const requested = new URLSearchParams(location.search).get("point");
  const state = {
    point: byValue.get(requested) ?? byValue.get(savedTidePoint())
      ?? byValue.get(tidePointOfSpot(baseSpot)) ?? byValue.get(DEFAULT_POINT) ?? points[0],
    week: today,          // 表示中の週に含まれる日
    date: today,          // サマリ・天気を出す日（グラフの中央に来ている日）
    favorites: [],
  };

  // 取得済みの潮汐（地点 + 日付 でキャッシュ）。地点を変えたら捨てる
  let tideCache = new Map();
  const scroller = document.getElementById("tide-scroller");

  /* ---------- 地点切替タブ ---------- */
  function renderTabs() {
    // お気に入りが空でも、今見ている地点は必ずタブに出す
    const shown = state.favorites.some((p) => p.value === state.point.value)
      ? state.favorites : [state.point, ...state.favorites];
    document.getElementById("point-tabs").innerHTML = shown
      .map((p) => `<button type="button" class="point-tab${p.value === state.point.value ? " on" : ""}"
                           data-value="${escapeHtml(p.value)}">${escapeHtml(p.name)}</button>`).join("")
      + `<button type="button" class="point-tab add" id="tab-add">${icon("plus", { size: 12 })} 追加</button>`
      + (isFavorite(state.point)
        ? `<button type="button" class="point-tab add" id="tab-remove">${icon("close", { size: 12 })} 外す</button>`
        : "");
    document.getElementById("point-name").textContent = state.point.label;
  }

  function isFavorite(point) {
    return state.favorites.some((p) => p.value === point.value);
  }

  document.getElementById("point-tabs").addEventListener("click", async (e) => {
    const tab = e.target.closest(".point-tab");
    if (!tab) return;

    if (tab.id === "tab-add") return addFavorite();
    if (tab.id === "tab-remove") return removeFavorite();

    const chosen = byValue.get(tab.dataset.value);
    if (!chosen || chosen.value === state.point.value) return;
    await selectPoint(chosen);
  });

  /** 地点を切り替える。URL も書き換えるので、再読み込みしても同じ地点で開く。 */
  async function selectPoint(point) {
    state.point = point;
    tideCache = new Map();          // 地点が変われば潮位は総入れ替え
    saveTidePoint(point.value);
    history.replaceState(null, "", `tide.html?point=${encodeURIComponent(point.value)}`);
    renderTabs();
    renderScroller();
    renderWeek();
    await loadVisibleDays();
  }

  // 追加用の select は常設して出し入れするだけにする（動的生成はフォーカスの
  // 取り合いで消えることがあるため）
  const picker = document.getElementById("point-picker");

  function addFavorite() {
    const groups = [...new Set(points.map((p) => p.group))];
    picker.innerHTML = `<option value="">お気に入りに追加する地点を選ぶ…</option>`
      + groups.map((group) => {
        const options = points.filter((p) => p.group === group && !isFavorite(p));
        return options.length ? `
          <optgroup label="${escapeHtml(group)}">
            ${options.map((p) => `<option value="${escapeHtml(p.value)}">${escapeHtml(p.label)}</option>`).join("")}
          </optgroup>` : "";
      }).join("");
    picker.value = "";
    picker.hidden = false;
    picker.focus();
  }

  picker.addEventListener("change", async () => {
    const chosen = byValue.get(picker.value);
    picker.hidden = true;
    if (!chosen) return;
    const next = [...state.favorites.map((p) => p.value), chosen.value];
    try { await saveFavoriteTidePoints(next); }
    catch (error) { return message(error.message, "error"); }
    state.favorites = next.map((v) => byValue.get(v)).filter(Boolean);
    await selectPoint(chosen);
  });

  async function removeFavorite() {
    const next = state.favorites.filter((p) => p.value !== state.point.value).map((p) => p.value);
    try { await saveFavoriteTidePoints(next); }
    catch (error) { return message(error.message, "error"); }
    state.favorites = next.map((v) => byValue.get(v)).filter(Boolean);
    renderTabs();
  }

  /* ---------- 潮汐グラフ（横スクロールで日送り） ----------
     表示中の週の 7 日ぶんを横に並べ、スクロールで日を送る。
     中央に来た日がサマリ・天気・カレンダーの選択に反映される。 */

  function renderScroller() {
    const days = weekOf(state.week);
    scroller.innerHTML = days.map((date) => `
      <section class="tide-day" data-date="${date}">
        <div class="tide-day-head">${escapeHtml(formatJstDate(date, { weekday: true }))}${
          date === today ? ` <span class="today-mark">TODAY</span>` : ""}</div>
        <div class="card tide-day-card"><div class="empty">読み込み中…</div></div>
      </section>`).join("");
    // 選択中の日を中央に置く（初回はスクロールアニメなし）
    scrollToDate(state.date, "auto");
  }

  function panelFor(date) {
    return scroller.querySelector(`.tide-day[data-date="${date}"]`);
  }

  function scrollToDate(date, behavior = "smooth") {
    const panel = panelFor(date);
    if (!panel) return;
    scroller.scrollTo({ left: panel.offsetLeft - scroller.offsetLeft, behavior });
  }

  /** いま中央に見えている日。 */
  function centeredDate() {
    const middle = scroller.scrollLeft + scroller.clientWidth / 2;
    let best = null, bestDistance = Infinity;
    for (const panel of scroller.querySelectorAll(".tide-day")) {
      const center = panel.offsetLeft - scroller.offsetLeft + panel.offsetWidth / 2;
      const distance = Math.abs(center - middle);
      if (distance < bestDistance) { bestDistance = distance; best = panel.dataset.date; }
    }
    return best;
  }

  /** 見えている日とその前後を読み込む（全部まとめて取りにいかない）。 */
  async function loadVisibleDays() {
    const days = weekOf(state.week);
    const index = days.indexOf(centeredDate() ?? state.date);
    const wanted = [index, index - 1, index + 1]
      .filter((i) => i >= 0 && i < days.length).map((i) => days[i]);
    await Promise.all(wanted.map(loadDay));
  }

  async function loadDay(date) {
    const key = `${state.point.value}|${date}`;
    if (tideCache.has(key)) return tideCache.get(key);

    const pending = fetchTideForPoint(state.point, date).catch(() => null);
    tideCache.set(key, pending);
    const tide = await pending;
    tideCache.set(key, tide);

    // 取得中に地点や週が変わっていたら描かない
    const panel = panelFor(date);
    if (panel && key.startsWith(`${state.point.value}|`)) {
      renderTideGraph(panel.querySelector(".tide-day-card"), date, tide);
    }
    if (date === state.date) applyDate();
    return tide;
  }

  function tideOf(date) {
    const value = tideCache.get(`${state.point.value}|${date}`);
    return value instanceof Promise ? null : value ?? null;
  }

  // スクロールが落ち着いたら中央の日を採用する
  let scrollTimer = null;
  scroller.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(async () => {
      const date = centeredDate();
      if (date && date !== state.date) {
        state.date = date;
        renderWeek();
        applyDate();
      }
      await loadVisibleDays();
    }, 120);
  });

  /* ---------- 大型潮汐グラフ ---------- */
  function renderTideGraph(card, date, tide) {
    if (!tide) {
      card.innerHTML = `<div class="empty">潮汐データを取得できませんでした</div>`;
      return;
    }
    const levels = tide.hourly_levels_cm;
    const valid = levels.filter((v) => v != null);
    const min = Math.min(...valid), max = Math.max(...valid);
    // ホーム（SCR-001）より縦に大きく、満干ラベルをグラフ内に置く
    const W = 320, H = 176, padTop = 30, padBottom = 30, padX = 6;
    const x = (h) => padX + (h / 23) * (W - padX * 2);
    const y = (v) => H - padBottom - ((v - min) / Math.max(1, max - min)) * (H - padTop - padBottom);

    const points = levels.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean);
    const area = `M${padX},${H - padBottom} L${points.join(" L")} L${W - padX},${H - padBottom} Z`;

    const now = nowInJst();
    // 毎時値は 0〜23 時の 24 点なので、23 時台は軸の右端に留める
    const nowHours = Math.min(now.hours, 23);
    const showNow = date === now.date;
    const nowLevel = levelAt(levels, now.hours);
    const sun = sunCache.get(date) ?? null;
    const riseH = hoursFromHhmm(sun?.rise);
    const setH = hoursFromHhmm(sun?.set);

    const night = riseH != null && setH != null
      ? `<rect class="night" x="${padX}" y="${padTop - 8}" width="${Math.max(0, x(riseH) - padX)}"
               height="${H - padBottom - padTop + 8}"/>
         <rect class="night" x="${x(setH)}" y="${padTop - 8}" width="${Math.max(0, W - padX - x(setH))}"
               height="${H - padBottom - padTop + 8}"/>`
      : "";

    // 大型チャートは満干ラベルが曲線上に乗るため、日の出・日没は線だけにする
    // （時刻は下の凡例に出す。文字を入れると干潮ラベルと重なる）
    const sunLine = (hours) => hours == null ? "" : `
      <line class="sun-line" x1="${x(hours)}" y1="${padTop - 8}" x2="${x(hours)}" y2="${H - padBottom}"/>`;

    // 満潮・干潮はグラフ内に点＋ラベルで置く（ワイヤーフレーム v7.2）
    const marks = [
      ...(tide.high_tides ?? []).map((e) => ({ ...e, kind: "high", mark: "満" })),
      ...(tide.low_tides ?? []).map((e) => ({ ...e, kind: "low", mark: "干" })),
    ].filter((e) => e.time).map((e) => {
      const hours = hoursFromHhmm(e.time);
      const cx = x(hours);
      const cy = e.level_cm != null ? y(e.level_cm) : y(levelAt(levels, hours) ?? min);
      // 端でラベルが切れないように寄せる
      const anchor = cx < 34 ? "start" : cx > W - 34 ? "end" : "middle";
      const tx = anchor === "start" ? padX : anchor === "end" ? W - padX : cx;
      // 干潮は点の下に置くが、谷が深いと時刻の目盛りと重なるので上へ逃がす
      const ty = e.kind === "high" || cy > H - padBottom - 18 ? cy - 10 : cy + 15;
      return `
        <circle class="peak-dot ${e.kind}" cx="${cx}" cy="${cy}" r="3.5"/>
        <text class="peak ${e.kind}" x="${tx}" y="${ty}" text-anchor="${anchor}">${e.mark} ${e.time}</text>`;
    }).join("");

    card.innerHTML = `
      <svg class="tide-graph tide-graph-lg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="${escapeHtml(date)} の潮位グラフ">
        ${night}
        ${[6, 12, 18].map((h) => `<line class="grid" x1="${x(h)}" y1="${padTop - 8}" x2="${x(h)}" y2="${H - padBottom}"/>`).join("")}
        <line class="axis" x1="${padX}" y1="${H - padBottom}" x2="${W - padX}" y2="${H - padBottom}"/>
        ${sunLine(riseH)}
        ${sunLine(setH)}
        <path class="curve" d="${area}"/>
        ${showNow ? `
          <line class="now" x1="${x(nowHours)}" y1="${padTop - 8}" x2="${x(nowHours)}" y2="${H - padBottom}"/>
          ${nowLevel != null ? `<circle class="now-dot" cx="${x(nowHours)}" cy="${y(nowLevel)}" r="4"/>` : ""}` : ""}
        ${marks}
        ${[0, 6, 12, 18].map((h) => `<text x="${x(h)}" y="${H - 10}">${h}:00</text>`).join("")}
        <text x="${W - padX}" y="${H - 10}" text-anchor="end">23:00</text>
      </svg>
      <div class="tide-legend">
        ${sun ? `<span class="lg lg-sun">${icon("sunrise", { size: 13 })} 日の出 ${sun.rise}</span>
                 <span class="lg lg-sun">${icon("sunset", { size: 13 })} 日没 ${sun.set}</span>` : ""}
        ${showNow ? `<span class="lg lg-now">${icon("clock", { size: 13 })} 現在 ${now.hhmm}${
          nowLevel != null ? ` · 潮位 ${Math.round(nowLevel)}cm` : ""}</span>` : ""}
        <span class="lg">潮位 ${min}〜${max}cm</span>
      </div>
      ${tide.corrected ? `<div class="page-sub" style="margin-top:8px;line-height:1.5">
        ${escapeHtml(tide.point.baseName)}の推算値を ${formatLag(tide.point.lagMinutes)} ずらした推定値です。
        ${tide.point.source ? `出典: ${escapeHtml(tide.point.source)}` : ""}</div>` : ""}`;
  }

  function levelAt(levels, hours) {
    const i = Math.floor(hours);
    const a = levels[Math.min(i, 23)], b = levels[Math.min(i + 1, 23)];
    if (a == null) return null;
    if (b == null) return a;
    return a + (b - a) * (hours - i);
  }

  /* ---------- 天気（日付ごとに取得してキャッシュ） ---------- */
  const weatherCache = new Map();   // 日付 → 時間別予報
  const sunCache = new Map();       // 日付 → 日の出・日没

  /** 天気は地点の座標で取る（この画面はスポットではなく地点が主役）。 */
  function pickWeatherCoordinates() {
    return state.point.lat != null ? { lat: state.point.lat, lng: state.point.lng } : null;
  }

  async function loadWeather(date) {
    if (weatherCache.has(date)) return weatherCache.get(date);
    const at = pickWeatherCoordinates();
    if (!at) return null;
    const forecast = await fetchWeather(at.lat, at.lng, date).catch(() => null);
    weatherCache.set(date, forecast?.hours ?? null);
    if (forecast?.sun) sunCache.set(date, forecast.sun);
    return forecast?.hours ?? null;
  }

  /** 選択中の日をサマリ・天気に反映する。 */
  async function applyDate() {
    const date = state.date;
    renderSummary(date, tideOf(date), weatherCache.get(date) ?? null);
    renderHourly(weatherCache.get(date) ?? null);

    if (!weatherCache.has(date)) {
      const hours = await loadWeather(date);
      if (state.date !== date) return;     // 待っている間に別の日へ移った
      renderSummary(date, tideOf(date), hours);
      renderHourly(hours);
      // 日の出・日没が後から届くのでグラフを描き直す
      const panel = panelFor(date);
      if (panel && tideOf(date)) renderTideGraph(panel.querySelector(".tide-day-card"), date, tideOf(date));
    }
  }

  /* ---------- サマリ ---------- */
  function renderSummary(date, tide, weather) {
    document.getElementById("summary-date").textContent = formatJstDate(date, { weekday: true });
    document.getElementById("tide-note").textContent =
      `${state.point.name}${state.point.area ? " 推算" : ""}`;
    const type = tide?.tide_type ?? tideType(date);
    // その日の 12 時の天気で代表させる（過去日・未来日でも同じ基準になる）
    const noon = weather?.find((w) => w.hour === 12) ?? weather?.[0] ?? null;
    const score = noon ? fishingScore(type, noon.weather_code, noon.wind_speed_ms) : null;

    const cell = (label, value, color) => `
      <div class="info-cell">
        <div class="label">${label}</div>
        <div class="value"${color ? ` style="color:${color}"` : ""}>${value}</div>
      </div>`;

    document.getElementById("summary").innerHTML =
      cell("潮回り", escapeHtml(type), TIDE_TYPE_COLORS[type])
      + cell("釣行スコア", score
          ? `${"★".repeat(score)}${"☆".repeat(5 - score)}`
          : "—", score >= 4 ? "var(--green)" : null)
      + cell("満潮", formatEvents(tide?.high_tides))
      + cell("干潮", formatEvents(tide?.low_tides));
  }

  function formatEvents(events) {
    const times = (events ?? []).map((e) => e.time).filter(Boolean);
    return times.length ? escapeHtml(times.join(" / ")) : "—";
  }

  /* ---------- 時間別天気 ---------- */
  function renderHourly(weather) {
    const box = document.getElementById("hourly");
    if (!weather) { box.innerHTML = `<div class="empty">読み込み中…</div>`; return; }
    const picked = weather.filter((w) => w.hour % 3 === 0).slice(0, 9);
    box.innerHTML = picked.map((w, i) => {
      const { icon: weatherIcon } = describeWeather(w.weather_code);
      const badge = w.hour === 6 ? "朝マズメ" : w.hour === 18 ? "夕マズメ" : "";
      return `
        <div class="hour-card${badge ? " highlight" : ""}">
          <div class="h">${i === 8 ? "+24h" : `${w.hour}時`}</div>
          <div class="badge">${badge || "&nbsp;"}</div>
          <div class="icon-wrap">${weatherIcon}</div>
          <div class="t">${Math.round(w.temp_c)}°</div>
          <div class="w">${windDirection(w.wind_dir_deg)}${Math.round(w.wind_speed_ms)}m</div>
        </div>`;
    }).join("");
  }

  /* ---------- 週間カレンダー ---------- */
  async function renderWeek() {
    const days = weekOf(state.week);
    document.getElementById("week-range").textContent =
      `${days[0].slice(5).replace("-", "/")} — ${days[6].slice(5).replace("-", "/")}`;

    // 潮回りは月齢から出せるので通信不要。天気は予報の届く範囲だけ載る
    const box = document.getElementById("week");
    box.innerHTML = days.map((date) => dayCell(date, dailyCodes.get(date) ?? null)).join("");

    const at = pickWeatherCoordinates();
    if (!at || dailyCodes.has(days[0])) return;
    const codes = await fetchDailyWeather(at.lat, at.lng, days[0], days[6]);
    for (const [date, code] of Object.entries(codes)) dailyCodes.set(date, code);
    if (weekOf(state.week)[0] !== days[0]) return;   // 待っている間に週が変わった
    box.innerHTML = days.map((date) => dayCell(date, dailyCodes.get(date) ?? null)).join("");
  }

  const dailyCodes = new Map();   // 日付 → WMO 天気コード

  function dayCell(date, weatherCode) {
    const weekday = new Date(`${date}T00:00:00Z`).getUTCDay();
    const type = tideType(date);
    const classes = ["day"];
    if (date === today) classes.push("today");
    if (date === state.date) classes.push("selected");
    return `
      <button type="button" class="${classes.join(" ")}" data-date="${date}">
        <span class="wd wd-${weekday}">${WEEKDAYS_EN[weekday]}</span>
        <span class="dd">${Number(date.slice(8))}</span>
        <span class="tt" style="color:${TIDE_TYPE_COLORS[type]}">${type}</span>
        <span class="wx">${weatherCode == null ? "" : describeWeather(weatherCode).icon}</span>
      </button>`;
  }

  document.getElementById("week").addEventListener("click", (e) => {
    const day = e.target.closest(".day");
    if (!day || day.dataset.date === state.date) return;
    // グラフを該当日までスクロールさせる。反映は scroll ハンドラが行う
    scrollToDate(day.dataset.date);
  });

  document.getElementById("week-prev").addEventListener("click", () => changeWeek(-7));
  document.getElementById("week-next").addEventListener("click", () => changeWeek(7));
  document.getElementById("week-today").addEventListener("click", () => {
    state.week = today; state.date = today;
    renderScroller(); renderWeek(); applyDate(); loadVisibleDays();
  });

  function changeWeek(days) {
    state.week = addJstDays(state.week, days);
    // 週を送ったら、その週の同じ曜日を選ぶ
    state.date = addJstDays(state.date, days);
    renderScroller();
    renderWeek();
    applyDate();
    loadVisibleDays();
  }

  function message(text, kind) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
  }

  /* ---------- 初期化 ----------
     イベント登録をすべて済ませてから通信する。逆順にすると、タブや週送りが
     見えているのに通信が終わるまで押しても反応しない時間ができる。 */
  state.favorites = await listFavoriteTidePoints(points).catch(() => []);
  renderTabs();
  renderScroller();
  renderWeek();
  applyDate();
  await loadVisibleDays();
</script>
</body>
</html>
