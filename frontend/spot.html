<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPOT DETAIL | TIDEBASE</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDEBASE">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="app-body">
<!-- SCR-005 スポット詳細（編集・削除・釣果一括変更） -->
<header class="page-head">
  <button type="button" class="back" id="back" aria-label="戻る">←</button>
  <div class="page-title" id="title">SPOT DETAIL</div>
</header>

<main>
  <div id="message" class="message" hidden role="alert"></div>
  <div id="content"><div class="empty">読み込み中…</div></div>
</main>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
  import {
    client, requireSession, renderNav, escapeHtml, toJapaneseError,
    listSpots, getSpot, listRecords, createMap, spotMarker, spotType, waterLabel, ownerBadge,
    SPOT_TYPES, WATER_TYPES, googleMapsUrl, googleDirectionsUrl, formatJstDate, icon,
    recordFishName, listTidePoints, tidePointOfSpot, formatLag, isCoordinateInJapan,
    attachPlaceSearch,
    navigate,
    recordOutcome,
  } from "./assets/app.js";

  const session = await requireSession();
  if (!session) throw new Error("unauthenticated");
  renderNav("map");
  document.getElementById("back").addEventListener("click", () => navigate("spots.html"));

  const id = new URLSearchParams(location.search).get("id");
  if (!id) {
    document.getElementById("content").innerHTML = `<div class="empty">スポットが指定されていません。</div>`;
    throw new Error("no id");
  }

  let spot = null;
  let records = [];
  let allSpots = [];
  let editMap = null;
  let editMarker = null;
  const edit = { lat: null, lng: null, water: null, type: null };
  const tidePoints = await listTidePoints().catch(() => []);

  // 宣言は load() の呼び出しより前に置くこと。const/let は巻き上がらないので、
  // 後ろに置くと load() の中で「初期化前に参照した」で落ちる
  let loadError = null;

  await load();

  async function load() {
    loadError = null;
    const [data, recordList, spotList] = await Promise.all([
      getSpot(id).catch((error) => { loadError = error; return null; }),
      listRecords({ limit: 200, spotId: id }).catch(() => []),
      listSpots().catch(() => []),
    ]);
    if (loadError) {
      document.getElementById("content").innerHTML = `<div class="empty">${escapeHtml(toJapaneseError(loadError))}</div>`;
      return;
    }
    if (!data) {
      document.getElementById("content").innerHTML = `<div class="empty">スポットが見つかりません。</div>`;
      return;
    }
    spot = data; records = recordList; allSpots = spotList;
    render();
  }

  function render() {
    const type = spotType(spot.spot_type);
    document.getElementById("title").textContent = spot.name ?? "無名スポット";
    // 「釣れた数」と「魚がいた回数」を分ける（D-092）。
    // バラシとミスバイトは、そのスポットに魚がいた証拠として数える
    const catches = records.filter((r) => recordOutcome(r).value === "landed");
    const total = catches.reduce((sum, r) => sum + (r.catch_count ?? 0), 0);
    const reactions = records.filter((r) => {
      const o = recordOutcome(r);
      return o.reaction && o.value !== "landed";
    }).reduce((sum, r) => sum + (r.catch_count ?? 0), 0);

    document.getElementById("content").innerHTML = `
      <div class="map-box" id="mini-map"></div>

      <div class="card">
        <div class="tags" style="margin-top:0">
          <span class="tag tag-gray">${icon(type.iconName, { size: 12 })} ${type.label}</span>
          <span class="tag tag-blue">${waterLabel(spot.water_type)}</span>
          ${spot.low_tide_only ? `<span class="tag tag-mustard">${icon("warning", { size: 12 })} 干潮時のみアクセス可</span>` : ""}
          ${spot.tide_station_code ? `<span class="tag tag-gray">潮汐観測点 ${escapeHtml(spot.tide_station_code)}</span>` : ""}
        </div>
        <div class="rows" style="margin-top:12px">
          <div class="row"><span class="label">座標</span>
            <span class="val">${hasPosition() ? `${spot.latitude}, ${spot.longitude}`
              : "未設定（編集から地図で指定）"}</span></div>
          <div class="row"><span class="label">登録者</span>
            <span class="val">${spot.is_mine ? "自分" : escapeHtml(spot.owner_name ?? "メンバー")}</span></div>
          <div class="row"><span class="label">釣行</span>
            <span class="val">${records.length} 回</span></div>
          <div class="row"><span class="label">釣果</span>
            <span class="val">${total} 匹</span></div>
          <!-- バラシ・ミスバイトは「魚がいた」証拠。ここに来るかを決める材料になる（D-092） -->
          <div class="row"><span class="label">反応（バラシ・アタリ）</span>
            <span class="val">${reactions} 回</span></div>
        </div>
        ${spot.memo ? `<div style="margin-top:12px;white-space:pre-wrap;font-size:14px">${escapeHtml(spot.memo)}</div>` : ""}
      </div>

      <div class="actions" style="margin-top:0">
        <a class="btn btn-quiet link-btn" href="${googleMapsUrl(spot)}" target="_blank" rel="noopener">${icon("map", { size: 15 })} Google マップ</a>
        <a class="btn link-btn" href="${googleDirectionsUrl(spot)}" target="_blank" rel="noopener">${icon("navigation", { size: 15 })} 経路案内</a>
      </div>

      <div class="section-label">
        <span>CATCH HISTORY</span>
        <a class="note" href="records.html?spot=${spot.id}">すべて見る →</a>
      </div>
      <div>${renderRecords()}</div>

      ${spot.is_mine ? `
        <div class="actions">
          <button type="button" class="btn btn-quiet" id="edit-toggle">${icon("edit", { size: 15 })} 編集</button>
          <button type="button" class="btn btn-quiet" id="delete">削除する</button>
        </div>` : `
        <div class="message shared-note">
          ${ownerBadge({ is_mine: false, owner_name: spot.owner_name })} さんのスポットです（閲覧のみ）
        </div>`}

      <section id="edit-panel" class="card" hidden>
        <h2>スポットを編集</h2>
        <div class="field"><label for="e-name">スポット名</label>
          <input type="text" id="e-name" maxlength="100"></div>
        <div class="field"><label>水域区分</label><div class="chips" id="e-water"></div></div>
        <div class="field"><label>スポット種別</label><div class="chips" id="e-type"></div></div>
        <div class="field toggle-row">
          <label for="e-lowtide" style="margin:0">干潮時のみアクセス可</label>
          <input type="checkbox" id="e-lowtide" style="width:auto">
        </div>
        <div class="field"><label for="e-memo">メモ</label><textarea id="e-memo" maxlength="2000"></textarea></div>
        <div class="field">
          <label for="e-tide-point">潮汐地点</label>
          <select id="e-tide-point"></select>
          <div class="page-sub" id="e-tide-note" style="margin-top:6px;line-height:1.5"></div>
        </div>
        <div class="field">
          <label>座標（地名で探すか、地図をタップして変更）</label>
          <!-- 地名検索（D-069）。位置未設定のスポットを直すときにこれが要る -->
          <div id="edit-place-search" style="margin-bottom:8px"></div>
          <div class="map-box" id="edit-map" style="margin-bottom:6px"></div>
          <div class="page-sub" id="e-coords"></div>
        </div>
        <div class="actions" style="margin-top:0">
          <button type="button" class="btn btn-quiet" id="edit-cancel">キャンセル</button>
          <button type="button" class="btn" id="edit-save">変更を保存</button>
        </div>
      </section>

      <section id="reassign-panel" class="card" hidden>
        <h2>釣果のスポット一括変更</h2>
        <div class="rows" style="margin-bottom:12px">
          <div class="row"><span class="label">変更前</span>
            <span class="val">${escapeHtml(spot.name ?? "無名スポット")}（${records.length}件）</span></div>
        </div>
        <div class="field">
          <label for="target-spot">変更先スポット</label>
          <select id="target-spot"></select>
        </div>
        <div class="actions" style="margin-top:0">
          <button type="button" class="btn btn-quiet" id="reassign-cancel">キャンセル</button>
          <button type="button" class="btn" id="reassign-run">全件を変更する</button>
        </div>
      </section>`;

    renderMiniMap();
    bind();
  }

  function renderRecords() {
    if (!records.length) return `<div class="empty">このスポットでの記録はまだありません。</div>`;
    return records.slice(0, 5).map((r) => {
      const outcome = recordOutcome(r);
      const title = outcome.value === "none"
        ? `${icon(outcome.iconName, { size: 15 })} ${outcome.label}`
        : `${outcome.value === "landed" ? "" : `<span class="tag ${outcome.tagClass}">${outcome.short}</span> `}`
          + `${escapeHtml(recordFishName(r))}${r.catch_count > 1 ? ` ×${r.catch_count}` : ""}`;
      const owner = r.is_mine === false ? `<span class="owner-badge">${escapeHtml(r.owner_name)}</span>` : "";
      return `
        <a class="list-item" href="record.html?id=${r.id}">
          <div class="thumb">${icon(outcome.iconName, { size: 20 })}</div>
          <div class="list-body">
            <div class="list-title">${owner}${title}</div>
            <div class="list-sub">${escapeHtml(formatJstDate(r.fished_at))}${
              r.fished_time ? " " + r.fished_time.slice(0, 5) : ""}</div>
          </div>
          ${r.tide_type ? `<span class="tag tag-blue">${escapeHtml(r.tide_type)}</span>` : ""}
        </a>`;
    }).join("");
  }

  function renderMiniMap() {
    // 位置が未設定（旧フォームの空欄で 0,0 になった等）なら静岡県の初期表示にする
    if (!hasPosition()) {
      const { map } = createMap("mini-map", { lock: true });
      map.scrollWheelZoom.disable();
      return;
    }
    const { map } = createMap("mini-map",
      { center: [spot.latitude, spot.longitude], zoom: 15, lock: true });
    L.marker([spot.latitude, spot.longitude], { icon: spotMarker(spot, { label: false }) }).addTo(map);
    map.scrollWheelZoom.disable();
  }

  function hasPosition() {
    return isCoordinateInJapan(spot.latitude, spot.longitude);
  }

  /* ---------- 編集 ---------- */
  function bind() {
    if (!spot.is_mine) return;   // 以下は編集用。他人のスポットには要素が無い
    document.getElementById("edit-toggle").addEventListener("click", openEdit);
    document.getElementById("edit-cancel").addEventListener("click", () => {
      document.getElementById("edit-panel").hidden = true;
    });
    document.getElementById("edit-save").addEventListener("click", saveEdit);
    document.getElementById("delete").addEventListener("click", tryDelete);
    document.getElementById("reassign-cancel").addEventListener("click", () => {
      document.getElementById("reassign-panel").hidden = true;
    });
    document.getElementById("reassign-run").addEventListener("click", runReassign);
  }

  function openEdit() {
    const panel = document.getElementById("edit-panel");
    panel.hidden = false;
    document.getElementById("e-name").value = spot.name ?? "";
    document.getElementById("e-memo").value = spot.memo ?? "";
    document.getElementById("e-lowtide").checked = Boolean(spot.low_tide_only);
    const positioned = hasPosition();
    Object.assign(edit, {
      lat: positioned ? Number(spot.latitude) : null,
      lng: positioned ? Number(spot.longitude) : null,
      water: spot.water_type, type: spot.spot_type,
    });
    renderEditChips();
    renderTidePointSelect();
    updateCoordsLabel();

    if (!editMap) {
      // 位置が未設定なら静岡県の初期表示にして、タップで決めてもらう
      const created = createMap("edit-map", positioned
        ? { center: [edit.lat, edit.lng], zoom: 15, lock: true }
        : { lock: true });
      editMap = created.map;
      if (positioned) placeEditPin(edit.lat, edit.lng);
      editMap.on("click", (e) => placeEditPin(e.latlng.lat, e.latlng.lng));
    }
    setTimeout(() => editMap.invalidateSize(), 50);
    panel.scrollIntoView({ behavior: "smooth" });
  }

  function placeEditPin(lat, lng) {
    edit.lat = Number(Number(lat).toFixed(6));
    edit.lng = Number(Number(lng).toFixed(6));
    const pinIcon = spotMarker(spot, { label: false });
    if (editMarker) editMarker.setLatLng([edit.lat, edit.lng]);
    else editMarker = L.marker([edit.lat, edit.lng], { icon: pinIcon }).addTo(editMap);
    updateCoordsLabel();
  }

  /* 地名で座標を直す（D-069）。位置未設定のまま残っているスポットは、
     地図を延々と動かさないと直せなかった */
  attachPlaceSearch(document.getElementById("edit-place-search"), (hit) => {
    if (!editMap) return;
    editMap.setView([hit.lat, hit.lng], 16);
    placeEditPin(hit.lat, hit.lng);
  });

  function updateCoordsLabel() {
    document.getElementById("e-coords").textContent = edit.lat == null
      ? "位置が未設定です。地図をタップして指定してください。"
      : `緯度 ${edit.lat} / 経度 ${edit.lng}`;
  }

  /* ---------- 潮汐地点（浜名湖などは基準観測点＋時差で推算する） ---------- */
  function renderTidePointSelect() {
    const select = document.getElementById("e-tide-point");
    const current = tidePointOfSpot(spot);
    const groups = [...new Set(tidePoints.map((p) => p.group))];
    select.innerHTML = `<option value="">座標から自動で決める</option>`
      + groups.map((group) => `
        <optgroup label="${escapeHtml(group)}">
          ${tidePoints.filter((p) => p.group === group)
            .map((p) => `<option value="${escapeHtml(p.value)}"${p.value === current ? " selected" : ""}
                    >${escapeHtml(p.label)}</option>`).join("")}
        </optgroup>`).join("");
    renderTidePointNote(select.value);
    select.onchange = () => renderTidePointNote(select.value);
  }

  function renderTidePointNote(value) {
    const box = document.getElementById("e-tide-note");
    const point = tidePoints.find((p) => p.value === value);
    if (!point) {
      box.textContent = "保存時に、座標から最も近い地点を自動で選びます。";
      return;
    }
    box.textContent = point.area
      ? `${point.baseName}の推算値を ${formatLag(point.lagMinutes)} ずらした推定値です。`
        + `${point.note ? ` ${point.note}。` : ""}${point.source ? ` 出典: ${point.source}` : ""}`
      : "気象庁の潮位表推算値をそのまま使います。";
  }

  function renderEditChips() {
    document.getElementById("e-water").innerHTML = WATER_TYPES
      .map((w) => `<span class="chip${w.value === edit.water ? " selected" : ""}"
                         data-value="${w.value}">${w.label}</span>`).join("");
    document.getElementById("e-type").innerHTML = SPOT_TYPES
      .map((t) => `<span class="chip${t.value === edit.type ? " selected" : ""}"
                         data-value="${t.value}">${icon(t.iconName, { size: 13 })} ${t.label}</span>`).join("");
  }

  document.addEventListener("click", (e) => {
    const chip = e.target.closest("#e-water .chip, #e-type .chip");
    if (!chip) return;
    if (chip.closest("#e-water")) edit.water = chip.dataset.value;
    else edit.type = chip.classList.contains("selected") ? null : chip.dataset.value;
    renderEditChips();
  });

  async function saveEdit(e) {
    if (edit.lat == null) return message("地図をタップして位置を指定してください。", "error");
    const button = e.currentTarget;
    button.disabled = true; button.textContent = "保存中…";

    // 空選択なら NULL を送り、トリガーに座標からの自動割り当てをさせる
    const chosen = tidePoints.find((p) => p.value === document.getElementById("e-tide-point").value);
    const payload = {
      name: document.getElementById("e-name").value.trim() || null,
      memo: document.getElementById("e-memo").value.trim() || null,
      latitude: edit.lat, longitude: edit.lng,
      water_type: edit.water, spot_type: edit.type,
      low_tide_only: document.getElementById("e-lowtide").checked,
      tide_area_code: chosen?.area ?? null,
    };
    // 観測点そのものを選んだときは基準観測点も合わせて上書きする
    if (chosen && !chosen.area) payload.tide_station_code = chosen.station;

    const { error } = await client.from("spots").update(payload).eq("id", spot.id);
    button.disabled = false; button.textContent = "変更を保存";
    if (error) return message(toJapaneseError(error), "error");
    // 地図を作り直すので、ピンの参照も一緒に捨てる。
    // 残しておくと、次に開いた地図に載っていないマーカーを動かそうとする
    editMap = null;
    editMarker = null;
    await load();
    message("スポットを更新しました。", "success");
  }

  /* ---------- 削除 → 一括変更への誘導（確定仕様書 17.2 章） ---------- */
  async function tryDelete() {
    if (records.length > 0) {
      const go = confirm(
        `${spot.name ?? "このスポット"}には${records.length}件の釣果記録が紐付いています。\n`
        + "削除する前にスポットを変更してください。\n\nOK で一括変更画面を開きます。");
      if (go) openReassign();
      return;
    }
    if (!confirm("このスポットを削除しますか？\nこの操作は取り消せません。")) return;
    const { error } = await client.from("spots").delete().eq("id", spot.id);
    if (error) return message(toJapaneseError(error), "error");
    navigate("spots.html", { replace: true });
  }

  function openReassign() {
    const panel = document.getElementById("reassign-panel");
    const options = allSpots.filter((s) => s.id !== spot.id);
    document.getElementById("target-spot").innerHTML = options.length
      ? options.map((s) => `<option value="${s.id}">${escapeHtml(s.name ?? "無名スポット")}</option>`).join("")
      : `<option value="">他のスポットがありません</option>`;
    panel.hidden = false;
    panel.scrollIntoView({ behavior: "smooth" });
  }

  async function runReassign(e) {
    const targetId = document.getElementById("target-spot").value;
    if (!targetId) return message("変更先のスポットを登録してください。", "error");
    const button = e.currentTarget;
    button.disabled = true; button.textContent = "変更中…";
    const { error } = await client.from("fishing_records")
      .update({ spot_id: targetId }).eq("spot_id", spot.id);
    button.disabled = false; button.textContent = "全件を変更する";
    if (error) return message(toJapaneseError(error), "error");
    document.getElementById("reassign-panel").hidden = true;
    await load();
    message(`釣果を一括変更しました。スポットを削除できます。`, "success");
  }

  function message(text, kind) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = `message ${kind}`;
    box.hidden = false;
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
